<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tennis</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #111;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    width: 100%;
    max-width: 440px;
    height: 100dvh;
    padding: 6px 8px;
    box-sizing: border-box;
    user-select: none;
  }
  canvas {
    display: block;
    background: #ffffff;
    touch-action: none;
    cursor: none;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #bar, #lvlbar {
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 12px;
    color: #111;
    width: 100%;
    justify-content: space-between;
  }
  #bar .group, #lvlbar .group { display: flex; gap: 8px; align-items: center; }
  button {
    font: inherit;
    padding: 4px 10px;
    border: 1px solid #111;
    background: #fff;
    border-radius: 0;
    cursor: pointer;
    color: #111;
  }
  button:hover { background: #f0f0f0; }
  #hint { font-size: 11px; color: #555; letter-spacing: 0.3px; text-align: center; }
  #scoreline { font-variant-numeric: tabular-nums; }
  #games { color: #555; font-size: 11px; }
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    width: 100px;
    height: 18px;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 2px; background: #111;
  }
  input[type=range]::-moz-range-track {
    height: 2px; background: #111;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 16px;
    background: #111; border: 0; margin-top: -7px;
  }
  input[type=range]::-moz-range-thumb {
    width: 10px; height: 16px;
    background: #111; border: 0; border-radius: 0;
  }
  #effval { font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <div class="group">
      <span id="scoreline">0 · 0</span>
      <span id="games">(0–0)</span>
    </div>
    <div class="group">
      <button id="serve">serve</button>
    </div>
  </div>
  <canvas id="c" width="440" height="780"></canvas>
  <div id="lvlbar">
    <div class="group">
      <span>lvl</span>
      <input id="diff" type="range" min="0" max="1" step="0.01" value="0.45">
      <span id="effval">0.45</span>
    </div>
    <div class="group">
      <span>str</span>
      <input id="str" type="range" min="0" max="1" step="0.01" value="0.5">
      <span id="strval">0.50</span>
    </div>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('scoreline');
  const gamesEl = document.getElementById('games');
  const diffEl = document.getElementById('diff');
  const effEl = document.getElementById('effval');
  const strEl = document.getElementById('str');
  const strvalEl = document.getElementById('strval');
  const serveBtn = document.getElementById('serve');

  // --- Sound ---
  let actx = null;
  function ensureAudio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function blip(freq, dur, vol, type) {
    if (!actx) return;
    const t = actx.currentTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(60, freq * 0.55), t + dur);
    g.gain.setValueAtTime(vol || 0.05, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  const SND = {
    hitP:   () => blip(880, 0.04, 0.05),
    hitC:   () => blip(660, 0.04, 0.05),
    serve:  () => { blip(520, 0.04, 0.04); setTimeout(() => blip(1040, 0.05, 0.05), 40); },
    ace:    () => { blip(880, 0.06, 0.07); setTimeout(() => blip(1320, 0.08, 0.07), 60); setTimeout(() => blip(1980, 0.18, 0.07), 140); },
    whoosh: () => blip(300, 0.08, 0.02, 'triangle'),
    win:    () => { blip(900, 0.08, 0.06); setTimeout(() => blip(1300, 0.1, 0.05), 80); },
    loss:   () => blip(220, 0.18, 0.04, 'triangle'),
    net:    () => blip(180, 0.1, 0.04, 'triangle'),
    game:   () => { blip(1200, 0.06, 0.06); setTimeout(() => blip(1600, 0.1, 0.06), 90); },
    set:    () => { blip(900, 0.1, 0.06); setTimeout(() => blip(1300, 0.1, 0.06), 120); setTimeout(() => blip(1700, 0.14, 0.06), 260); },
    match:  () => {
      [0, 140, 260, 420, 640].forEach((d, i) => {
        const freqs = [660, 880, 1100, 1320, 1760];
        setTimeout(() => blip(freqs[i], 0.16, 0.07), d);
      });
    },
  };

  // Fit canvas to its CSS box for a crisp portrait pixel surface.
  function fitCanvas() {
    const rect = canvas.getBoundingClientRect();
    // keep an internal resolution proportional to display, capped for perf
    const w = Math.min(480, Math.max(320, Math.round(rect.width)));
    const h = Math.min(900, Math.max(560, Math.round(rect.height)));
    canvas.width = w;
    canvas.height = h;
    rebuildCourt();
  }
  let W = canvas.width, H = canvas.height;
  const court = { x: 0, y: 0, w: 0, h: 0, net: 0 };
  function rebuildCourt() {
    W = canvas.width; H = canvas.height;
    court.x = 24;
    court.y = 32;
    court.w = W - 48;
    court.h = H - 64;
    court.net = court.y + court.h / 2;
    // clamp racket positions on resize
    if (state) {
      state.cpu.y = court.y + 36;
      const rxMin = court.x + RACKET_W / 2;
      const rxMax = court.x + court.w - RACKET_W / 2;
      state.player.x = clamp(state.player.x, rxMin, rxMax);
      state.cpu.x = clamp(state.cpu.x, rxMin, rxMax);
      state.player.y = clamp(state.player.y, court.net + 12, court.y + court.h - 8);
      if (!state.ball.live) resetServe(score.server);
    }
  }

  const RACKET_W = 36;
  const RACKET_H = 10;

  // --- Tennis scoring state ---
  const score = {
    p: 0, c: 0,                    // points within current game
    gamesP: 0, gamesC: 0,
    setsP: 0, setsC: 0,
    server: 'player',              // who serves the current game (alternates)
    tiebreak: false,
    tbP: 0, tbC: 0,
    tbTotalPoints: 0,              // for serve alternation during tiebreak
    matchOver: null,               // 'player' | 'cpu' | null
    message: 'tap to serve',
  };
  const SETS_TO_WIN = 2;           // best-of-3

  function pointLabel(mine, theirs) {
    const L = ['0', '15', '30', '40'];
    if (mine >= 3 && theirs >= 3) {
      if (mine === theirs) return '40';
      if (mine === theirs + 1) return 'Ad';
      return '40';
    }
    return L[Math.min(mine, 3)];
  }
  function updateScore() {
    if (score.matchOver) {
      scoreEl.textContent = score.matchOver === 'player' ? 'match: you' : 'match: cpu';
    } else if (score.tiebreak) {
      scoreEl.textContent = `tb ${score.tbP} · ${score.tbC}`;
    } else if (score.p >= 3 && score.c >= 3 && score.p === score.c) {
      scoreEl.textContent = 'deuce';
    } else if (score.p >= 3 && score.c >= 3 && Math.abs(score.p - score.c) === 1) {
      scoreEl.textContent = score.p > score.c ? 'ad in' : 'ad out';
    } else {
      scoreEl.textContent = `${pointLabel(score.p, score.c)} · ${pointLabel(score.c, score.p)}`;
    }
    gamesEl.textContent =
      `(${score.gamesP}–${score.gamesC}${score.setsP || score.setsC ? ` | sets ${score.setsP}–${score.setsC}` : ''})`;
    serveBtn.textContent = score.matchOver ? 'new match' : 'serve';
  }

  function winSet(winner) {
    if (winner === 'p') score.setsP += 1; else score.setsC += 1;
    score.gamesP = 0; score.gamesC = 0;
    score.p = 0; score.c = 0;
    score.tbP = 0; score.tbC = 0;
    score.tiebreak = false;
    const s = winner === 'p' ? score.setsP : score.setsC;
    if (s >= SETS_TO_WIN) {
      score.matchOver = winner === 'p' ? 'player' : 'cpu';
      score.message = winner === 'p' ? 'match: you' : 'match: cpu';
      SND.match();
    } else {
      score.message = winner === 'p' ? 'set: you' : 'set: cpu';
      SND.set();
    }
  }

  function awardPoint(who) {
    if (score.matchOver) return;

    if (score.tiebreak) {
      if (who === 'p') score.tbP += 1; else score.tbC += 1;
      score.tbTotalPoints += 1;
      // Tiebreak serve: first server does 1 point, then alternate every 2 points.
      // tbTotalPoints after 1st, 3rd, 5th... flips the server.
      if (score.tbTotalPoints === 1 || (score.tbTotalPoints > 1 && (score.tbTotalPoints - 1) % 2 === 0)) {
        score.server = score.server === 'player' ? 'cpu' : 'player';
      }
      const a = who === 'p' ? score.tbP : score.tbC;
      const b = who === 'p' ? score.tbC : score.tbP;
      if (a >= 7 && a - b >= 2) {
        winSet(who);
        score.server = (who === 'p') ? 'cpu' : 'player';
      } else {
        score.message = who === 'p' ? 'point: you' : 'point: cpu';
      }
    } else {
      if (who === 'p') score.p += 1; else score.c += 1;
      const a = who === 'p' ? score.p : score.c;
      const b = who === 'p' ? score.c : score.p;
      if (a >= 4 && a - b >= 2) {
        if (who === 'p') score.gamesP += 1; else score.gamesC += 1;
        score.p = 0; score.c = 0;
        score.server = score.server === 'player' ? 'cpu' : 'player';

        const ga = who === 'p' ? score.gamesP : score.gamesC;
        const gb = who === 'p' ? score.gamesC : score.gamesP;
        if (ga >= 6 && ga - gb >= 2) {
          winSet(who);
        } else if (score.gamesP === 6 && score.gamesC === 6) {
          score.tiebreak = true;
          score.tbP = 0; score.tbC = 0;
          score.tbTotalPoints = 0;
          score.message = 'tiebreak';
          SND.game();
        } else {
          score.message = who === 'p' ? 'game: you' : 'game: cpu';
          SND.game();
        }
      } else {
        score.message = who === 'p' ? 'you' : 'cpu';
      }
    }
    updateScore();
  }

  function newMatch() {
    score.p = 0; score.c = 0;
    score.gamesP = 0; score.gamesC = 0;
    score.setsP = 0; score.setsC = 0;
    score.tbP = 0; score.tbC = 0;
    score.tbTotalPoints = 0;
    score.tiebreak = false;
    score.server = 'player';
    score.matchOver = null;
    score.message = 'new match';
    updateScore();
    resetServe(score.server);
  }

  const state = {
    player: { x: 220, y: 700, vx: 0, vy: 0, stam: 1 },
    cpu:    { x: 220, y: 80,  vx: 0, vy: 0 },
    ball:   { x: 220, y: 690, vx: 0, vy: 0, live: false, owner: 'player', prevY: 0, trailT: 0 },
    pointer: { x: 220, y: 700, vx: 0, vy: 0, vxPeak: 0, vyPeak: 0, lastT: 0, active: false, lastWhoosh: 0 },
    tPrev:  performance.now(),
    efficiency: parseFloat(diffEl.value),
    strength: parseFloat(strEl.value),
    aceShout: 0,
    autoServeT: null,
  };

  effEl.textContent = state.efficiency.toFixed(2);
  diffEl.addEventListener('input', () => {
    state.efficiency = parseFloat(diffEl.value);
    effEl.textContent = state.efficiency.toFixed(2);
  });
  strvalEl.textContent = state.strength.toFixed(2);
  strEl.addEventListener('input', () => {
    state.strength = parseFloat(strEl.value);
    strvalEl.textContent = state.strength.toFixed(2);
  });

  function resetServe(who) {
    state.ball.live = false;
    state.ball.vx = 0;
    state.ball.vy = 0;
    state.ball.owner = who;
    if (who === 'player') {
      state.ball.x = state.player.x;
      state.ball.y = state.player.y - 10;
    } else {
      state.ball.x = state.cpu.x;
      state.ball.y = state.cpu.y + 10;
    }
    state.ball.prevY = state.ball.y;
  }
  function serve() {
    if (state.ball.live || score.matchOver) return;
    if (state.ball.owner === 'player') {
      // Player serve: flick-driven power, strength-scaled. A long, fast,
      // mostly-vertical flick triggers an ace boost.
      const vxP = state.pointer.vxPeak;
      const vyP = state.pointer.vyPeak;
      const upward = -vyP;
      const speed = Math.hypot(vxP, vyP);
      const isAce =
        upward > 5 && speed > 5.5 && Math.abs(vxP) < upward * 0.45;
      const stamFactor = 0.45 + 0.55 * state.player.stam;
      const strBoost = (0.6 + state.strength * 0.7) * stamFactor;
      const aceMul = isAce ? 1.45 : 1.0;
      const boost = clamp(upward * 0.55, 0, 2.2);
      state.ball.vy = clamp((-0.9 - boost) * strBoost * aceMul, -3.8, -0.4);
      state.ball.vx = clamp(((Math.random() - 0.5) * 0.3 + vxP * 0.35) * strBoost, -2.2, 2.2);
      state.pointer.vxPeak *= 0.2;
      state.pointer.vyPeak *= 0.2;
      // Serves drain a bit more than rally; aces drain a lot more.
      state.player.stam = Math.max(0, state.player.stam - (isAce ? 0.18 : 0.06));
      if (isAce) {
        state.aceShout = 70;
        SND.ace();
      }
    } else {
      const eff = state.efficiency;
      state.ball.vy = 0.9 + eff * 0.5;
      state.ball.vx = (Math.random() - 0.5) * (0.3 + eff * 0.6);
    }
    state.ball.live = true;
    state.ball.prevY = state.ball.y;
    state.ball.trailT = 28;
    score.message = '';
    SND.serve();
  }
  serveBtn.addEventListener('click', () => {
    ensureAudio();
    if (score.matchOver) { newMatch(); return; }
    serve();
  });

  function afterPoint() {
    resetServe(score.server);
    clearTimeout(state.autoServeT);
    if (score.matchOver) return;
    if (score.server === 'cpu') {
      state.autoServeT = setTimeout(() => {
        if (!state.ball.live && !score.matchOver) serve();
      }, 1100);
    }
  }

  function canvasCoords(e) {
    const r = canvas.getBoundingClientRect();
    const sx = canvas.width / r.width;
    const sy = canvas.height / r.height;
    return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
  }
  function onPointerMove(e) {
    e.preventDefault();
    const p = canvasCoords(e);
    const now = performance.now();
    const dt = Math.max(1, now - state.pointer.lastT);
    state.pointer.vx = (p.x - state.pointer.x) / dt * 22;
    state.pointer.vy = (p.y - state.pointer.y) / dt * 22;
    // Flick memory: hold onto the strongest recent swipe so the shot
    // captures the thumb even if the finger is already slowing at contact.
    if (Math.abs(state.pointer.vx) > Math.abs(state.pointer.vxPeak)) state.pointer.vxPeak = state.pointer.vx;
    if (Math.abs(state.pointer.vy) > Math.abs(state.pointer.vyPeak)) state.pointer.vyPeak = state.pointer.vy;
    const speed = Math.hypot(state.pointer.vx, state.pointer.vy);
    if (speed > 3.5 && now - state.pointer.lastWhoosh > 220) {
      state.pointer.lastWhoosh = now;
      SND.whoosh();
    }
    state.pointer.x = p.x;
    state.pointer.y = p.y;
    state.pointer.lastT = now;
    state.pointer.active = true;
  }
  function onPointerDown(e) {
    ensureAudio();
    const p = canvasCoords(e);
    state.pointer.x = p.x;
    state.pointer.y = p.y;
    state.pointer.lastT = performance.now();
    state.pointer.vx = 0;
    state.pointer.vy = 0;
    state.pointer.active = true;
    if (score.matchOver) { newMatch(); return; }
    if (!state.ball.live && state.ball.owner === 'player') serve();
  }
  function onPointerUp() {
    state.pointer.active = false;
    state.pointer.vx *= 0.5;
    state.pointer.vy *= 0.5;
  }
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  canvas.addEventListener('pointerleave', onPointerUp);

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  function step(now) {
    const dtMs = Math.min(50, now - state.tPrev);
    state.tPrev = now;
    const dt = dtMs / 16.67;
    // Flick memory decays: retain ~55% after 200ms.
    const decay = Math.pow(0.94, dt);
    state.pointer.vxPeak *= decay;
    state.pointer.vyPeak *= decay;
    if (state.aceShout > 0) state.aceShout = Math.max(0, state.aceShout - dt);
    // Stamina recovery: brisk between points, slow during a live rally.
    const recoverPerSec = state.ball.live ? 0.04 : 0.18;
    state.player.stam = Math.min(1, state.player.stam + recoverPerSec * dtMs / 1000);

    // Player legal area: anywhere in their half, between the net and the baseline.
    const playerYMin = court.net + 12;
    const playerYMax = court.y + court.h - 8;
    const rxMin = court.x + RACKET_W / 2;
    const rxMax = court.x + court.w - RACKET_W / 2;

    // Player racket follows the pointer in 2D within the legal area.
    const targetX = state.pointer.active ? state.pointer.x : state.player.x;
    const targetY = state.pointer.active ? state.pointer.y : state.player.y;
    const prevPX = state.player.x;
    const prevPY = state.player.y;
    state.player.x += (targetX - state.player.x) * Math.min(1, 0.6 * dt);
    state.player.y += (targetY - state.player.y) * Math.min(1, 0.6 * dt);
    state.player.x = clamp(state.player.x, rxMin, rxMax);
    state.player.y = clamp(state.player.y, playerYMin, playerYMax);
    state.player.vx = (state.player.x - prevPX) / Math.max(dt, 0.001);
    state.player.vy = (state.player.y - prevPY) / Math.max(dt, 0.001);

    // CPU AI: attack — come forward when the ball is incoming, partially
    // retreat while it's going away. Forward distance scales with eff.
    // For CPU at the top, "forward" means INCREASING y (toward the net).
    const eff = state.efficiency;
    const ball = state.ball;
    const cpuHomeY = court.y + 36;
    const cpuMaxFwd = court.net - 18;
    const cpuYMin = court.y + 8;
    const cpuYMax = court.net - 12;
    let cpuTargetX = state.cpu.x;
    let cpuTargetY = cpuHomeY;
    if (ball.live) {
      if (ball.vy < 0) {
        cpuTargetY = cpuHomeY + (cpuMaxFwd - cpuHomeY) * eff;
      } else {
        cpuTargetY = cpuHomeY + (cpuMaxFwd - cpuHomeY) * eff * 0.3;
      }
      // Predict where the ball will be at the target intercept line.
      if (ball.vy < 0) {
        const t = (cpuTargetY - ball.y) / ball.vy;
        cpuTargetX = ball.x + ball.vx * t;
        cpuTargetX += (Math.random() - 0.5) * (1 - eff) * 160;
      }
    }
    const cpuPrevX = state.cpu.x;
    const cpuPrevY = state.cpu.y;
    const cpuLerp = 0.03 + eff * 0.22;
    state.cpu.x += (cpuTargetX - state.cpu.x) * Math.min(1, cpuLerp * dt);
    state.cpu.y += (cpuTargetY - state.cpu.y) * Math.min(1, cpuLerp * 0.7 * dt);
    state.cpu.x = clamp(state.cpu.x, rxMin, rxMax);
    state.cpu.y = clamp(state.cpu.y, cpuYMin, cpuYMax);
    state.cpu.vx = (state.cpu.x - cpuPrevX) / Math.max(dt, 0.001);
    state.cpu.vy = (state.cpu.y - cpuPrevY) / Math.max(dt, 0.001);

    if (ball.live) {
      const prevY = ball.y;
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      ball.vx *= Math.pow(0.999, dt);
      ball.vy *= Math.pow(0.9995, dt);
      if (ball.trailT > 0) ball.trailT -= dt;

      // --- racket collisions ---
      // player (bottom): swept check — the racket itself may have moved during the frame
      if (ball.live && ball.vy > 0) {
        const rYmin = Math.min(prevPY, state.player.y) - RACKET_H;
        const rYmax = Math.max(prevPY, state.player.y) + 4;
        const bYmin = Math.min(prevY, ball.y);
        const bYmax = Math.max(prevY, ball.y);
        const yHit = !(bYmax < rYmin || bYmin > rYmax);
        const xHit = Math.abs(ball.x - state.player.x) < RACKET_W / 2 + 2;
        if (yHit && xHit) {
          ball.y = state.player.y - RACKET_H;
          // Effective power = inherent strength × current stamina factor.
          const stamFactor = 0.45 + 0.55 * state.player.stam;
          const strBoost = (0.6 + state.strength * 0.7) * stamFactor;
          const base = -(Math.max(0.6, Math.abs(ball.vy))) - 0.1;
          ball.vy = clamp((base + state.pointer.vyPeak * 0.7) * strBoost, -5.0, -0.05);
          ball.vx = clamp((state.pointer.vxPeak * 0.7 + state.player.vx * 0.25) * strBoost, -4.0, 4.0);
          state.pointer.vxPeak *= 0.2;
          state.pointer.vyPeak *= 0.2;
          // Drain: harder shots (more vy) cost more stamina.
          const drain = 0.04 + Math.min(0.06, Math.abs(ball.vy) / 60);
          state.player.stam = Math.max(0, state.player.stam - drain);
          ball.owner = 'cpu';
          ball.trailT = 28;
          SND.hitP();
        }
      }
      // cpu (top): swept check too
      if (ball.live && ball.vy < 0) {
        const rYmin = Math.min(cpuPrevY, state.cpu.y) - 4;
        const rYmax = Math.max(cpuPrevY, state.cpu.y) + RACKET_H;
        const bYmin = Math.min(prevY, ball.y);
        const bYmax = Math.max(prevY, ball.y);
        const yHit = !(bYmax < rYmin || bYmin > rYmax);
        const xHit = Math.abs(ball.x - state.cpu.x) < RACKET_W / 2 + 2;
        if (yHit && xHit) {
          const miss = Math.random() > (0.55 + eff * 0.45);
          if (!miss) {
            ball.y = state.cpu.y + RACKET_H;
            ball.vy = Math.max(0.7, Math.abs(ball.vy)) + 0.1 + eff * 0.3;
            const aim = (state.player.x > (court.x + court.w / 2) ? -1 : 1) * eff * 1.0;
            ball.vx = clamp(aim + state.cpu.vx * 0.35 + (Math.random() - 0.5) * (1 - eff) * 0.8, -2.6, 2.6);
            ball.owner = 'player';
            ball.trailT = 28;
            SND.hitC();
          }
        }
      }

      // --- side-out: ball leaves the sidelines = last hitter missed ---
      if (ball.live && (ball.x < court.x + 1 || ball.x > court.x + court.w - 1)) {
        // ball.owner is the next-to-hit player; winner of the point is that player.
        const winner = ball.owner === 'player' ? 'p' : 'c';
        (winner === 'p' ? SND.win : SND.loss)();
        awardPoint(winner);
        afterPoint();
      }

      // --- baseline out: went past a racket = that player lost the point ---
      if (ball.live && ball.y > court.y + court.h) {
        // player whiffed → cpu wins
        SND.loss();
        awardPoint('c');
        afterPoint();
      } else if (ball.live && ball.y < court.y) {
        // cpu whiffed → player wins
        SND.win();
        awardPoint('p');
        afterPoint();
      }
    } else {
      // ball rests with the current server
      if (state.ball.owner === 'player') {
        state.ball.x = state.player.x; state.ball.y = state.player.y - 10;
      } else {
        state.ball.x = state.cpu.x; state.ball.y = state.cpu.y + 10;
      }
    }

    draw();
    requestAnimationFrame(step);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    ctx.strokeStyle = '#111';
    ctx.lineWidth = 2;
    ctx.strokeRect(court.x, court.y, court.w, court.h);

    // service boxes (kept as 1px hairlines)
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(court.x + 0.5, court.y + court.h * 0.28 + 0.5);
    ctx.lineTo(court.x + court.w + 0.5, court.y + court.h * 0.28 + 0.5);
    ctx.moveTo(court.x + 0.5, court.y + court.h * 0.72 + 0.5);
    ctx.lineTo(court.x + court.w + 0.5, court.y + court.h * 0.72 + 0.5);
    const cx = court.x + court.w / 2;
    ctx.moveTo(cx + 0.5, court.y + court.h * 0.28 + 0.5);
    ctx.lineTo(cx + 0.5, court.y + court.h * 0.72 + 0.5);
    ctx.stroke();

    // net
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(court.x, court.net + 0.5);
    ctx.lineTo(court.x + court.w, court.net + 0.5);
    ctx.stroke();
    ctx.restore();

    drawRacket(state.cpu.x, state.cpu.y, 'top');
    drawRacket(state.player.x, state.player.y, 'bottom');

    // server indicator: small dot just outside the court beside the server's racket
    {
      const sv = score.server;
      const rx = sv === 'player' ? state.player.x : state.cpu.x;
      const ry = sv === 'player' ? state.player.y : state.cpu.y;
      const dotY = sv === 'player' ? ry + 18 : ry - 18;
      ctx.fillStyle = '#111';
      ctx.fillRect(Math.round(rx) - 1, Math.round(dotY) - 1, 3, 3);
    }

    // ball
    const BALL = 6;
    const bcx = Math.round(state.ball.x);
    const bcy = Math.round(state.ball.y);
    ctx.fillStyle = '#111';
    ctx.fillRect(bcx - BALL / 2, bcy - BALL / 2, BALL, BALL);
    // post-hit trajectory: two dots behind the ball along its travel direction
    if (state.ball.live && state.ball.trailT > 0) {
      const sp = Math.hypot(state.ball.vx, state.ball.vy);
      if (sp > 0.05) {
        const ux = -state.ball.vx / sp;
        const uy = -state.ball.vy / sp;
        const fade = clamp(state.ball.trailT / 28, 0, 1);
        ctx.globalAlpha = 0.55 * fade;
        ctx.fillRect(Math.round(bcx + ux * 7) - 1, Math.round(bcy + uy * 7) - 1, 3, 3);
        ctx.globalAlpha = 0.3 * fade;
        ctx.fillRect(Math.round(bcx + ux * 14) - 1, Math.round(bcy + uy * 14) - 1, 2, 2);
        ctx.globalAlpha = 1;
      }
    }

    if (score.message) {
      ctx.fillStyle = '#111';
      ctx.font = '11px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(score.message, W / 2, court.net - 8);
    }

    // Stamina bar (player) in the bottom margin.
    {
      const sx = court.x;
      const sy = court.y + court.h + 8;
      const sw = court.w;
      const sh = 3;
      ctx.strokeStyle = '#bbb';
      ctx.strokeRect(sx + 0.5, sy + 0.5, sw, sh);
      ctx.fillStyle = state.player.stam < 0.25 ? '#777' : '#111';
      ctx.fillRect(sx + 1, sy + 1, Math.max(0, (sw - 1) * state.player.stam), sh - 1);
      ctx.fillStyle = '#666';
      ctx.font = '9px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'left';
      ctx.fillText('stam', sx, sy - 2);
    }

    if (state.aceShout > 0) {
      const a = clamp(state.aceShout / 70, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = '#111';
      ctx.font = '20px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('ACE', W / 2, court.net + 4);
      ctx.globalAlpha = 1;
    }

    if (score.matchOver) {
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = '#fff';
      ctx.fillRect(court.x + 8, court.net - 40, court.w - 16, 80);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#111';
      ctx.strokeRect(court.x + 8.5, court.net - 39.5, court.w - 17, 79);
      ctx.fillStyle = '#111';
      ctx.textAlign = 'center';
      ctx.font = '14px ui-monospace, Menlo, monospace';
      ctx.fillText(score.matchOver === 'player' ? 'MATCH · YOU' : 'MATCH · CPU', W / 2, court.net - 12);
      ctx.font = '11px ui-monospace, Menlo, monospace';
      ctx.fillText('tap to play again', W / 2, court.net + 8);
      ctx.fillText(`sets ${score.setsP}–${score.setsC}`, W / 2, court.net + 26);
    }
  }

  function drawRacket(cx, cy, side) {
    // Oval head + short handle pointing toward own baseline.
    const headHalfW = 18, headHalfH = 5;
    ctx.strokeStyle = '#111';
    ctx.fillStyle = '#111';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(cx, cy, headHalfW, headHalfH, 0, 0, Math.PI * 2);
    ctx.stroke();
    // a single string line for character
    ctx.beginPath();
    ctx.moveTo(Math.round(cx - headHalfW + 3) + 0.5, Math.round(cy) + 0.5);
    ctx.lineTo(Math.round(cx + headHalfW - 3) + 0.5, Math.round(cy) + 0.5);
    ctx.stroke();
    // handle toward own side
    const handleLen = 9;
    const hx = Math.round(cx) - 1;
    const hy = side === 'bottom'
      ? Math.round(cy + headHalfH)
      : Math.round(cy - headHalfH) - handleLen;
    ctx.fillRect(hx, hy, 2, handleLen);
  }

  // init
  window.addEventListener('resize', fitCanvas);
  fitCanvas();
  updateScore();
  resetServe('player');
  requestAnimationFrame((t) => { state.tPrev = t; step(t); });
})();
</script>
</body>
</html>
