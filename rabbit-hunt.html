<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rabbit Hunt</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "SF Mono", "Menlo", "Courier New", monospace;
  }
  #stage {
    position: relative;
    width: 100vw;
    max-width: 900px;
  }
  canvas {
    display: block;
    width: 100%;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    background: #ffffff;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }
  #hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    color: #2b1810;
    font-weight: 700;
    font-size: clamp(14px, 2.4vw, 22px);
    letter-spacing: 0.5px;
    -webkit-font-smoothing: antialiased;
  }
  #hudRight { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
  #best { font-size: 0.7em; opacity: 0.7; font-weight: 600; }
  #title { }
  #timer { font-variant-numeric: tabular-nums; transition: color 0.2s; }
  #timer.urgent { color: #d62828; animation: pulse 0.6s ease-in-out infinite; }
  #score { font-variant-numeric: tabular-nums; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .popup {
    position: absolute;
    pointer-events: none;
    font-weight: 800;
    font-size: clamp(14px, 2.6vw, 22px);
    color: #d62828;
    transform: translate(-50%, -100%);
    animation: floatUp 0.9s ease-out forwards;
    text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
    -webkit-font-smoothing: antialiased;
  }
  .popup.gold { color: #c89010; }
  @keyframes floatUp {
    0% { opacity: 1; transform: translate(-50%, -100%); }
    100% { opacity: 0; transform: translate(-50%, -220%); }
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    background: rgba(255,255,255,0.88);
    color: #2b1810;
    pointer-events: auto;
    cursor: pointer;
    text-align: center;
    padding: 0 20px;
  }
  #overlay.show { display: flex; }
  #overlay .big { font-size: clamp(22px, 5vw, 42px); font-weight: 800; }
  #overlay .sub { font-size: clamp(14px, 2.4vw, 20px); }
  #overlay .stats { font-size: clamp(12px, 2vw, 16px); opacity: 0.8; }
  #overlay .hint { margin-top: 6px; font-size: clamp(12px, 2vw, 16px); opacity: 0.7; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud">
    <span id="title">RABBIT HUNT</span>
    <span id="timer">1:00</span>
    <span id="hudRight">
      <span id="score">Score: 0</span>
      <span id="best">Best: 0</span>
    </span>
  </div>
  <div id="overlay">
    <div class="big" id="overTitle">Time's up!</div>
    <div class="sub" id="overScore">Score: 0</div>
    <div class="stats" id="overStats">Caught: 0 · Missed: 0 · Best streak: 0</div>
    <div class="hint">Tap to play again</div>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const titleEl = document.getElementById('title');
  const timerEl = document.getElementById('timer');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const stage = document.getElementById('stage');
  const overlay = document.getElementById('overlay');
  const overScoreEl = document.getElementById('overScore');
  const overStatsEl = document.getElementById('overStats');

  const W = 240, H = 200;
  canvas.width = W;
  canvas.height = H;
  ctx.imageSmoothingEnabled = false;

  const C = {
    o: '#2b1810',
    y: '#e0a84a',
    c: '#fbecd0',
    s: '#4a2c18',
    b: '#000000',
    p: '#e87a92',
    r: '#e02020',
    rL: '#ff5050',
  };

  function px(x, y, col) {
    if (!col) return;
    ctx.fillStyle = col;
    ctx.fillRect(x, y, 1, 1);
  }

  // ---- Audio (lazy init on first user gesture) ----
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      try {
        const Ctor = window.AudioContext || window.webkitAudioContext;
        if (Ctor) audioCtx = new Ctor();
      } catch (e) { /* ignore */ }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function tone(freq, dur, type, vol, slideTo) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  function playPop(comboN) {
    const c = Math.max(1, comboN || 1);
    const base = 720 + Math.min(c - 1, 8) * 90;
    tone(base, 0.13, 'triangle', 0.17, base * 0.3);
  }
  function playSparkle() {
    [880, 1320, 1760].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'sine', 0.16), i * 60));
  }
  function playTick() { tone(1400, 0.04, 'square', 0.07); }
  function playEscape() {
    // Little "aww" as a rabbit gets away
    tone(540, 0.22, 'triangle', 0.12, 300);
  }
  function playFlip() {
    tone(1100, 0.07, 'square', 0.10, 1700);
  }
  function playJump() {
    tone(360, 0.07, 'sine', 0.14, 900);
    setTimeout(() => tone(920, 0.11, 'sine', 0.14, 1500), 45);
  }
  function playFanfare() {
    // Cheerful ascending arpeggio for level-up / new best
    const notes = [523, 659, 784, 1046, 1319];
    notes.forEach((f, i) => setTimeout(() => tone(f, 0.22, 'triangle', 0.18), i * 85));
  }
  function playGameOver() {
    // Descending "game over" theme
    const notes = [440, 392, 330, 262];
    notes.forEach((f, i) => setTimeout(() => tone(f, 0.24, 'triangle', 0.16), i * 130));
  }
  function playStart() {
    // Quick start chirp
    tone(660, 0.08, 'triangle', 0.15, 990);
    setTimeout(() => tone(990, 0.1, 'triangle', 0.15), 90);
  }
  function playGoldAppear() {
    tone(1760, 0.06, 'sine', 0.10);
    setTimeout(() => tone(2200, 0.08, 'sine', 0.10), 40);
  }

  // ---- Floating score popups (HTML overlays for sharp text) ----
  function showPopup(canvasX, canvasY, text, gold) {
    const rect = canvas.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    const sx = (canvasX / W) * rect.width + (rect.left - stageRect.left);
    const sy = (canvasY / H) * rect.height + (rect.top - stageRect.top);
    const div = document.createElement('div');
    div.className = 'popup' + (gold ? ' gold' : '');
    div.textContent = text;
    div.style.left = sx + 'px';
    div.style.top = sy + 'px';
    stage.appendChild(div);
    setTimeout(() => div.remove(), 900);
  }

  function drawLeopard(ox, oy, frame, standing) {
    px(ox+20, oy+4, C.o);
    px(ox+21, oy+3, C.o);
    px(ox+22, oy+2, C.o);
    px(ox+22, oy+1, C.o);
    px(ox+21, oy+1, C.y);
    px(ox+21, oy+2, C.y);

    for (let i = 5; i <= 19; i++) px(ox+i, oy+2, C.o);
    for (let i = 5; i <= 19; i++) px(ox+i, oy+8, C.o);
    px(ox+20, oy+3, C.o);
    px(ox+20, oy+5, C.o);
    px(ox+20, oy+6, C.o);
    px(ox+20, oy+7, C.o);
    px(ox+20, oy+8, C.o);

    for (let j = 3; j <= 6; j++) {
      for (let i = 5; i <= 19; i++) px(ox+i, oy+j, C.y);
    }
    for (let i = 5; i <= 19; i++) px(ox+i, oy+7, C.c);

    px(ox+7,  oy+3, C.s);
    px(ox+10, oy+4, C.s); px(ox+11, oy+4, C.s);
    px(ox+14, oy+3, C.s);
    px(ox+16, oy+5, C.s); px(ox+17, oy+5, C.s);
    px(ox+13, oy+6, C.s);
    px(ox+9,  oy+6, C.s);

    for (let j = 3; j <= 6; j++) {
      for (let i = 1; i <= 4; i++) px(ox+i, oy+j, C.y);
    }
    px(ox, oy+4, C.o);
    px(ox, oy+5, C.o);
    px(ox, oy+6, C.o);
    px(ox+1, oy+3, C.o);
    px(ox+2, oy+3, C.o);
    px(ox+3, oy+3, C.o);
    px(ox+4, oy+3, C.o);
    px(ox+1, oy+7, C.o);
    px(ox+2, oy+7, C.o);
    px(ox+3, oy+7, C.o);
    px(ox+4, oy+7, C.o);

    px(ox+1, oy+2, C.o);
    px(ox+4, oy+2, C.o);

    px(ox+3, oy+5, C.b);
    px(ox, oy+4, C.p);
    px(ox+1, oy+6, C.s);

    const legX = [7, 10, 16, 19];
    const lenA = [3, 2, 2, 3];
    const lenB = [2, 3, 3, 2];
    const lenStand = [3, 3, 3, 3];
    const lengths = standing ? lenStand : (frame === 0 ? lenA : lenB);

    for (let k = 0; k < 4; k++) {
      const lx = ox + legX[k];
      const len = lengths[k];
      for (let j = 0; j < len; j++) {
        px(lx, oy + 9 + j, C.o);
      }
      px(lx - 1, oy + 9 + len - 1, C.o);
      px(lx + 1, oy + 9 + len - 1, C.o);
    }
  }

  const RW = 10, RH = 9;

  function drawRabbit(ox, oy, type) {
    const body = type === 'gold' ? '#f2c430' : C.c;
    px(ox+2, oy,   C.o); px(ox+3, oy,   C.o);
    px(ox+6, oy,   C.o); px(ox+7, oy,   C.o);
    px(ox+2, oy+1, C.o); px(ox+3, oy+1, body);
    px(ox+6, oy+1, body); px(ox+7, oy+1, C.o);
    px(ox+2, oy+2, C.o); px(ox+3, oy+2, body);
    px(ox+6, oy+2, body); px(ox+7, oy+2, C.o);
    px(ox+1, oy+3, C.o); px(ox+8, oy+3, C.o);
    for (let i = 2; i <= 7; i++) px(ox+i, oy+3, C.o);
    for (let i = 1; i <= 8; i++) px(ox+i, oy+4, body);
    px(ox+3, oy+4, C.b);
    px(ox+6, oy+4, C.b);
    px(ox,   oy+5, C.o);
    for (let i = 1; i <= 8; i++) px(ox+i, oy+5, body);
    px(ox+9, oy+5, C.o);
    px(ox+4, oy+5, C.p);
    px(ox+5, oy+5, C.p);
    px(ox,   oy+6, C.o);
    for (let i = 1; i <= 8; i++) px(ox+i, oy+6, body);
    px(ox+9, oy+6, C.o);
    px(ox+1, oy+7, C.o); px(ox+2, oy+7, C.o);
    for (let i = 3; i <= 6; i++) px(ox+i, oy+7, body);
    px(ox+7, oy+7, C.o); px(ox+8, oy+7, C.o);
    px(ox+1, oy+8, C.o); px(ox+2, oy+8, C.o);
    px(ox+7, oy+8, C.o); px(ox+8, oy+8, C.o);
    if (type === 'gold') {
      // sparkle
      px(ox+5, oy+6, '#ffffff');
      px(ox+2, oy+5, '#fff0a0');
    }
  }

  function drawBurst(cx, cy, t) {
    // t is 0..1 progress; bright red burst growing outward
    const r = Math.floor(2 + t * 7);
    const col = t < 0.5 ? C.rL : C.r;
    for (let i = -r; i <= r; i++) {
      px(cx + i, cy, col);
      px(cx, cy + i, col);
    }
    const d = Math.max(1, Math.floor(r * 0.7));
    for (let i = -d; i <= d; i++) {
      px(cx + i, cy + i, col);
      px(cx + i, cy - i, col);
    }
    // center highlight
    px(cx, cy, '#ffffff');
    px(cx+1, cy, '#ffffff');
    px(cx-1, cy, '#ffffff');
    px(cx, cy+1, '#ffffff');
    px(cx, cy-1, '#ffffff');
  }

  let groundY = Math.floor(H * 0.6);
  const groundMin = 13;
  let groundMax = H - 1;

  // ---- Tree (Level 2) ----
  const BRANCH_Y = 100;
  const TREE_APPEAR_AT = 30000;
  const LEVEL_2_SCORE = 20;
  const LEVEL_3_SCORE = 40;
  const LEVEL_4_SCORE = 70;

  // Tree geometry (squat, bushy, wide)
  const TREE = {
    trunkX1: 106, trunkX2: 134, trunkY1: 30, trunkY2: 150,
    branchX1: 30, branchX2: 210, branchY: BRANCH_Y,
  };

  function line(x0, y0, x1, y1, col) {
    let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
    let sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx - dy;
    let x = x0, y = y0;
    while (true) {
      px(x, y, col);
      if (x === x1 && y === y1) break;
      const e2 = 2 * err;
      if (e2 > -dy) { err -= dy; x += sx; }
      if (e2 < dx) { err += dx; y += sy; }
    }
  }

  function drawTree() {
    const bark = '#6a4428';
    const barkD = '#3a2410';
    const barkL = '#8c6442';

    // ---- Thick, squat, twisted trunk base (y=150 -> 108) ----
    for (let y = 150; y >= 108; y--) {
      const t = (150 - y) / 42; // 0 at base, 1 at top of trunk
      // wander centre slightly with knots
      const cx = 120 + Math.sin(t * 4.2) * 2 + Math.sin(t * 1.7) * 1.5;
      // width tapers from ~13 at base to ~7 at top
      const w = Math.max(6, Math.round(13 - t * 6));
      const xStart = Math.round(cx - w / 2);
      for (let i = 0; i < w; i++) {
        let col = bark;
        if (i === 0) col = barkL;
        else if (i === w - 1) col = barkD;
        else if (i === w - 2) col = barkD;
        // add bark knots / texture
        if (((y * 7 + i * 11) % 13) === 0) col = barkD;
        px(xStart + i, y, col);
      }
    }
    // Root flare at the very bottom
    for (let k = 0; k < 4; k++) {
      px(112 - k, 150 - Math.floor(k / 2), barkD);
      px(128 + k, 150 - Math.floor(k / 2), barkD);
    }

    // ---- Main horizontal sitting branch (thick limb) ----
    for (let x = 30; x <= 210; x++) {
      // subtle sag / wobble
      const dy = (Math.sin((x - 30) / 14) > 0.9) ? -1 : 0;
      const y = BRANCH_Y + dy;
      px(x, y, bark);
      px(x, y + 1, barkD);
    }
    // Connect branch into trunk with a knot
    for (let x = 110; x <= 130; x++) {
      px(x, BRANCH_Y - 1, bark);
      px(x, BRANCH_Y, bark);
    }
    // Branch taper on both ends
    px(30, BRANCH_Y - 1, bark); px(29, BRANCH_Y, barkD);
    px(210, BRANCH_Y - 1, bark); px(211, BRANCH_Y, barkD);

    // ---- Primary upward branches forking from top of trunk ----
    // Up-left main branch
    line(118, 108, 108, 95, bark);
    line(108, 95, 94, 80, bark);
    line(94, 80, 78, 68, bark);
    line(78, 68, 62, 55, bark);
    // Up-center main branch
    line(120, 108, 120, 92, bark);
    line(120, 92, 118, 75, bark);
    line(118, 75, 115, 55, bark);
    line(115, 55, 116, 38, bark);
    // Up-right main branch
    line(122, 108, 132, 94, bark);
    line(132, 94, 148, 78, bark);
    line(148, 78, 164, 66, bark);
    line(164, 66, 180, 55, bark);

    // ---- Fine twigs forking off the primary branches ----
    // From the up-left branch
    line(108, 95, 96, 86, bark);
    line(96, 86, 88, 76, bark);
    line(94, 80, 88, 66, bark);
    line(78, 68, 70, 62, bark);
    line(78, 68, 82, 58, bark);
    line(62, 55, 52, 50, bark);
    line(62, 55, 58, 42, bark);
    line(62, 55, 66, 44, bark);
    line(52, 50, 44, 48, bark);
    line(52, 50, 48, 40, bark);
    // Tiny end twigs
    line(44, 48, 40, 44, bark);
    line(58, 42, 54, 36, bark);
    line(66, 44, 68, 38, bark);
    line(88, 66, 84, 58, bark);
    line(70, 62, 64, 58, bark);
    line(82, 58, 80, 50, bark);
    line(88, 76, 82, 72, bark);

    // From the up-center branch
    line(118, 75, 110, 68, bark);
    line(118, 75, 126, 70, bark);
    line(115, 55, 108, 48, bark);
    line(115, 55, 122, 48, bark);
    line(116, 38, 110, 32, bark);
    line(116, 38, 122, 32, bark);
    line(116, 38, 116, 28, bark);
    line(110, 32, 104, 26, bark);
    line(122, 32, 128, 26, bark);
    line(108, 48, 102, 42, bark);
    line(122, 48, 128, 42, bark);

    // From the up-right branch
    line(132, 94, 142, 88, bark);
    line(132, 94, 138, 84, bark);
    line(148, 78, 158, 72, bark);
    line(148, 78, 154, 64, bark);
    line(164, 66, 174, 62, bark);
    line(164, 66, 168, 54, bark);
    line(180, 55, 192, 50, bark);
    line(180, 55, 186, 40, bark);
    line(180, 55, 176, 44, bark);
    line(192, 50, 200, 46, bark);
    line(186, 40, 182, 34, bark);
    line(186, 40, 192, 34, bark);
    line(176, 44, 172, 38, bark);
    line(158, 72, 162, 62, bark);
    line(142, 88, 148, 84, bark);

    // ---- Drooping small branches from the main horizontal branch ----
    line(48, 101, 42, 108, bark);
    line(42, 108, 38, 114, bark);
    line(72, 101, 70, 109, bark);
    line(70, 109, 68, 116, bark);
    line(90, 101, 92, 108, bark);
    line(150, 101, 152, 109, bark);
    line(152, 109, 154, 116, bark);
    line(170, 101, 168, 110, bark);
    line(192, 101, 196, 108, bark);
    line(196, 108, 198, 114, bark);

    // ---- Upward twigs straight off the sitting branch ----
    line(38, 100, 34, 92, bark);
    line(34, 92, 30, 86, bark);
    line(58, 99, 54, 92, bark);
    line(200, 99, 204, 92, bark);
    line(204, 92, 208, 86, bark);
    line(160, 99, 166, 90, bark);
    line(140, 99, 144, 92, bark);

    // ---- A couple of trunk side-twigs ----
    line(112, 130, 104, 126, bark);
    line(128, 128, 136, 124, bark);
    line(112, 118, 105, 115, bark);
    line(128, 115, 134, 112, bark);
  }

  function trunkAtY(y) {
    if (y < 108 || y > 150) return null;
    const t = (150 - y) / 42;
    const cx = 120 + Math.sin(t * 4.2) * 2 + Math.sin(t * 1.7) * 1.5;
    const w = Math.max(6, Math.round(13 - t * 6));
    return { x: cx - w / 2, w };
  }

  function overlapsTree(x, y, w, h) {
    // Trunk
    for (let yy = Math.max(y, 108); yy < Math.min(y + h, 151); yy++) {
      const tr = trunkAtY(yy);
      if (!tr) continue;
      if (x + w > tr.x - 1 && x < tr.x + tr.w + 1) return true;
    }
    // Main branch strip
    if (x + w > TREE.branchX1 && x < TREE.branchX2 &&
        y + h > TREE.branchY - 1 && y < TREE.branchY + 3) return true;
    // Approximate upper canopy ellipse (keeps rabbits out of the branch cluster)
    const cxR = x + w / 2, cyR = y + h / 2;
    const dx = (cxR - 120) / 88;
    const dy = (cyR - 68) / 45;
    if (dx * dx + dy * dy < 1 && cyR < 100) return true;
    return false;
  }

  function faceTouchesTree(fx, fy, fw, fh) {
    // Trunk
    for (let yy = Math.max(fy, 108); yy < Math.min(fy + fh, 151); yy++) {
      const tr = trunkAtY(yy);
      if (!tr) continue;
      if (fx + fw > tr.x && fx < tr.x + tr.w) return true;
    }
    // Main horizontal branch
    if (fx + fw > TREE.branchX1 && fx < TREE.branchX2 &&
        fy + fh > TREE.branchY - 1 && fy < TREE.branchY + 2) return true;
    return false;
  }

  const rabbits = [];
  const MAX_RABBITS = 3;
  const MAX_BRANCH_RABBITS = 10;
  const BRANCH_SPAWN_INTERVAL = 1000;
  const RABBIT_LIFE = 5000;
  const CAUGHT_DURATION = 500;
  const GAME_DURATION = 60000;
  const BASE_SPEED = 0.45;
  const MIN_BRANCH_SPEED = 0.12;
  const BRANCH_SPEED_STEP = 0.02;

  let score = 0;
  let spawnTimer = 0;
  let nextSpawn = 500 + Math.random() * 900;
  let branchSpawnTimer = 0;
  let branchCatches = 0;
  let gameState = 'playing'; // 'playing' | 'intermission' | 'over'
  let timeLeft = GAME_DURATION;
  let lastTickSecond = -1;

  // Level state
  let level = 1;
  let facing = 'left';
  let onBranch = false;
  let treeActive = false;

  // Stats / combo
  let caughtCount = 0;
  let missedCount = 0;
  let combo = 0;
  let lastCatchTime = -Infinity;
  let bestStreak = 0;
  const COMBO_WINDOW = 2000;

  // High score
  let bestScore = 0;
  try { bestScore = parseInt(localStorage.getItem('rabbitHuntBest') || '0', 10) || 0; } catch (e) {}

  const goldSchedule = [];
  function setGoldScheduleForLevel(lv) {
    goldSchedule.length = 0;
    const times = (lv >= 3)
      ? [5000, 10000, 15000, 40000, 45000, 50000]
      : [30000, 55000];
    for (const t of times) goldSchedule.push({ at: t, spawned: false });
  }
  setGoldScheduleForLevel(1);

  // ---- Snakes (Level 4) ----
  const snakes = [];
  const MAX_SNAKES = 2;
  const SNAKE_SEG_COUNT = 14;
  const SNAKE_SEG_SPACING = 2;
  const SNAKE_HIT_COOLDOWN = 900;
  let snakeSpawnTimer = 0;
  let nextSnakeSpawn = 2500;
  let lastSnakeHit = -Infinity;

  function spawnSnake() {
    const fromLeft = Math.random() < 0.5;
    const y = 26 + Math.floor(Math.random() * (H - 40));
    const x = fromLeft ? -30 : W + 30;
    const dir = fromLeft ? 'right' : 'left';
    const speed = 0.35 + Math.random() * 0.25;
    snakes.push({ x, y, dir, speed, t: Math.random() * 6.28 });
  }

  function snakeSegment(s, i) {
    const dx = i * SNAKE_SEG_SPACING * (s.dir === 'right' ? -1 : 1);
    const sx = Math.round(s.x + dx);
    const sy = Math.round(s.y + Math.sin(s.t + i * 0.5) * 2);
    return { x: sx, y: sy };
  }

  function drawSnake(s) {
    const body = '#4e8a24';
    const bodyD = '#2b4d12';
    const bodyL = '#72b046';
    for (let i = SNAKE_SEG_COUNT - 1; i >= 0; i--) {
      const seg = snakeSegment(s, i);
      // Main body pixel + shadow
      px(seg.x, seg.y, i === 0 ? bodyL : body);
      px(seg.x, seg.y + 1, bodyD);
      // thicker mid-body
      if (i > 1 && i < SNAKE_SEG_COUNT - 2) {
        px(seg.x, seg.y - 1, body);
      }
    }
    // Head details (on segment 0)
    const head = snakeSegment(s, 0);
    px(head.x, head.y - 1, bodyL);
    px(head.x + (s.dir === 'right' ? 1 : -1), head.y, bodyL);
    // Eye
    px(head.x + (s.dir === 'right' ? -1 : 1), head.y - 1, '#000');
    // Tongue (forked) flicks randomly
    if (Math.floor(s.t * 6) % 4 === 0) {
      const hx = head.x + (s.dir === 'right' ? 2 : -2);
      px(hx, head.y, '#e04040');
      px(hx + (s.dir === 'right' ? 1 : -1), head.y - 1, '#e04040');
      px(hx + (s.dir === 'right' ? 1 : -1), head.y + 1, '#e04040');
    }
  }

  function snakeHitsFace(s, fx, fy, fw, fh) {
    for (let i = 0; i < SNAKE_SEG_COUNT; i++) {
      const seg = snakeSegment(s, i);
      if (seg.x >= fx && seg.x < fx + fw && seg.y >= fy - 1 && seg.y <= fy + fh) return true;
    }
    return false;
  }

  function playHiss() { tone(180, 0.22, 'sawtooth', 0.16, 70); }

  function updateSnakes(dt, now, fx, fy, fw, fh) {
    for (let i = snakes.length - 1; i >= 0; i--) {
      const s = snakes[i];
      s.x += s.speed * (dt / 16.667) * (s.dir === 'right' ? 1 : -1);
      s.t += dt * 0.009;
      if (s.x < -50 || s.x > W + 50) {
        snakes.splice(i, 1);
        continue;
      }
      if (gameState === 'playing' && now - lastSnakeHit >= SNAKE_HIT_COOLDOWN &&
          snakeHitsFace(s, fx, fy, fw, fh)) {
        lastSnakeHit = now;
        if (score > 0) score--;
        combo = 0;
        playHiss();
        showPopup(Math.round(s.x), Math.round(s.y) - 6, '−1', false);
      }
    }
    if (gameState === 'playing' && level >= 4) {
      snakeSpawnTimer += dt;
      if (snakes.length < MAX_SNAKES && snakeSpawnTimer >= nextSnakeSpawn) {
        snakeSpawnTimer = 0;
        nextSnakeSpawn = 3500 + Math.random() * 4500;
        spawnSnake();
      }
    }
  }

  function spawnRabbit(type) {
    let x = 0, y = 0;
    let tries = 0;
    do {
      x = 4 + Math.floor(Math.random() * (W - RW - 8));
      y = 4 + Math.floor(Math.random() * (H - RH - 8));
      tries++;
    } while (treeActive && overlapsTree(x, y, RW, RH) && tries < 20);
    if (treeActive && overlapsTree(x, y, RW, RH)) return;
    const isGold = type === 'gold';
    rabbits.push({
      x, y,
      born: performance.now(),
      type: isGold ? 'gold' : 'normal',
      life: isGold ? 3000 : RABBIT_LIFE,
      points: isGold ? 5 : 1,
    });
  }

  function spawnBranchRabbit(isGold) {
    // Sit on top of the main horizontal branch; spread along x, skipping the trunk
    const minX = TREE.branchX1 + 2;
    const maxX = TREE.branchX2 - RW - 2;
    let x, tries = 0;
    do {
      x = minX + Math.floor(Math.random() * (maxX - minX));
      tries++;
    } while (x + RW > 108 && x < 132 && tries < 6);
    const y = TREE.branchY - RH;
    rabbits.push({
      x, y,
      born: performance.now(),
      type: isGold ? 'gold' : 'normal',
      life: isGold ? 3000 : RABBIT_LIFE,
      points: isGold ? 5 : 1,
    });
  }

  function pickHopTarget(r) {
    const maxHop = 22;
    for (let tries = 0; tries < 8; tries++) {
      const dx = (Math.random() - 0.5) * 2 * maxHop;
      const dy = (Math.random() - 0.5) * 2 * maxHop;
      const nx = Math.max(4, Math.min(W - RW - 4, Math.round(r.x + dx)));
      const ny = Math.max(4, Math.min(H - RH - 4, Math.round(r.y + dy)));
      if (!(treeActive && overlapsTree(nx, ny, RW, RH))) return { x: nx, y: ny };
    }
    return { x: r.x, y: r.y };
  }

  function updateHopping(r, now) {
    if (r.caught != null) return;
    if (!r.hopTo) {
      r.hopFrom = { x: r.x, y: r.y };
      r.hopTo = pickHopTarget(r);
      r.hopStart = now + Math.random() * 400;
      r.hopDuration = 280 + Math.random() * 120;
      r.hopRest = 500 + Math.random() * 700;
      r.hopArc = 0;
      return;
    }
    const elapsed = now - r.hopStart;
    if (elapsed < 0) return; // waiting to start first hop
    if (elapsed < r.hopDuration) {
      const t = elapsed / r.hopDuration;
      r.x = Math.round(r.hopFrom.x + (r.hopTo.x - r.hopFrom.x) * t);
      r.y = Math.round(r.hopFrom.y + (r.hopTo.y - r.hopFrom.y) * t);
      r.hopArc = Math.sin(t * Math.PI) * 4;
    } else if (elapsed < r.hopDuration + r.hopRest) {
      r.x = r.hopTo.x;
      r.y = r.hopTo.y;
      r.hopArc = 0;
    } else {
      r.hopFrom = { x: r.hopTo.x, y: r.hopTo.y };
      r.hopTo = pickHopTarget(r);
      r.hopStart = now;
      r.hopDuration = 280 + Math.random() * 120;
      r.hopRest = 500 + Math.random() * 700;
    }
  }

  function updateRabbits(dt, now) {
    for (let i = rabbits.length - 1; i >= 0; i--) {
      const r = rabbits[i];
      if (r.caught != null) {
        if (now - r.caught >= CAUGHT_DURATION) rabbits.splice(i, 1);
      } else if (now - r.born >= (r.life || RABBIT_LIFE)) {
        rabbits.splice(i, 1);
        if (gameState === 'playing') {
          missedCount++;
          combo = 0;
          playEscape();
        }
      }
    }
    // Hopping (Level 3+)
    if (level >= 3) {
      for (const r of rabbits) updateHopping(r, now);
    }
    // Face-only hitbox: snout/head (~5x5), follows facing direction
    const fx = facing === 'left' ? pos : pos + 19;
    const fy = groundY - 12 + 3;
    const fw = 5;
    const fh = 5;
    for (const r of rabbits) {
      if (r.caught != null) continue;
      if (r.x + RW > fx && r.x < fx + fw && r.y + RH > fy && r.y < fy + fh) {
        r.caught = now;
        // Combo logic (resets if too long since last catch)
        if (now - lastCatchTime <= COMBO_WINDOW) combo++;
        else combo = 1;
        lastCatchTime = now;
        if (combo > bestStreak) bestStreak = combo;
        const base = r.points || 1;
        const bonus = combo > 1 ? (combo - 1) : 0;
        const total = base + bonus;
        score += total;
        caughtCount++;
        if (onBranch) branchCatches++;
        const cx = r.x + Math.floor(RW / 2);
        const cy = r.y;
        if (r.type === 'gold') {
          showPopup(cx, cy, '+' + total + (bonus > 0 ? ' x' + combo + '!' : ''), true);
          playSparkle();
        } else {
          showPopup(cx, cy, '+' + total + (bonus > 0 ? ' x' + combo + '!' : ''), false);
          playPop(combo);
        }
      }
    }
    if (gameState === 'playing') {
      const elapsed = GAME_DURATION - timeLeft;
      // Activate tree at 30s in Level 2
      if (level === 2 && !treeActive && elapsed >= TREE_APPEAR_AT) {
        treeActive = true;
        playSparkle();
      }
      // Tree jump trigger: face hits trunk
      if (treeActive && !onBranch && faceTouchesTree(fx, fy, fw, fh)) {
        onBranch = true;
        groundMax = BRANCH_Y;
        groundY = BRANCH_Y;
        walking = true;
        branchCatches = 0;
        branchSpawnTimer = 0;
        // Clear any ground rabbits so the branch feast starts clean
        for (let i = rabbits.length - 1; i >= 0; i--) {
          if (rabbits[i].caught == null) rabbits.splice(i, 1);
        }
        playJump();
        showPopup(pos + 12, groundY - 14, 'UP!', true);
      }

      if (onBranch) {
        // On the branch: rabbits rain onto the branch, ~1 per second, incl. gold
        branchSpawnTimer += dt;
        const liveCount = rabbits.filter(r => r.caught == null).length;
        if (liveCount < MAX_BRANCH_RABBITS && branchSpawnTimer >= BRANCH_SPAWN_INTERVAL) {
          branchSpawnTimer -= BRANCH_SPAWN_INTERVAL;
          const isGold = Math.random() < 0.18;
          spawnBranchRabbit(isGold);
        }
      } else {
        for (const g of goldSchedule) {
          if (!g.spawned && elapsed >= g.at) {
            g.spawned = true;
            spawnRabbit('gold');
            playGoldAppear();
          }
        }
        spawnTimer += dt;
        const liveNormal = rabbits.filter(r => r.caught == null && r.type !== 'gold').length;
        if (liveNormal < MAX_RABBITS && spawnTimer >= nextSpawn) {
          spawnTimer = 0;
          const urgent = timeLeft <= 10000;
          const minMs = urgent ? 250 : 500;
          const maxMs = urgent ? 700 : 1700;
          nextSpawn = minMs + Math.random() * (maxMs - minMs);
          spawnRabbit();
        }
      }
      // Tick sound in last 5 seconds
      const sec = Math.ceil(timeLeft / 1000);
      if (sec !== lastTickSecond) {
        lastTickSecond = sec;
        if (sec >= 1 && sec <= 5) playTick();
      }
    }

    updateSnakes(dt, now, fx, fy, fw, fh);
  }

  function formatTime(ms) {
    if (ms < 0) ms = 0;
    const s = Math.ceil(ms / 1000);
    const m = Math.floor(s / 60);
    const ss = String(s % 60).padStart(2, '0');
    return m + ':' + ss;
  }

  function updateHud() {
    timerEl.textContent = formatTime(timeLeft);
    scoreEl.textContent = 'Score: ' + score;
    bestEl.textContent = 'Best: ' + Math.max(bestScore, score);
    if (gameState === 'playing' && timeLeft <= 10000) {
      timerEl.classList.add('urgent');
    } else {
      timerEl.classList.remove('urgent');
    }
  }

  function draw(x, frame, standing, now) {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    if (treeActive) drawTree();
    for (const s of snakes) drawSnake(s);

    for (const r of rabbits) {
      if (r.caught != null) {
        const t = Math.min(1, (now - r.caught) / CAUGHT_DURATION);
        drawBurst(r.x + Math.floor(RW / 2), r.y + Math.floor(RH / 2), t);
      } else {
        const age = now - r.born;
        const remaining = (r.life || RABBIT_LIFE) - age;
        let hopY = Math.abs(Math.sin(age / 180)) * 2;
        if (level === 3 && r.hopArc) hopY = r.hopArc;
        const dy = -Math.round(hopY);
        if (remaining < 1000) {
          const phase = Math.floor(age / 90) % 2;
          if (phase === 0) continue;
        }
        drawRabbit(r.x, r.y + dy, r.type);
      }
    }

    const bob = standing ? 0 : (frame === 0 ? 0 : -1);
    const oy = groundY - 12 + bob;
    const ox = Math.floor(x);
    if (facing === 'right') {
      ctx.save();
      ctx.translate(ox * 2 + 22, 0);
      ctx.scale(-1, 1);
      drawLeopard(ox, oy, frame, standing);
      ctx.restore();
    } else {
      drawLeopard(ox, oy, frame, standing);
    }

    // Red flash when bitten by a snake
    const sinceHit = now - lastSnakeHit;
    if (sinceHit < 280) {
      const alpha = (1 - sinceHit / 280) * 0.35;
      ctx.fillStyle = 'rgba(220,30,30,' + alpha.toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function pointerToCanvas(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: ((clientX - rect.left) / rect.width) * W,
      y: ((clientY - rect.top) / rect.height) * H,
    };
  }

  function isOnLeopard(cx, cy) {
    const lx = pos;
    const ly = groundY - 12;
    const pad = 3;
    return cx >= lx - pad && cx <= lx + 24 + pad && cy >= ly - pad && cy <= ly + 13 + pad;
  }

  let dragOffset = 0;

  function setGroundFromClient(clientY) {
    const rect = canvas.getBoundingClientRect();
    const ratio = (clientY - rect.top) / rect.height;
    let y = Math.round(ratio * H) + dragOffset;
    if (y < groundMin) y = groundMin;
    if (y > groundMax) y = groundMax;
    groundY = y;
  }

  let downOnLeopard = false;
  let downX = 0, downY = 0;
  let didDrag = false;
  const dragThreshold = 6;

  canvas.addEventListener('pointerdown', (e) => {
    initAudio();
    if (gameState !== 'playing') return;
    const p = pointerToCanvas(e.clientX, e.clientY);
    if (!isOnLeopard(p.x, p.y)) return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    downX = p.x; downY = p.y; didDrag = false;
    downOnLeopard = true;
    dragOffset = groundY - p.y;
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!downOnLeopard) return;
    if (canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) {
      e.preventDefault();
      const p = pointerToCanvas(e.clientX, e.clientY);
      if (Math.abs(p.x - downX) > dragThreshold || Math.abs(p.y - downY) > dragThreshold) {
        didDrag = true;
      }
      setGroundFromClient(e.clientY);
    }
  });
  canvas.addEventListener('pointerup', (e) => {
    if (canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) {
      canvas.releasePointerCapture(e.pointerId);
    }
    if (downOnLeopard && !didDrag) {
      // Rear half = flip direction (enabled on branch in L2, always in L3+)
      const canFlip = onBranch || level >= 3;
      if (canFlip) {
        const rel = downX - pos;
        const isRearHalf = facing === 'left' ? (rel >= 12) : (rel <= 11);
        if (isRearHalf) {
          facing = (facing === 'left') ? 'right' : 'left';
          walking = true;
          playFlip();
        } else {
          walking = !walking;
        }
      } else {
        walking = !walking;
      }
    }
    downOnLeopard = false;
    dragOffset = 0;
  });
  canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
  canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

  const overTitleEl = document.getElementById('overTitle');
  const overHintEl = document.querySelector('#overlay .hint');

  let pendingNextLevel = null;

  overlay.addEventListener('click', () => {
    initAudio();
    if (gameState === 'intermission') {
      if (pendingNextLevel === 2) startLevel2();
      else if (pendingNextLevel === 3) startLevel3();
      else if (pendingNextLevel === 4) startLevel4();
    } else {
      resetGame();
    }
  });

  function endLevel1() {
    if (score >= LEVEL_2_SCORE) {
      gameState = 'intermission';
      pendingNextLevel = 2;
      walking = false;
      overTitleEl.textContent = 'LEVEL 2!';
      overScoreEl.textContent = 'Score: ' + score;
      overStatsEl.textContent = 'Next: a tree appears at 30s · tap the rear to flip direction';
      overHintEl.textContent = 'Tap to continue';
      overlay.classList.add('show');
      timerEl.classList.remove('urgent');
      playFanfare();
    } else {
      endGame();
    }
  }

  function endLevel2() {
    if (score >= LEVEL_3_SCORE) {
      gameState = 'intermission';
      pendingNextLevel = 3;
      walking = false;
      overTitleEl.textContent = 'LEVEL 3!';
      overScoreEl.textContent = 'Score: ' + score;
      overStatsEl.textContent = 'Next: the rabbits hop around · tap the rear to flip direction anytime';
      overHintEl.textContent = 'Tap to continue';
      overlay.classList.add('show');
      timerEl.classList.remove('urgent');
      playFanfare();
    } else {
      endGame();
    }
  }

  function endLevel3() {
    if (score >= LEVEL_4_SCORE) {
      gameState = 'intermission';
      pendingNextLevel = 4;
      walking = false;
      overTitleEl.textContent = 'LEVEL 4!';
      overScoreEl.textContent = 'Score: ' + score;
      overStatsEl.textContent = 'Watch out: snakes slither across · face-touch loses a point';
      overHintEl.textContent = 'Tap to continue';
      overlay.classList.add('show');
      timerEl.classList.remove('urgent');
      playFanfare();
    } else {
      endGame();
    }
  }

  function startLevel2() {
    level = 2;
    pendingNextLevel = null;
    timeLeft = GAME_DURATION;
    rabbits.length = 0;
    spawnTimer = 0;
    nextSpawn = 500 + Math.random() * 900;
    branchSpawnTimer = 0;
    branchCatches = 0;
    setGoldScheduleForLevel(2);
    treeActive = false;
    onBranch = false;
    facing = 'left';
    groundMax = H - 1;
    pos = W;
    walking = true;
    gameState = 'playing';
    lastTickSecond = -1;
    titleEl.textContent = 'RABBIT HUNT · L2';
    overlay.classList.remove('show');
    updateHud();
    playStart();
  }

  function startLevel3() {
    level = 3;
    pendingNextLevel = null;
    timeLeft = GAME_DURATION;
    rabbits.length = 0;
    spawnTimer = 0;
    nextSpawn = 500 + Math.random() * 900;
    setGoldScheduleForLevel(3);
    treeActive = false;
    onBranch = false;
    facing = 'left';
    groundMax = H - 1;
    pos = W;
    walking = true;
    gameState = 'playing';
    lastTickSecond = -1;
    snakes.length = 0;
    snakeSpawnTimer = 0;
    titleEl.textContent = 'RABBIT HUNT · L3';
    overlay.classList.remove('show');
    updateHud();
    playStart();
  }

  function startLevel4() {
    level = 4;
    pendingNextLevel = null;
    timeLeft = GAME_DURATION;
    rabbits.length = 0;
    spawnTimer = 0;
    nextSpawn = 500 + Math.random() * 900;
    setGoldScheduleForLevel(4);
    treeActive = false;
    onBranch = false;
    facing = 'left';
    groundMax = H - 1;
    pos = W;
    walking = true;
    gameState = 'playing';
    lastTickSecond = -1;
    snakes.length = 0;
    snakeSpawnTimer = 0;
    nextSnakeSpawn = 3500;
    lastSnakeHit = -Infinity;
    titleEl.textContent = 'RABBIT HUNT · L4';
    overlay.classList.remove('show');
    updateHud();
    playStart();
  }

  function endGame() {
    gameState = 'over';
    walking = false;
    let newBest = false;
    if (score > bestScore) {
      bestScore = score;
      try { localStorage.setItem('rabbitHuntBest', String(bestScore)); } catch (e) {}
      newBest = true;
    }
    overTitleEl.textContent = "Time's up!";
    overScoreEl.textContent = 'Score: ' + score + (newBest ? '  🏆 NEW BEST!' : '');
    overStatsEl.textContent = 'Caught: ' + caughtCount + ' · Missed: ' + missedCount + ' · Best streak: ' + bestStreak;
    overHintEl.textContent = 'Tap to play again';
    overlay.classList.add('show');
    timerEl.classList.remove('urgent');
    if (newBest) playFanfare();
    else playGameOver();
  }

  function resetGame() {
    score = 0;
    timeLeft = GAME_DURATION;
    rabbits.length = 0;
    spawnTimer = 0;
    nextSpawn = 500 + Math.random() * 900;
    branchSpawnTimer = 0;
    branchCatches = 0;
    snakes.length = 0;
    snakeSpawnTimer = 0;
    lastSnakeHit = -Infinity;
    setGoldScheduleForLevel(1);
    level = 1;
    pendingNextLevel = null;
    facing = 'left';
    onBranch = false;
    treeActive = false;
    groundMax = H - 1;
    pos = W;
    walking = true;
    gameState = 'playing';
    caughtCount = 0;
    missedCount = 0;
    combo = 0;
    bestStreak = 0;
    lastCatchTime = -Infinity;
    lastTickSecond = -1;
    titleEl.textContent = 'RABBIT HUNT';
    overlay.classList.remove('show');
    updateHud();
    playStart();
  }

  let pos = W;
  let frame = 0;
  let frameTimer = 0;
  let last = performance.now();
  let walking = true;
  const frameInterval = 150;

  function loop(now) {
    const dt = now - last;
    last = now;

    if (gameState === 'playing') {
      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        if (level === 1) endLevel1();
        else if (level === 2) endLevel2();
        else if (level === 3) endLevel3();
        else endGame();
      }
    }

    if (walking && gameState === 'playing') {
      const dir = (facing === 'left') ? -1 : 1;
      const effSpeed = onBranch
        ? Math.max(MIN_BRANCH_SPEED, BASE_SPEED - branchCatches * BRANCH_SPEED_STEP)
        : BASE_SPEED;
      pos += dir * effSpeed * (dt / 16.667);
      if (pos < -26) pos = W + 4;
      if (pos > W + 4) pos = -26;
      frameTimer += dt;
      if (frameTimer >= frameInterval) {
        frameTimer -= frameInterval;
        frame = 1 - frame;
      }
    }

    updateRabbits(dt, now);
    draw(pos, frame, !walking, now);
    updateHud();
    requestAnimationFrame(loop);
  }
  updateHud();
  requestAnimationFrame(t => { last = t; loop(t); });
})();
</script>
