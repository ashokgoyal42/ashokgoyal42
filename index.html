<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horse Derby</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1a1a1a;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "SF Mono", "Menlo", "Courier New", monospace;
  }
  #stage {
    position: relative;
    width: 100vw;
    max-width: 960px;
  }
  canvas {
    display: block;
    width: 100%;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    background: #000;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const W = 320, H = 200;
  canvas.width = W;
  canvas.height = H;
  ctx.imageSmoothingEnabled = false;

  // Readable palette: sky/grass frame a turf green track, deep-slate gate,
  // high-contrast finish line, and 8 hue-distinct horses.
  const SKY = '#8ac0d9';          // clear sky blue
  const RAIL = '#f4f4ea';         // white rail
  const RAIL_SHADE = '#a8a898';   // rail shadow
  const TRACK_A = '#72b454';      // fresh-mowed lane stripe
  const TRACK_B = '#5e9f44';      // opposite-mowed darker stripe
  const LANE_LINE = '#d2e8b0';    // pale grass-line dashes
  const GATE = '#2d2d3a';         // deep slate gate
  const GATE_HI = '#5b5b70';      // slate highlight
  const GATE_NUM = '#ffffff';     // white lane numbers
  const FINISH_A = '#ffffff';
  const FINISH_B = '#1a1a1a';
  const GRASS = '#4a8a3e';        // darker outfield grass
  const GRASS_DARK = '#3c7232';
  const ACCENT_RED = '#d63838';   // classic racing red
  const PROMPT_YELLOW = '#ffd448';
  const BANNER_BG = '#2d2d3a';
  const BANNER_EDGE = '#ffd448';

  // 8 horse coats paired with distinct racing-silk colors for the jockeys.
  const HORSES = [
    { body: '#8a4a24', mane: '#4a2614', silk: '#f5d03a', name: '1' }, // bay      + gold
    { body: '#2a2a35', mane: '#111118', silk: '#d63838', name: '2' }, // black    + red
    { body: '#e8e2d1', mane: '#9b947f', silk: '#2a5fb0', name: '3' }, // grey-w   + blue
    { body: '#8b8e92', mane: '#5a5c5f', silk: '#d84680', name: '4' }, // dapple   + pink
    { body: '#d4a84a', mane: '#8a6a20', silk: '#6a3d9a', name: '5' }, // palomino + purple
    { body: '#b56a6a', mane: '#7a4141', silk: '#e8752a', name: '6' }, // roan     + orange
    { body: '#4e2914', mane: '#2a1608', silk: '#f4f4ea', name: '7' }, // dark bay + white
    { body: '#c4703c', mane: '#7a3e1e', silk: '#30aacd', name: '8' }, // chestnut + cyan
  ];
  const JOCKEY_HELMET = '#14141a';
  const JOCKEY_SKIN = '#e8b090';
  const HORSE_SHADOW = '#3a6228';     // dark green shadow on grass
  const HORSE_SHADOW_SOFT = '#4a7c38'; // softer edge color

  // Per-horse runtime state (x position, speed, animation frame, finish info)
  const horseStates = HORSES.map(() => ({ x: 0, speed: 0, noisePhase: 0, frame: 0, frameT: 0, finished: false, finishTime: 0, place: 0 }));
  let nextPlace = 1;
  let raceFinishTime = 0;

  function resetHorses() {
    nextPlace = 1;
    raceFinishTime = 0;
    for (const s of horseStates) {
      s.x = HORSE_X;
      // Distance is ~271px; pick a base speed so each horse finishes in 4-7s
      s.speed = 0.039 + Math.random() * 0.029;
      s.noisePhase = Math.random() * Math.PI * 2;
      s.frame = 0;
      s.frameT = 0;
      s.finished = false;
      s.finishTime = 0;
      s.place = 0;
    }
  }

  function px(x, y, col) {
    ctx.fillStyle = col;
    ctx.fillRect(x, y, 1, 1);
  }
  function rect(x, y, w, h, col) {
    ctx.fillStyle = col;
    ctx.fillRect(x, y, w, h);
  }

  // Layout
  const TOP = 20;           // sky band height
  const LANE_H = 18;        // each lane height
  const LANES = 8;
  const TRACK_Y = TOP;
  const TRACK_H = LANES * LANE_H;
  const BOTTOM_Y = TRACK_Y + TRACK_H;
  // Starting gate: outer posts at STALL_LEFT..STALL_RIGHT; horses stand inside;
  // a front door at DOOR_X occludes them until the race starts.
  const STALL_LEFT = 15;
  const STALL_BACK_X = 16;  // thin back wall
  const HORSE_X = 18;       // left edge of horse sprite (head reaches x=35)
  const DOOR_X = 37;
  const DOOR_W = 3;
  const STALL_RIGHT = 41;
  const FINISH_X = W - 14;

  function drawSky() {
    rect(0, 0, W, TOP, SKY);
    // a couple of pixel clouds
    const clouds = [[30, 5], [90, 8], [160, 4], [230, 7], [280, 5]];
    for (const [x, y] of clouds) {
      rect(x, y, 8, 2, '#ffffff');
      rect(x + 1, y - 1, 6, 1, '#ffffff');
      rect(x + 2, y + 2, 4, 1, '#ffffff');
    }
    // top rail (white fence)
    rect(0, TOP - 3, W, 1, RAIL_SHADE);
    rect(0, TOP - 2, W, 2, RAIL);
  }

  function drawGround() {
    rect(0, BOTTOM_Y, W, H - BOTTOM_Y, GRASS);
    // grass texture
    for (let x = 0; x < W; x += 4) {
      px(x + (Math.floor(x / 7) % 3), BOTTOM_Y + 2, GRASS_DARK);
      px(x + 2, BOTTOM_Y + 5, GRASS_DARK);
    }
    // bottom rail
    rect(0, BOTTOM_Y, W, 1, RAIL_SHADE);
    rect(0, BOTTOM_Y + 1, W, 1, RAIL);
  }

  function drawTrack() {
    for (let i = 0; i < LANES; i++) {
      const y = TRACK_Y + i * LANE_H;
      const col = (i % 2 === 0) ? TRACK_A : TRACK_B;
      rect(0, y, W, LANE_H, col);
    }
    // dashed lane dividers
    for (let i = 1; i < LANES; i++) {
      const y = TRACK_Y + i * LANE_H;
      for (let x = 0; x < W; x += 6) {
        rect(x, y, 3, 1, LANE_LINE);
      }
    }
  }

  function drawFinishLine() {
    // checkered finish line, full track height
    for (let i = 0; i < LANES; i++) {
      const y = TRACK_Y + i * LANE_H;
      for (let j = 0; j < LANE_H; j += 3) {
        const row = Math.floor(j / 3);
        for (let k = 0; k < 3; k++) {
          const cellRow = row + k;
          const a = (i + cellRow) % 2 === 0 ? FINISH_A : FINISH_B;
          rect(FINISH_X, y + j, 3, 1, a);
          rect(FINISH_X + 3, y + j, 3, 1, (i + cellRow) % 2 === 0 ? FINISH_B : FINISH_A);
        }
      }
    }
    // post
    rect(FINISH_X - 1, TRACK_Y - 4, 1, TRACK_H + 4, '#222');
    rect(FINISH_X + 6, TRACK_Y - 4, 1, TRACK_H + 4, '#222');
    // little flag
    rect(FINISH_X - 1, TRACK_Y - 6, 8, 2, ACCENT_RED);
  }

  function drawGateFrame() {
    // Back wall + outer posts + top beam + lane dividers. Always visible.
    const topY = TRACK_Y - 4;
    const frameW = STALL_RIGHT - STALL_LEFT + 1;
    // Top beam
    rect(STALL_LEFT, topY, frameW, 2, '#222');
    rect(STALL_LEFT, topY + 2, frameW, 1, '#5a5a5a');
    // Outer posts
    rect(STALL_LEFT, topY, 1, TRACK_H + 4, '#222');
    rect(STALL_RIGHT, topY, 1, TRACK_H + 4, '#222');
    // Back wall (thin padded bar)
    rect(STALL_BACK_X, TRACK_Y, 1, TRACK_H, '#5a3f26');
    // Lane dividers between stalls
    for (let i = 1; i < LANES; i++) {
      const y = TRACK_Y + i * LANE_H;
      rect(STALL_LEFT + 1, y - 1, STALL_RIGHT - STALL_LEFT - 1, 1, '#111');
      rect(STALL_LEFT + 1, y, STALL_RIGHT - STALL_LEFT - 1, 1, '#4a4a4a');
    }
    // Bottom cap
    rect(STALL_LEFT, BOTTOM_Y, STALL_RIGHT - STALL_LEFT + 1, 1, '#111');
  }

  function drawGateDoors() {
    // Each lane's front door rolls up into the roof as openProgress goes 0 -> 1.
    for (let i = 0; i < LANES; i++) {
      const laneTop = TRACK_Y + i * LANE_H + 1;
      const laneBot = TRACK_Y + (i + 1) * LANE_H - 1;
      const fullH = laneBot - laneTop;
      const doorH = Math.max(0, Math.ceil(fullH * (1 - openProgress)));
      if (doorH <= 0) continue;
      const doorTop = laneTop;
      // Door body
      rect(DOOR_X, doorTop, DOOR_W, doorH, GATE);
      // top highlight
      rect(DOOR_X, doorTop, DOOR_W, 1, GATE_HI);
      // vertical bar accents
      for (let y = doorTop + 2; y < doorTop + doorH - 1; y += 3) {
        px(DOOR_X + 1, y, '#14141c');
      }
      // lane number (only while the door is tall enough)
      if (doorH >= 7) {
        const numY = doorTop + Math.floor((doorH - 5) / 2);
        drawNumber(DOOR_X, numY, i + 1);
      }
    }
  }

  // tiny 3x5 digit font
  const DIGITS = {
    '1': ['.X.','XX.','.X.','.X.','XXX'],
    '2': ['XX.','..X','.X.','X..','XXX'],
    '3': ['XX.','..X','.X.','..X','XX.'],
    '4': ['X.X','X.X','XXX','..X','..X'],
    '5': ['XXX','X..','XX.','..X','XX.'],
    '6': ['.XX','X..','XX.','X.X','.X.'],
    '7': ['XXX','..X','.X.','.X.','.X.'],
    '8': ['.X.','X.X','.X.','X.X','.X.'],
  };
  function drawNumber(x, y, n, col) {
    const g = DIGITS[String(n)];
    if (!g) return;
    const c = col || GATE_NUM;
    for (let r = 0; r < 5; r++) {
      for (let cc = 0; cc < 3; cc++) {
        if (g[r][cc] === 'X') px(x + cc, y + r, c);
      }
    }
  }

  // Horse sprite (side view, facing right). ~18 wide, 12 tall.
  // Pattern: . = skip, B = body, M = mane, E = eye, L = leg, H = hoof
  const HORSE = [
    '................HH',
    '..............HHHH',
    '.............HHHHH',
    '..MMBBBBBBBBBHHHHE',
    '.MMMBBBBBBBBBHHHH.',
    'TMMBBBBBBBBBBHH...',
    'TBBBBBBBBBBBBB....',
    '.B.B.......B.B....',
    '.B.B.......B.B....',
    '.B.B.......B.B....',
    '.L.L.......L.L....',
    '.H.H.......H.H....',
  ];

  function drawHorse(ox, oy, body, mane, phase) {
    // Body/head/tail rows 0-6 (sprite rows without legs)
    for (let r = 0; r < 7; r++) {
      const row = HORSE[r];
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        if (ch === '.') continue;
        let col = body;
        if (ch === 'M' || ch === 'T') col = mane;
        else if (ch === 'E') col = '#000000';
        // 'H' in these rows is the head — draw in body color
        px(ox + c, oy + r, col);
      }
    }
    // Legs drawn procedurally to support a 2-frame gallop.
    // phase 0: legs evenly spaced (contact). phase 1: legs swung forward (flight).
    const legCols = (phase === 1) ? [2, 3, 12, 13] : [1, 3, 11, 13];
    for (const lx of legCols) {
      for (let j = 7; j <= 10; j++) px(ox + lx, oy + j, body);
      px(ox + lx, oy + 11, '#1a0f08');
    }
  }

  // Tiny 4x4 crouched jockey sprite sitting centered on the horse's back.
  // Origin (ox, oy) is the top-left corner; the sprite's bottom row overlaps
  // the top of the horse's body so the rider looks "tucked in".
  function drawJockey(ox, oy, silk) {
    // helmet (rows 0-1)
    px(ox + 1, oy,     JOCKEY_HELMET);
    px(ox + 2, oy,     JOCKEY_HELMET);
    px(ox,     oy + 1, JOCKEY_HELMET);
    px(ox + 1, oy + 1, JOCKEY_HELMET);
    px(ox + 2, oy + 1, JOCKEY_HELMET);
    // face (one skin pixel under helmet)
    px(ox + 1, oy + 2, JOCKEY_SKIN);
    // silks shoulders + back
    px(ox + 2, oy + 2, silk);
    px(ox + 3, oy + 2, silk);
    px(ox + 1, oy + 3, silk);
    px(ox + 2, oy + 3, silk);
    px(ox + 3, oy + 3, silk);
  }

  // Soft 1-px shadow under the horse; stays on the ground even when the
  // horse bobs upward during the gallop's flight frame.
  function drawShadow(hx, y) {
    const sy = y + 15;
    for (let i = 1; i <= 15; i++) {
      const edge = (i <= 2 || i >= 14);
      px(hx + i, sy, edge ? HORSE_SHADOW_SOFT : HORSE_SHADOW);
    }
  }

  function drawHorses() {
    for (let i = 0; i < LANES; i++) {
      const y = TRACK_Y + i * LANE_H;
      const h = HORSES[i];
      const s = horseStates[i];
      const running = raceState === 'running' && !s.finished;
      const bob = (running && s.frame === 1) ? -1 : 0;
      const hx = Math.floor(s.x);
      drawShadow(hx, y);
      drawHorse(hx, y + 3 + bob, h.body, h.mane, s.frame);
      // Jockey sits crouched on the horse's back, centered on the body
      drawJockey(hx + 6, y + 3 + bob, h.silk);
    }
  }

  function render() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    drawSky();
    drawTrack();
    drawGround();
    drawFinishLine();
    drawHorses();       // horses first...
    drawGateFrame();    // ...then the stall frame over them
    drawGateDoors();    // ...then the animated front doors
    drawTitle();
    drawBank();
    drawSwatches();
    drawWinnerBanner();
    drawPrompt();
  }

  function drawTitle() {
    const text = 'HORSE DERBY';
    const scale = 2;
    const tw = measureScaled(text, scale) + 1;    // +1 for bold stroke
    const x0 = Math.floor((W - tw) / 2);
    drawTextScaled(text, x0, 4, '#ffffff', scale, true);
  }

  // ---- Race state & gate-opening animation ----
  let raceState = 'ready';          // 'ready' | 'opening' | 'running' | 'finished'
  let openProgress = 0;             // 0 (closed) -> 1 (fully open)
  let openStart = 0;
  const OPEN_DURATION = 700;        // ms
  let promptBlink = 0;
  const FRAME_INTERVAL = 130;       // ms per gallop frame
  const FINISH_HEAD_OFFSET = 17;    // horse head reaches x = s.x + 17

  // ---- Betting state ----
  const STARTING_BANK = 10;
  const BET_AMOUNT = 1;
  const PAYOUT = 8;
  let bank = STARTING_BANK;
  let selectedHorse = null;         // index 0..7, null while unpicked
  let lastWin = null;               // PAYOUT if last bet won, -BET_AMOUNT if lost

  // Selector-swatch layout in the grass band
  const SWATCH_W = 22;
  const SWATCH_H = 16;
  const SWATCH_GAP = 4;
  const SWATCH_TOTAL_W = 8 * SWATCH_W + 7 * SWATCH_GAP;
  const SWATCH_X0 = Math.floor((W - SWATCH_TOTAL_W) / 2);
  const SWATCH_Y = 166;

  function pointerToCanvas(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return {
      x: ((clientX - r.left) / r.width) * W,
      y: ((clientY - r.top) / r.height) * H,
    };
  }
  function hitTestSwatch(p) {
    // Generous vertical hit zone so a fingertip that drifts into the grass
    // band still lands on the intended swatch
    if (p.y < SWATCH_Y - 4 || p.y >= SWATCH_Y + SWATCH_H + 4) return -1;
    for (let i = 0; i < 8; i++) {
      const sx = SWATCH_X0 + i * (SWATCH_W + SWATCH_GAP);
      if (p.x >= sx - 1 && p.x < sx + SWATCH_W + 1) return i;
    }
    return -1;
  }

  // Quick luminance test so the lane number contrasts with its silk background
  function isLightColor(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return (r * 0.299 + g * 0.587 + b * 0.114) > 150;
  }

  // Simple bell sound on start
  let audioCtx = null;
  function initAudio() {
    if (audioCtx) return;
    try {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (Ctor) audioCtx = new Ctor();
    } catch (e) {}
  }
  function playBell() {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    [880, 1320].forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(f, t0 + i * 0.08);
      g.gain.setValueAtTime(0.18, t0 + i * 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + i * 0.08 + 0.45);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0 + i * 0.08);
      o.stop(t0 + i * 0.08 + 0.5);
    });
  }
  function playFanfare() {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const notes = [523, 659, 784, 1047];
    notes.forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(f, t0 + i * 0.12);
      g.gain.setValueAtTime(0.12, t0 + i * 0.12);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + i * 0.12 + 0.3);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0 + i * 0.12);
      o.stop(t0 + i * 0.12 + 0.35);
    });
  }

  // ---- Small 3x5 caps font used for prompts/banners ----
  const SMALL_FONT = {
    'A': ['.X.','X.X','XXX','X.X','X.X'],
    'B': ['XX.','X.X','XX.','X.X','XX.'],
    'C': ['XXX','X..','X..','X..','XXX'],
    'D': ['XX.','X.X','X.X','X.X','XX.'],
    'E': ['XXX','X..','XX.','X..','XXX'],
    'F': ['XXX','X..','XX.','X..','X..'],
    'G': ['XXX','X..','X.X','X.X','XXX'],
    'H': ['X.X','X.X','XXX','X.X','X.X'],
    'I': ['XXX','.X.','.X.','.X.','XXX'],
    'K': ['X.X','XX.','X..','XX.','X.X'],
    'L': ['X..','X..','X..','X..','XXX'],
    'N': ['X.X','XX.','X.X','X.X','X.X'],
    'O': ['XXX','X.X','X.X','X.X','XXX'],
    'P': ['XX.','X.X','XX.','X..','X..'],
    'R': ['XX.','X.X','XX.','X.X','X.X'],
    'S': ['XXX','X..','XXX','..X','XXX'],
    'T': ['XXX','.X.','.X.','.X.','.X.'],
    'U': ['X.X','X.X','X.X','X.X','XXX'],
    'W': ['X.X','X.X','X.X','XXX','X.X'],
    'Y': ['X.X','X.X','.X.','.X.','.X.'],
    '!': ['.X.','.X.','.X.','...','.X.'],
    '#': ['X.X','XXX','X.X','XXX','X.X'],
    '0': ['XXX','X.X','X.X','X.X','XXX'],
    '1': ['.X.','XX.','.X.','.X.','XXX'],
    '2': ['XX.','..X','.X.','X..','XXX'],
    '3': ['XX.','..X','.X.','..X','XX.'],
    '4': ['X.X','X.X','XXX','..X','..X'],
    '5': ['XXX','X..','XX.','..X','XX.'],
    '6': ['.XX','X..','XX.','X.X','.X.'],
    '7': ['XXX','..X','.X.','.X.','.X.'],
    '8': ['.X.','X.X','.X.','X.X','.X.'],
    '9': ['.X.','X.X','.XX','..X','XX.'],
    '$': ['.XX','X..','XXX','..X','XX.'],
    '+': ['...','.X.','XXX','.X.','...'],
    '-': ['...','...','XXX','...','...'],
    ' ': ['...','...','...','...','...'],
  };
  function drawText(text, x, y, col) {
    for (let i = 0; i < text.length; i++) {
      const g = SMALL_FONT[text[i]];
      if (!g) continue;
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 3; c++) {
          if (g[r][c] === 'X') px(x + i * 4 + c, y + r, col);
        }
      }
    }
  }

  // Scaled text with optional bold stroke (draws each pixel as a scale x scale
  // block; bold adds an extra 1-px thickening to the right of every lit pixel)
  function drawTextScaled(text, x, y, col, scale, bold) {
    const cellW = 4 * scale;          // 3 glyph cols + 1 gap, scaled
    for (let i = 0; i < text.length; i++) {
      const g = SMALL_FONT[text[i]];
      if (!g) continue;
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 3; c++) {
          if (g[r][c] !== 'X') continue;
          const bx = x + i * cellW + c * scale;
          const by = y + r * scale;
          rect(bx, by, scale, scale, col);
          if (bold) rect(bx + 1, by, scale, scale, col);
        }
      }
    }
  }
  function measureScaled(text, scale) {
    return text.length * 4 * scale - scale;
  }

  // Prompt blinks while waiting for input
  function drawPrompt() {
    let text = null;
    let blink = true;
    if (raceState === 'ready') {
      if (bank < BET_AMOUNT) text = 'BUSTED - TAP TO RESET';
      else if (selectedHorse === null) text = 'PICK YOUR HORSE';
      else text = 'PICK #' + (selectedHorse + 1) + '  TAP TO RACE';
    } else if (raceState === 'finished') {
      if (lastWin > 0) text = 'YOU WON +$' + lastWin + '!';
      else text = 'YOU LOST -$' + BET_AMOUNT;
      blink = false;
    }
    if (!text) return;
    if (blink && Math.floor(promptBlink / 400) % 2 === 1) return;
    const scale = 2;
    const tw = measureScaled(text, scale) + 1;
    const x0 = Math.floor((W - tw) / 2);
    const col = (raceState === 'finished' && lastWin > 0) ? '#9cf582'
              : (raceState === 'finished') ? '#f58282' : PROMPT_YELLOW;
    drawTextScaled(text, x0, H - 11, col, scale, true);
  }

  // Horse-selection row. Silk color fills each cell with a horse-body stripe at
  // the bottom; the current pick gets a 2-px gold border plus a downward arrow
  // marker above so the selection is obvious.
  function drawSwatches() {
    for (let i = 0; i < 8; i++) {
      const sx = SWATCH_X0 + i * (SWATCH_W + SWATCH_GAP);
      const h = HORSES[i];
      // Panel: silk top, horse body stripe bottom
      rect(sx, SWATCH_Y, SWATCH_W, SWATCH_H, h.silk);
      rect(sx, SWATCH_Y + SWATCH_H - 4, SWATCH_W, 4, h.body);
      // Lane number, scaled 2x for readability
      const numCol = isLightColor(h.silk) ? '#1a1a1a' : '#ffffff';
      const numX = sx + Math.floor((SWATCH_W - 6) / 2);
      const numY = SWATCH_Y + 2;
      const g = DIGITS[String(i + 1)];
      if (g) {
        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 3; c++) {
            if (g[r][c] === 'X') rect(numX + c * 2, numY + r * 2, 2, 2, numCol);
          }
        }
      }
      // Thin dark border on all panels
      rect(sx, SWATCH_Y, SWATCH_W, 1, '#1a1a22');
      rect(sx, SWATCH_Y + SWATCH_H - 1, SWATCH_W, 1, '#1a1a22');
      rect(sx, SWATCH_Y, 1, SWATCH_H, '#1a1a22');
      rect(sx + SWATCH_W - 1, SWATCH_Y, 1, SWATCH_H, '#1a1a22');
      if (selectedHorse === i) {
        // Double gold ring around the picked swatch
        for (let k = 1; k <= 2; k++) {
          rect(sx - k, SWATCH_Y - k, SWATCH_W + 2*k, 1, BANNER_EDGE);
          rect(sx - k, SWATCH_Y + SWATCH_H + k - 1, SWATCH_W + 2*k, 1, BANNER_EDGE);
          rect(sx - k, SWATCH_Y - k, 1, SWATCH_H + 2*k, BANNER_EDGE);
          rect(sx + SWATCH_W + k - 1, SWATCH_Y - k, 1, SWATCH_H + 2*k, BANNER_EDGE);
        }
        // Upward arrow below the swatch pointing at the selection
        const ax = sx + Math.floor(SWATCH_W / 2);
        const ay = SWATCH_Y + SWATCH_H + 2;
        rect(ax,     ay,     1, 1, BANNER_EDGE);
        rect(ax - 1, ay + 1, 3, 1, BANNER_EDGE);
        rect(ax - 2, ay + 2, 5, 1, BANNER_EDGE);
      }
    }
  }

  function drawBank() {
    const text = '$' + bank;
    const scale = 2;
    const tw = measureScaled(text, scale) + 1;
    const bx = W - tw - 4;
    drawTextScaled(text, bx, 4, '#f5d03a', scale, true);
  }

  // Winner banner shown once the first horse has crossed the finish line
  function drawWinnerBanner() {
    if (raceState !== 'finished') return;
    let winnerIdx = -1;
    for (let i = 0; i < horseStates.length; i++) {
      if (horseStates[i].place === 1) { winnerIdx = i; break; }
    }
    if (winnerIdx < 0) return;
    const text = 'HORSE #' + (winnerIdx + 1) + ' WINS!';
    const scale = 2;
    const tw = measureScaled(text, scale) + 1;  // +1 for bold stroke
    const boxW = tw + 14;
    const boxH = 5 * scale + 14;
    const bx = Math.floor((W - boxW) / 2);
    const by = 26;
    rect(bx, by, boxW, boxH, BANNER_BG);
    rect(bx + 1, by + 1, boxW - 2, 1, BANNER_EDGE);
    rect(bx + 1, by + boxH - 2, boxW - 2, 1, BANNER_EDGE);
    rect(bx, by, 1, boxH, BANNER_EDGE);
    rect(bx + boxW - 1, by, 1, boxH, BANNER_EDGE);
    // White 4-direction outline so any horse body color reads on the dark banner
    const tx = bx + 7, ty = by + 7;
    for (const [ox, oy] of [[-1,0],[1,0],[0,-1],[0,1]]) {
      drawTextScaled(text, tx + ox, ty + oy, '#ffffff', scale, true);
    }
    drawTextScaled(text, tx, ty, HORSES[winnerIdx].body, scale, true);
  }

  function startRace() {
    if (raceState !== 'ready') return;
    raceState = 'opening';
    openStart = performance.now();
    initAudio();
    playBell();
  }

  function restartRace() {
    if (raceState !== 'finished') return;
    raceState = 'ready';
    openProgress = 0;
    selectedHorse = null;
    lastWin = null;
    resetHorses();
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    initAudio();
    const p = pointerToCanvas(e.clientX, e.clientY);
    if (raceState === 'ready') {
      if (bank < BET_AMOUNT) {
        // Bankroll recovery — tap anywhere to reset
        bank = STARTING_BANK;
        selectedHorse = null;
        return;
      }
      const idx = hitTestSwatch(p);
      if (idx !== -1) {
        selectedHorse = idx;
        return;
      }
      if (selectedHorse === null) return;
      bank -= BET_AMOUNT;
      lastWin = null;
      startRace();
    } else if (raceState === 'finished') {
      restartRace();
    }
  });
  canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });

  // ---- Main loop ----
  resetHorses();
  let last = performance.now();
  function loop(now) {
    const dt = now - last;
    last = now;

    if (raceState === 'ready' || raceState === 'finished') {
      promptBlink = (promptBlink + dt) % 800;
    }
    if (raceState === 'opening') {
      openProgress = Math.min(1, (now - openStart) / OPEN_DURATION);
      if (openProgress >= 1) {
        openProgress = 1;
        raceState = 'running';
      }
    }
    if (raceState === 'running') {
      const finishLineX = FINISH_X - FINISH_HEAD_OFFSET;
      let allDone = true;
      for (const s of horseStates) {
        if (!s.finished) {
          // small sinusoidal speed variation so finishes aren't perfectly linear
          const noise = 1 + 0.18 * Math.sin(now / 220 + s.noisePhase);
          s.x += s.speed * noise * dt;
          s.frameT += dt;
          if (s.frameT >= FRAME_INTERVAL) {
            s.frameT -= FRAME_INTERVAL;
            s.frame = 1 - s.frame;
          }
          if (s.x >= finishLineX) {
            s.x = finishLineX;
            s.finished = true;
            s.finishTime = now;
            s.place = nextPlace++;
            if (s.place === 1) {
              raceFinishTime = now;
              playFanfare();
            }
          } else {
            allDone = false;
          }
        }
      }
      // End the race ~1.2s after the winner crosses so trailing horses can finish on screen
      if (raceFinishTime && (allDone || now - raceFinishTime > 1200)) {
        raceState = 'finished';
        const winnerIdx = horseStates.findIndex(s => s.place === 1);
        if (selectedHorse !== null && winnerIdx === selectedHorse) {
          bank += PAYOUT;
          lastWin = PAYOUT;
        } else {
          lastWin = 0;  // bet was already deducted at race start
        }
      }
    }

    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(t => { last = t; loop(t); });
})();
</script>
</body>
</html>
