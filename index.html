<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Leopard</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100vw;
    max-width: 900px;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    background: #ffffff;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = 240, H = 200;
  canvas.width = W;
  canvas.height = H;
  ctx.imageSmoothingEnabled = false;

  const C = {
    o: '#2b1810',
    y: '#e0a84a',
    c: '#fbecd0',
    s: '#4a2c18',
    b: '#000000',
    p: '#e87a92',
  };

  function px(x, y, col) {
    if (!col) return;
    ctx.fillStyle = col;
    ctx.fillRect(x, y, 1, 1);
  }

  // Compact leopard: ~24 wide x 13 tall
  function drawLeopard(ox, oy, frame, standing) {
    // Tail (curled up over back)
    px(ox+20, oy+4, C.o);
    px(ox+21, oy+3, C.o);
    px(ox+22, oy+2, C.o);
    px(ox+22, oy+1, C.o);
    px(ox+21, oy+1, C.y);
    px(ox+21, oy+2, C.y);

    // Body outline - back
    for (let i = 5; i <= 19; i++) px(ox+i, oy+2, C.o);
    // Body outline - belly
    for (let i = 5; i <= 19; i++) px(ox+i, oy+8, C.o);
    // Body right end
    px(ox+20, oy+3, C.o);
    px(ox+20, oy+5, C.o);
    px(ox+20, oy+6, C.o);
    px(ox+20, oy+7, C.o);
    px(ox+20, oy+8, C.o);

    // Body fill
    for (let j = 3; j <= 6; j++) {
      for (let i = 5; i <= 19; i++) px(ox+i, oy+j, C.y);
    }
    // Belly strip
    for (let i = 5; i <= 19; i++) px(ox+i, oy+7, C.c);

    // Spots (rosettes)
    px(ox+7,  oy+3, C.s);
    px(ox+10, oy+4, C.s); px(ox+11, oy+4, C.s);
    px(ox+14, oy+3, C.s);
    px(ox+16, oy+5, C.s); px(ox+17, oy+5, C.s);
    px(ox+13, oy+6, C.s);
    px(ox+9,  oy+6, C.s);

    // Head
    for (let j = 3; j <= 6; j++) {
      for (let i = 1; i <= 4; i++) px(ox+i, oy+j, C.y);
    }
    // Head outline
    px(ox, oy+4, C.o);
    px(ox, oy+5, C.o);
    px(ox, oy+6, C.o);
    px(ox+1, oy+3, C.o);
    px(ox+2, oy+3, C.o);
    px(ox+3, oy+3, C.o);
    px(ox+4, oy+3, C.o);
    px(ox+1, oy+7, C.o);
    px(ox+2, oy+7, C.o);
    px(ox+3, oy+7, C.o);
    px(ox+4, oy+7, C.o);

    // Ears
    px(ox+1, oy+2, C.o);
    px(ox+4, oy+2, C.o);

    // Eye
    px(ox+3, oy+5, C.b);

    // Nose
    px(ox, oy+4, C.p);

    // Muzzle detail
    px(ox+1, oy+6, C.s);

    // Legs - 4 legs, animated
    // Front pair: cols 7, 10. Back pair: cols 16, 19.
    const legX = [7, 10, 16, 19];
    // Two-frame walk cycle: diagonal pairs move together
    const lenA = [3, 2, 2, 3];
    const lenB = [2, 3, 3, 2];
    const lenStand = [3, 3, 3, 3];
    const lengths = standing ? lenStand : (frame === 0 ? lenA : lenB);

    for (let k = 0; k < 4; k++) {
      const lx = ox + legX[k];
      const len = lengths[k];
      for (let j = 0; j < len; j++) {
        px(lx, oy + 9 + j, C.o);
      }
      // paw
      px(lx - 1, oy + 9 + len - 1, C.o);
      px(lx + 1, oy + 9 + len - 1, C.o);
    }
  }

  let groundY = Math.floor(H * 0.6);
  const groundMin = 13;
  const groundMax = H - 1;

  function draw(x, frame, standing) {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    const bob = standing ? 0 : (frame === 0 ? 0 : -1);
    drawLeopard(Math.floor(x), groundY - 12 + bob, frame, standing);
  }

  function pointerToCanvas(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: ((clientX - rect.left) / rect.width) * W,
      y: ((clientY - rect.top) / rect.height) * H,
    };
  }

  function isOnLeopard(cx, cy) {
    const lx = pos;
    const ly = groundY - 12;
    const pad = 3;
    return cx >= lx - pad && cx <= lx + 24 + pad && cy >= ly - pad && cy <= ly + 13 + pad;
  }

  let dragOffset = 0;

  function setGroundFromClient(clientY) {
    const rect = canvas.getBoundingClientRect();
    const ratio = (clientY - rect.top) / rect.height;
    let y = Math.round(ratio * H) + dragOffset;
    if (y < groundMin) y = groundMin;
    if (y > groundMax) y = groundMax;
    groundY = y;
  }

  let downOnLeopard = false;
  let downX = 0, downY = 0;
  let didDrag = false;
  const dragThreshold = 6;

  canvas.addEventListener('pointerdown', (e) => {
    const p = pointerToCanvas(e.clientX, e.clientY);
    if (!isOnLeopard(p.x, p.y)) return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    downX = p.x; downY = p.y; didDrag = false;
    downOnLeopard = true;
    dragOffset = groundY - p.y;
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!downOnLeopard) return;
    if (canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) {
      e.preventDefault();
      const p = pointerToCanvas(e.clientX, e.clientY);
      if (Math.abs(p.x - downX) > dragThreshold || Math.abs(p.y - downY) > dragThreshold) {
        didDrag = true;
      }
      setGroundFromClient(e.clientY);
    }
  });
  canvas.addEventListener('pointerup', (e) => {
    if (canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) {
      canvas.releasePointerCapture(e.pointerId);
    }
    if (downOnLeopard && !didDrag) {
      walking = !walking;
    }
    downOnLeopard = false;
    dragOffset = 0;
  });
  canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
  canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

  let pos = W;
  let frame = 0;
  let frameTimer = 0;
  let last = performance.now();
  let walking = true;
  const speed = 0.45;
  const frameInterval = 150;

  function loop(now) {
    const dt = now - last;
    last = now;
    if (walking) {
      pos -= speed * (dt / 16.667);
      if (pos < -26) pos = W + 4;
      frameTimer += dt;
      if (frameTimer >= frameInterval) {
        frameTimer -= frameInterval;
        frame = 1 - frame;
      }
    }
    draw(pos, frame, !walking);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(t => { last = t; loop(t); });
})();
</script>
</body>
</html>
