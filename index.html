<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horse Derby</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1a1a1a;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "SF Mono", "Menlo", "Courier New", monospace;
  }
  #stage {
    position: relative;
    width: 100vw;
    max-width: 960px;
  }
  canvas {
    display: block;
    width: 100%;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    background: #000;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const W = 320, H = 200;
  canvas.width = W;
  canvas.height = H;
  ctx.imageSmoothingEnabled = false;

  // Palette
  const SKY = '#6ca8d6';
  const RAIL = '#e8e8e8';
  const RAIL_SHADE = '#9aa3aa';
  const TRACK_A = '#4fa84a';
  const TRACK_B = '#3e8f3a';
  const LANE_LINE = '#d8f0c0';
  const GATE = '#3a3a3a';
  const GATE_HI = '#5a5a5a';
  const GATE_NUM = '#ffffff';
  const FINISH_A = '#ffffff';
  const FINISH_B = '#1a1a1a';
  const GRASS = '#4fa84a';
  const GRASS_DARK = '#3a8a38';

  // 8 horse colors
  const HORSES = [
    { body: '#8b4a1a', mane: '#3a1a08', name: '1' },
    { body: '#222222', mane: '#000000', name: '2' },
    { body: '#e8d8b8', mane: '#a88a60', name: '3' },
    { body: '#9aa0a6', mane: '#5a6066', name: '4' },
    { body: '#a63319', mane: '#5a1a0a', name: '5' },
    { body: '#c89060', mane: '#7a5030', name: '6' },
    { body: '#5a2e0e', mane: '#2a1404', name: '7' },
    { body: '#d4a84a', mane: '#8a6a20', name: '8' },
  ];

  function px(x, y, col) {
    ctx.fillStyle = col;
    ctx.fillRect(x, y, 1, 1);
  }
  function rect(x, y, w, h, col) {
    ctx.fillStyle = col;
    ctx.fillRect(x, y, w, h);
  }

  // Layout
  const TOP = 20;           // sky band height
  const LANE_H = 18;        // each lane height
  const LANES = 8;
  const TRACK_Y = TOP;
  const TRACK_H = LANES * LANE_H;
  const BOTTOM_Y = TRACK_Y + TRACK_H;
  // Starting gate: outer posts at STALL_LEFT..STALL_RIGHT; horses stand inside;
  // a front door at DOOR_X occludes them until the race starts.
  const STALL_LEFT = 15;
  const STALL_BACK_X = 16;  // thin back wall
  const HORSE_X = 18;       // left edge of horse sprite (head reaches x=35)
  const DOOR_X = 37;
  const DOOR_W = 3;
  const STALL_RIGHT = 41;
  const FINISH_X = W - 14;

  function drawSky() {
    rect(0, 0, W, TOP, SKY);
    // a couple of pixel clouds
    const clouds = [[30, 5], [90, 8], [160, 4], [230, 7], [280, 5]];
    for (const [x, y] of clouds) {
      rect(x, y, 8, 2, '#ffffff');
      rect(x + 1, y - 1, 6, 1, '#ffffff');
      rect(x + 2, y + 2, 4, 1, '#ffffff');
    }
    // top rail (white fence)
    rect(0, TOP - 3, W, 1, RAIL_SHADE);
    rect(0, TOP - 2, W, 2, RAIL);
  }

  function drawGround() {
    rect(0, BOTTOM_Y, W, H - BOTTOM_Y, GRASS);
    // grass texture
    for (let x = 0; x < W; x += 4) {
      px(x + (Math.floor(x / 7) % 3), BOTTOM_Y + 2, GRASS_DARK);
      px(x + 2, BOTTOM_Y + 5, GRASS_DARK);
    }
    // bottom rail
    rect(0, BOTTOM_Y, W, 1, RAIL_SHADE);
    rect(0, BOTTOM_Y + 1, W, 1, RAIL);
  }

  function drawTrack() {
    for (let i = 0; i < LANES; i++) {
      const y = TRACK_Y + i * LANE_H;
      const col = (i % 2 === 0) ? TRACK_A : TRACK_B;
      rect(0, y, W, LANE_H, col);
    }
    // dashed lane dividers
    for (let i = 1; i < LANES; i++) {
      const y = TRACK_Y + i * LANE_H;
      for (let x = 0; x < W; x += 6) {
        rect(x, y, 3, 1, LANE_LINE);
      }
    }
  }

  function drawFinishLine() {
    // checkered finish line, full track height
    for (let i = 0; i < LANES; i++) {
      const y = TRACK_Y + i * LANE_H;
      for (let j = 0; j < LANE_H; j += 3) {
        const row = Math.floor(j / 3);
        for (let k = 0; k < 3; k++) {
          const cellRow = row + k;
          const a = (i + cellRow) % 2 === 0 ? FINISH_A : FINISH_B;
          rect(FINISH_X, y + j, 3, 1, a);
          rect(FINISH_X + 3, y + j, 3, 1, (i + cellRow) % 2 === 0 ? FINISH_B : FINISH_A);
        }
      }
    }
    // post
    rect(FINISH_X - 1, TRACK_Y - 4, 1, TRACK_H + 4, '#222');
    rect(FINISH_X + 6, TRACK_Y - 4, 1, TRACK_H + 4, '#222');
    // little flag
    rect(FINISH_X - 1, TRACK_Y - 6, 8, 2, '#d62828');
  }

  function drawGateFrame() {
    // Back wall + outer posts + top beam + lane dividers. Always visible.
    const topY = TRACK_Y - 4;
    const frameW = STALL_RIGHT - STALL_LEFT + 1;
    // Top beam
    rect(STALL_LEFT, topY, frameW, 2, '#222');
    rect(STALL_LEFT, topY + 2, frameW, 1, '#5a5a5a');
    // Outer posts
    rect(STALL_LEFT, topY, 1, TRACK_H + 4, '#222');
    rect(STALL_RIGHT, topY, 1, TRACK_H + 4, '#222');
    // Back wall (thin padded bar)
    rect(STALL_BACK_X, TRACK_Y, 1, TRACK_H, '#4a3020');
    // Lane dividers between stalls
    for (let i = 1; i < LANES; i++) {
      const y = TRACK_Y + i * LANE_H;
      rect(STALL_LEFT + 1, y - 1, STALL_RIGHT - STALL_LEFT - 1, 1, '#111');
      rect(STALL_LEFT + 1, y, STALL_RIGHT - STALL_LEFT - 1, 1, '#4a4a4a');
    }
    // Bottom cap
    rect(STALL_LEFT, BOTTOM_Y, STALL_RIGHT - STALL_LEFT + 1, 1, '#111');
  }

  function drawGateDoors() {
    // Each lane's front door rolls up into the roof as openProgress goes 0 -> 1.
    for (let i = 0; i < LANES; i++) {
      const laneTop = TRACK_Y + i * LANE_H + 1;
      const laneBot = TRACK_Y + (i + 1) * LANE_H - 1;
      const fullH = laneBot - laneTop;
      const doorH = Math.max(0, Math.ceil(fullH * (1 - openProgress)));
      if (doorH <= 0) continue;
      const doorTop = laneTop;
      // Door body
      rect(DOOR_X, doorTop, DOOR_W, doorH, GATE);
      // top highlight
      rect(DOOR_X, doorTop, DOOR_W, 1, GATE_HI);
      // vertical bar accents
      for (let y = doorTop + 2; y < doorTop + doorH - 1; y += 3) {
        px(DOOR_X + 1, y, '#1a1a1a');
      }
      // lane number (only while the door is tall enough)
      if (doorH >= 7) {
        const numY = doorTop + Math.floor((doorH - 5) / 2);
        drawNumber(DOOR_X, numY, i + 1);
      }
    }
  }

  // tiny 3x5 digit font
  const DIGITS = {
    '1': ['.X.','XX.','.X.','.X.','XXX'],
    '2': ['XX.','..X','.X.','X..','XXX'],
    '3': ['XX.','..X','.X.','..X','XX.'],
    '4': ['X.X','X.X','XXX','..X','..X'],
    '5': ['XXX','X..','XX.','..X','XX.'],
    '6': ['.XX','X..','XX.','X.X','.X.'],
    '7': ['XXX','..X','.X.','.X.','.X.'],
    '8': ['.X.','X.X','.X.','X.X','.X.'],
  };
  function drawNumber(x, y, n) {
    const g = DIGITS[String(n)];
    if (!g) return;
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 3; c++) {
        if (g[r][c] === 'X') px(x + c, y + r, GATE_NUM);
      }
    }
  }

  // Horse sprite (side view, facing right). ~18 wide, 12 tall.
  // Pattern: . = skip, B = body, M = mane, E = eye, L = leg, H = hoof
  const HORSE = [
    '................HH',
    '..............HHHH',
    '.............HHHHH',
    '..MMBBBBBBBBBHHHHE',
    '.MMMBBBBBBBBBHHHH.',
    'TMMBBBBBBBBBBHH...',
    'TBBBBBBBBBBBBB....',
    '.B.B.......B.B....',
    '.B.B.......B.B....',
    '.B.B.......B.B....',
    '.L.L.......L.L....',
    '.H.H.......H.H....',
  ];

  function drawHorse(ox, oy, body, mane) {
    for (let r = 0; r < HORSE.length; r++) {
      const row = HORSE[r];
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        if (ch === '.') continue;
        let col = body;
        if (ch === 'M' || ch === 'T') col = mane;
        else if (ch === 'H') col = body; // head uses body shade
        else if (ch === 'E') col = '#000000';
        else if (ch === 'L') col = body;
        // hoof (uses H symbol for head too — separate bottom row)
        if (ch === 'H' && r >= 11) col = '#000000';
        px(ox + c, oy + r, col);
      }
    }
    // hooves explicitly (bottom row of H spots)
    const bottomRow = HORSE[11];
    for (let c = 0; c < bottomRow.length; c++) {
      if (bottomRow[c] === 'H') px(ox + c, oy + 11, '#1a0f08');
    }
  }

  function drawHorses() {
    // Horses stand inside their stalls, behind the front door
    for (let i = 0; i < LANES; i++) {
      const y = TRACK_Y + i * LANE_H;
      const h = HORSES[i];
      drawHorse(HORSE_X, y + 3, h.body, h.mane);
    }
  }

  function render() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    drawSky();
    drawTrack();
    drawGround();
    drawFinishLine();
    drawHorses();       // horses first...
    drawGateFrame();    // ...then the stall frame over them
    drawGateDoors();    // ...then the animated front doors
    drawTitle();
    drawPrompt();
  }

  function drawTitle() {
    // simple title bar text using our digit font? Keep it basic with filled rectangles.
    // Draw "HORSE DERBY" in tiny caps using a very small bitmap font.
    const FONT = {
      'H': ['X.X','X.X','XXX','X.X','X.X'],
      'O': ['XXX','X.X','X.X','X.X','XXX'],
      'R': ['XX.','X.X','XX.','X.X','X.X'],
      'S': ['XXX','X..','XXX','..X','XXX'],
      'E': ['XXX','X..','XX.','X..','XXX'],
      'D': ['XX.','X.X','X.X','X.X','XX.'],
      'B': ['XX.','X.X','XX.','X.X','XX.'],
      'Y': ['X.X','X.X','.X.','.X.','.X.'],
      ' ': ['...','...','...','...','...'],
    };
    const text = 'HORSE DERBY';
    const x0 = Math.floor((W - text.length * 4) / 2);
    const y0 = 2;
    for (let i = 0; i < text.length; i++) {
      const g = FONT[text[i]];
      if (!g) continue;
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 3; c++) {
          if (g[r][c] === 'X') px(x0 + i * 4 + c, y0 + r, '#ffffff');
        }
      }
    }
  }

  // ---- Race state & gate-opening animation ----
  let raceState = 'ready';          // 'ready' | 'opening' | 'open'
  let openProgress = 0;             // 0 (closed) -> 1 (fully open)
  let openStart = 0;
  const OPEN_DURATION = 700;        // ms
  let promptBlink = 0;

  // Simple bell sound on start
  let audioCtx = null;
  function initAudio() {
    if (audioCtx) return;
    try {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (Ctor) audioCtx = new Ctor();
    } catch (e) {}
  }
  function playBell() {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    [880, 1320].forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(f, t0 + i * 0.08);
      g.gain.setValueAtTime(0.18, t0 + i * 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + i * 0.08 + 0.45);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0 + i * 0.08);
      o.stop(t0 + i * 0.08 + 0.5);
    });
  }

  // "CLICK TO START" prompt (blinks until race starts)
  function drawPrompt() {
    if (raceState !== 'ready') return;
    if (Math.floor(promptBlink / 400) % 2 === 1) return;
    const FONT = {
      'C': ['XXX','X..','X..','X..','XXX'],
      'L': ['X..','X..','X..','X..','XXX'],
      'I': ['XXX','.X.','.X.','.X.','XXX'],
      'K': ['X.X','XX.','X..','XX.','X.X'],
      'T': ['XXX','.X.','.X.','.X.','.X.'],
      'O': ['XXX','X.X','X.X','X.X','XXX'],
      'S': ['XXX','X..','XXX','..X','XXX'],
      'A': ['.X.','X.X','XXX','X.X','X.X'],
      'R': ['XX.','X.X','XX.','X.X','X.X'],
      ' ': ['...','...','...','...','...'],
    };
    const text = 'CLICK TO START';
    const x0 = Math.floor((W - text.length * 4) / 2);
    const y0 = H - 10;
    for (let i = 0; i < text.length; i++) {
      const g = FONT[text[i]];
      if (!g) continue;
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 3; c++) {
          if (g[r][c] === 'X') px(x0 + i * 4 + c, y0 + r, '#ffff40');
        }
      }
    }
  }

  function startRace() {
    if (raceState !== 'ready') return;
    raceState = 'opening';
    openStart = performance.now();
    initAudio();
    playBell();
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    initAudio();
    startRace();
  });
  canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });

  // ---- Main loop ----
  let last = performance.now();
  function loop(now) {
    const dt = now - last;
    last = now;

    if (raceState === 'ready') {
      promptBlink = (promptBlink + dt) % 800;
    } else if (raceState === 'opening') {
      openProgress = Math.min(1, (now - openStart) / OPEN_DURATION);
      if (openProgress >= 1) raceState = 'open';
    }

    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(t => { last = t; loop(t); });
})();
</script>
</body>
</html>
