<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marigold</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #1f1912;
    color: #f4e8d8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    box-sizing: border-box;
  }
  h1 {
    margin: 0 0 16px;
    font-weight: 500;
    letter-spacing: 0.25em;
    font-size: 14px;
    opacity: 0.75;
  }
  #stage {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  canvas {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #3d2d20;
    border-radius: 10px;
    display: block;
  }
  .panel { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 12px; font-size: 13px; }
  .row label { width: 72px; opacity: 0.7; }
  .bar {
    flex: 1;
    height: 14px;
    background: #120d08;
    border-radius: 7px;
    overflow: hidden;
    position: relative;
  }
  .fill {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #56b1ff, #2d7fd9);
    transition: width 0.3s, background 0.3s;
  }
  .fill.low { background: linear-gradient(90deg, #d67b2c, #a14820); }
  .fill.high { background: linear-gradient(90deg, #7660d0, #4a3890); }
  .fill.growth { background: linear-gradient(90deg, #7fd04a, #2d8a22); }
  .val {
    width: 54px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    opacity: 0.85;
  }
  button {
    background: #2f78d6;
    color: white;
    border: 0;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  button:hover { background: #3d87e6; }
  button:active { background: #2363b8; }
  .info {
    font-size: 12px;
    opacity: 0.6;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <h1>MARIGOLD</h1>
  <div id="stage">
    <canvas id="c" width="400" height="400"></canvas>
    <div class="panel">
      <div class="row">
        <label>Moisture</label>
        <div class="bar"><div id="moistFill" class="fill"></div></div>
        <div id="moistVal" class="val">0%</div>
      </div>
      <div class="row">
        <label>Growth</label>
        <div class="bar"><div id="growthFill" class="fill growth"></div></div>
        <div id="stageVal" class="val">1 / 5</div>
      </div>
      <button id="water">Water +30%</button>
      <div class="info" id="info">&nbsp;</div>
    </div>
  </div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const moistFill = document.getElementById('moistFill');
  const moistVal = document.getElementById('moistVal');
  const growthFill = document.getElementById('growthFill');
  const stageVal = document.getElementById('stageVal');
  const waterBtn = document.getElementById('water');
  const infoEl = document.getElementById('info');

  const W = 400, H = 400;
  const CX = W / 2, CY = H / 2;

  const MAX_STAGES = 5;
  const STAGE_MS = 120000;                      // 2 real minutes per stage
  const TOTAL_GROWTH_MS = STAGE_MS * (MAX_STAGES - 1);
  const MIN_MOIST = 20;
  const MAX_MOIST = 90;
  const WATER_AMOUNT = 30;
  const SAVE_KEY = 'marigoldState.v1';

  const state = {
    moisture: 60,
    growth: 0,
    lastUpdate: Date.now(),
  };

  function advance(dtMs) {
    if (dtMs <= 0) return;
    const dtMin = dtMs / 60000;
    const m0 = state.moisture;
    // Growth window over linear decay m(τ) = m0 − τ, τ ∈ [0, dtMin]:
    // growing while m0 − τ ∈ [MIN_MOIST, MAX_MOIST].
    const tStart = Math.max(0, m0 - MAX_MOIST);
    const tEnd = Math.max(0, m0 - MIN_MOIST);
    const growMin = Math.max(
      0,
      Math.min(dtMin, tEnd) - Math.min(dtMin, tStart)
    );
    state.growth = Math.min(TOTAL_GROWTH_MS, state.growth + growMin * 60000);
    state.moisture = Math.max(0, m0 - dtMin);
  }

  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (typeof s.moisture === 'number') state.moisture = s.moisture;
        if (typeof s.growth === 'number') state.growth = s.growth;
        if (typeof s.lastUpdate === 'number') state.lastUpdate = s.lastUpdate;
        advance(Date.now() - state.lastUpdate);
      }
    } catch (e) {}
    state.lastUpdate = Date.now();
  }
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function currentStage() {
    return Math.min(MAX_STAGES, Math.floor(state.growth / STAGE_MS) + 1);
  }
  function stageProgress() {
    return (state.growth % STAGE_MS) / STAGE_MS;
  }

  // ---- Drawing (top-down) ----

  function drawBackground() {
    ctx.fillStyle = '#4a3826';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(0,0,0,0.12)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 9; i++) {
      const y = i * 48 + 10;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.bezierCurveTo(100, y + 3, 200, y - 3, W, y + 2);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,230,180,0.04)';
    for (let i = 0; i < 5; i++) {
      const y = i * 85 + 40;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y + 6);
      ctx.stroke();
    }
  }

  function drawPot() {
    // Drop shadow
    ctx.fillStyle = 'rgba(0,0,0,0.38)';
    ctx.beginPath();
    ctx.ellipse(CX + 4, CY + 8, 142, 138, 0, 0, Math.PI * 2);
    ctx.fill();

    // Outer rim (terracotta body)
    const rim = ctx.createRadialGradient(CX - 40, CY - 40, 40, CX, CY, 150);
    rim.addColorStop(0, '#de8a62');
    rim.addColorStop(0.7, '#b4542a');
    rim.addColorStop(1, '#8a3812');
    ctx.fillStyle = rim;
    ctx.beginPath();
    ctx.arc(CX, CY, 140, 0, Math.PI * 2);
    ctx.fill();

    // Rim highlight ring
    ctx.strokeStyle = 'rgba(255,210,170,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(CX, CY, 138, 0, Math.PI * 2);
    ctx.stroke();

    // Inner rim shadow
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(CX, CY, 122, 0, Math.PI * 2);
    ctx.stroke();

    // Soil
    const soil = ctx.createRadialGradient(CX - 25, CY - 25, 20, CX, CY, 118);
    soil.addColorStop(0, '#5a3a22');
    soil.addColorStop(1, '#241509');
    ctx.fillStyle = soil;
    ctx.beginPath();
    ctx.arc(CX, CY, 118, 0, Math.PI * 2);
    ctx.fill();

    // Soil texture speckles (deterministic)
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    for (let i = 0; i < 80; i++) {
      const a = i * 2.399;
      const r = Math.sqrt(i / 80) * 114;
      ctx.fillRect(CX + Math.cos(a) * r, CY + Math.sin(a) * r, 2, 2);
    }
    ctx.fillStyle = 'rgba(220,170,110,0.22)';
    for (let i = 0; i < 50; i++) {
      const a = i * 1.77 + 0.5;
      const r = Math.sqrt(i / 50) * 110;
      ctx.fillRect(CX + Math.cos(a) * r, CY + Math.sin(a) * r, 2, 2);
    }

    // Damp sheen when wet
    if (state.moisture > MAX_MOIST) {
      ctx.fillStyle = 'rgba(80,110,180,0.18)';
      ctx.beginPath();
      ctx.arc(CX, CY, 118, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawLeafRing(cx, cy, count, radius, length, color, darkColor) {
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2;
      const lx = cx + Math.cos(a) * radius * 0.45;
      const ly = cy + Math.sin(a) * radius * 0.45;
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(a);
      ctx.fillStyle = darkColor;
      ctx.beginPath();
      ctx.ellipse(length * 0.45, 0, length * 1.05, length * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(length * 0.4, 0, length, length * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();
      // midrib
      ctx.strokeStyle = darkColor;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-length * 0.4, 0);
      ctx.lineTo(length * 1.3, 0);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawPetalRing(cx, cy, count, radius, petalLen, petalWidth, color, angleOffset) {
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2 + angleOffset;
      ctx.save();
      ctx.translate(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius);
      ctx.rotate(a);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(0, 0, petalLen, petalWidth, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawPlant() {
    const stage = currentStage();
    const p = stageProgress();
    const sway = Math.sin(performance.now() / 1600) * 1.2;
    const x = CX + sway;
    const y = CY;

    if (stage === 1) {
      // Sprout: two cotyledons + tiny shoot
      const s = 0.6 + p * 0.9;
      ctx.fillStyle = '#2f5a1e';
      ctx.beginPath();
      ctx.ellipse(x - 5 * s, y, 7 * s, 3.5 * s, 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + 5 * s, y, 7 * s, 3.5 * s, -0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#6bbf3c';
      ctx.beginPath();
      ctx.ellipse(x - 5 * s, y - 0.5, 6 * s, 3 * s, 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + 5 * s, y - 0.5, 6 * s, 3 * s, -0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#8fe054';
      ctx.beginPath();
      ctx.arc(x, y, 2.5 * s, 0, Math.PI * 2);
      ctx.fill();
      return;
    }

    // Stages 2+: draw leaves
    const leafCount = 5 + stage;
    const leafLen = 14 + stage * 5 + p * 4;
    drawLeafRing(x, y, leafCount, 8, leafLen, '#4f8a2c', '#2c4f1d');

    if (stage === 2) {
      // Central rosette with tiny bud
      const r = 5 + p * 4;
      ctx.fillStyle = '#6aa83a';
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#8fc850';
      ctx.beginPath();
      ctx.arc(x - 1, y - 1, r * 0.55, 0, Math.PI * 2);
      ctx.fill();
    } else if (stage === 3) {
      // Green bud swelling with orange tint
      const r = 9 + p * 6;
      ctx.fillStyle = '#6a9a38';
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      // sepal hints
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2 + 0.2;
        ctx.save();
        ctx.translate(x + Math.cos(a) * r * 0.9, y + Math.sin(a) * r * 0.9);
        ctx.rotate(a);
        ctx.fillStyle = '#4f8a2c';
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 0.5, r * 0.22, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = `rgba(232, 140, 40, ${0.15 + p * 0.8})`;
      ctx.beginPath();
      ctx.arc(x, y, r * 0.65, 0, Math.PI * 2);
      ctx.fill();
    } else if (stage === 4) {
      // Opening flower
      const pr = 22 + p * 8;
      drawPetalRing(x, y, 8, pr * 0.55, pr * 0.5, pr * 0.28, '#c85c18', 0);
      drawPetalRing(x, y, 8, pr * 0.38, pr * 0.42, pr * 0.24, '#e88225', Math.PI / 8);
      drawPetalRing(x, y, 8, pr * 0.22, pr * 0.3, pr * 0.2, '#f5a840', 0);
      ctx.fillStyle = '#a24818';
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fill();
    } else if (stage === 5) {
      // Full marigold bloom
      const pr = 38;
      drawPetalRing(x, y, 14, pr * 0.55, pr * 0.48, pr * 0.22, '#b45210', 0);
      drawPetalRing(x, y, 14, pr * 0.44, pr * 0.44, pr * 0.2, '#d06a18', Math.PI / 14);
      drawPetalRing(x, y, 12, pr * 0.32, pr * 0.36, pr * 0.18, '#ea8322', 0);
      drawPetalRing(x, y, 10, pr * 0.2, pr * 0.26, pr * 0.15, '#f5a830', Math.PI / 10);
      drawPetalRing(x, y, 8, pr * 0.1, pr * 0.16, pr * 0.11, '#ffc85a', 0);
      ctx.fillStyle = '#c96820';
      ctx.beginPath();
      ctx.arc(x, y, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffe590';
      ctx.beginPath();
      ctx.arc(x - 1, y - 1.2, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function render() {
    drawBackground();
    drawPot();
    drawPlant();
  }

  function updateHud() {
    const m = state.moisture;
    moistFill.style.width = Math.max(0, Math.min(100, m)) + '%';
    moistFill.classList.toggle('low', m < MIN_MOIST);
    moistFill.classList.toggle('high', m > MAX_MOIST);
    moistVal.textContent = m.toFixed(1) + '%';

    const stage = currentStage();
    const growthPct = (state.growth / TOTAL_GROWTH_MS) * 100;
    growthFill.style.width = Math.min(100, growthPct) + '%';
    stageVal.textContent = stage + ' / ' + MAX_STAGES;

    if (stage >= MAX_STAGES) {
      infoEl.textContent = 'In full bloom';
    } else if (m < MIN_MOIST) {
      infoEl.textContent = 'Too dry — growth paused';
    } else if (m > MAX_MOIST) {
      infoEl.textContent = 'Too wet — growth paused';
    } else {
      infoEl.textContent = 'Growing…';
    }
  }

  waterBtn.addEventListener('click', () => {
    const now = Date.now();
    advance(now - state.lastUpdate);
    state.lastUpdate = now;
    state.moisture = Math.min(100, state.moisture + WATER_AMOUNT);
    save();
    updateHud();
  });

  load();
  let lastSave = Date.now();
  function tick() {
    const now = Date.now();
    advance(now - state.lastUpdate);
    state.lastUpdate = now;
    updateHud();
    render();
    if (now - lastSave > 5000) {
      save();
      lastSave = now;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) save();
  });
})();
</script>
</body>
</html>
