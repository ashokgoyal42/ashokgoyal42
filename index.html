<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games Hub</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #ffffff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #222;
  }
  .wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: clamp(28px, 6vw, 40px);
    letter-spacing: 0.5px;
  }
  p.sub {
    margin: 0 0 28px;
    color: #666;
    font-size: 15px;
  }
  .games {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  a.game {
    display: block;
    padding: 18px 20px;
    border: 1px solid #ddd;
    border-radius: 10px;
    text-decoration: none;
    color: inherit;
    background: #fafafa;
    transition: background 0.15s, transform 0.05s;
  }
  a.game:hover { background: #f0f0f0; }
  a.game:active { transform: scale(0.995); }
  .title { font-size: 18px; font-weight: 700; }
  .desc { font-size: 14px; color: #666; margin-top: 2px; }
  footer {
    margin-top: 36px;
    font-size: 12px;
    color: #999;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Games</h1>
  <p class="sub">Pick one to play.</p>
  <div class="games">
    <a class="game" href="rabbit-hunt.html">
      <div class="title">Rabbit Hunt</div>
      <div class="desc">Catch rabbits with the leopard before time runs out.</div>
    </a>
    <a class="game" href="billiards.html">
      <div class="title">Billiards</div>
      <div class="desc">Aim, charge, and shoot the ball around the table.</div>
    </a>
  </div>
  <footer>ashokgoyal42</footer>
</div>
</body>
</html>
