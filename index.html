<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Leopard Walk</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #1a1a1a;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(() => {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');

  const W = 320;
  const H = 180;
  canvas.width = W;
  canvas.height = H;
  ctx.imageSmoothingEnabled = false;

  const palette = {
    '.': null,
    'o': '#2b1810',
    'y': '#d9a648',
    'Y': '#e8c070',
    'c': '#f5e6c8',
    'p': '#e86f88',
    'b': '#000000',
    'w': '#ffffff',
    's': '#3d2416',
  };

  // Leopard sprite, side view facing right. 28 wide x 16 tall.
  // Two frames for walk cycle - legs alternate.
  const frameA = [
    '.....................ooo....',
    '....................osyso..o',
    '...................osyyyoos.',
    '..................osyyyyso..',
    '.oo..............osyyyyso...',
    'osyo............osyyyyso....',
    'osyyoooooooooooosyyyyoo.....',
    'osYYYsYYYYsYYYYYYYyYyo......',
    'obyYsYYYYsYYYYsYYYYyyo......',
    'opyYYYYsYYYYYYYsYYYYyo......',
    'oocccccccccccccccccco.......',
    '..os........os..os..os......',
    '..oyo.......oy..oy..oy......',
    '..oyo.......oy..oy..oy......',
    '..ooo.......oo..oo..oo......',
    '............................',
  ];

  const frameB = [
    '.....................ooo....',
    '....................osyso..o',
    '...................osyyyoos.',
    '..................osyyyyso..',
    '.oo..............osyyyyso...',
    'osyo............osyyyyso....',
    'osyyoooooooooooosyyyyoo.....',
    'osYYYsYYYYsYYYYYYYyYyo......',
    'obyYsYYYYsYYYYsYYYYyyo......',
    'opyYYYYsYYYYYYYsYYYYyo......',
    'oocccccccccccccccccco.......',
    '..oyo.......os..oyo.os......',
    '..oyo.......oyo.oyo.oyo.....',
    '...oo.......oyo..oo.oyo.....',
    '............oo.......oo.....',
    '............................',
  ];

  function buildSprite(rows) {
    const h = rows.length;
    const w = rows[0].length;
    const off = document.createElement('canvas');
    off.width = w;
    off.height = h;
    const octx = off.getContext('2d');
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const c = palette[rows[y][x]];
        if (c) {
          octx.fillStyle = c;
          octx.fillRect(x, y, 1, 1);
        }
      }
    }
    return off;
  }

  const sprites = [buildSprite(frameA), buildSprite(frameB)];
  const spriteW = sprites[0].width;
  const spriteH = sprites[0].height;
  const scale = 2;

  function drawScene(x, frameIdx, bob) {
    // sky gradient
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#ffb482');
    sky.addColorStop(0.5, '#ffd9a3');
    sky.addColorStop(1, '#f7e8c4');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // sun
    ctx.fillStyle = '#fff2b0';
    ctx.beginPath();
    ctx.arc(W - 60, 50, 22, 0, Math.PI * 2);
    ctx.fill();

    // distant hills
    ctx.fillStyle = '#c78a4a';
    for (let i = 0; i < 4; i++) {
      const cx = (i * 90 + 40);
      ctx.beginPath();
      ctx.arc(cx, 130, 40, Math.PI, 0);
      ctx.fill();
    }

    // ground
    ctx.fillStyle = '#a8733a';
    ctx.fillRect(0, 140, W, H - 140);
    ctx.fillStyle = '#8b5e2b';
    for (let gx = 0; gx < W; gx += 6) {
      ctx.fillRect(gx + ((gx * 7) % 5), 142 + ((gx * 3) % 4), 2, 1);
    }

    // grass tufts
    ctx.fillStyle = '#6b8f2b';
    for (let gx = 10; gx < W; gx += 47) {
      ctx.fillRect(gx, 138, 1, 3);
      ctx.fillRect(gx + 2, 139, 1, 2);
      ctx.fillRect(gx - 2, 139, 1, 2);
    }

    // leopard
    const dw = spriteW * scale;
    const dh = spriteH * scale;
    const groundY = 140 - dh + 2;
    ctx.drawImage(sprites[frameIdx], Math.floor(x), groundY + bob, dw, dh);
  }

  let x = -spriteW * scale;
  const speed = 0.6;
  let frameIdx = 0;
  let frameTimer = 0;
  const frameInterval = 140;
  let lastTime = performance.now();

  function loop(now) {
    const dt = now - lastTime;
    lastTime = now;

    x += speed * (dt / 16.6667);
    if (x > W) x = -spriteW * scale;

    frameTimer += dt;
    if (frameTimer >= frameInterval) {
      frameTimer -= frameInterval;
      frameIdx = 1 - frameIdx;
    }

    const bob = frameIdx === 0 ? 0 : -1;
    drawScene(x, frameIdx, bob);

    requestAnimationFrame(loop);
  }

  requestAnimationFrame((t) => { lastTime = t; loop(t); });
})();
</script>
</body>
</html>
