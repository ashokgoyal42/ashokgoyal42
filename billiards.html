<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billiards</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #222;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: 800px;
    padding: 8px;
    box-sizing: border-box;
  }
  canvas {
    display: block;
    background: #ffffff;
    touch-action: none;
    cursor: crosshair;
    width: 100%;
    max-width: 100%;
    height: auto;
  }
  #hint {
    font-size: 14px;
    color: #555;
    user-select: none;
  }
  button {
    font: inherit;
    padding: 6px 14px;
    border: 1px solid #888;
    background: #f6f6f6;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { background: #eaeaea; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="800" height="500"></canvas>
  <div id="hint">Aim with the mouse. Hold to set power (cue pulls back), release to shoot.</div>
  <button id="reset">Reset Balls</button>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const resetBtn = document.getElementById('reset');

  const W = canvas.width;
  const H = canvas.height;

  // Table rectangle (the playfield inside the canvas)
  const table = { x: 40, y: 40, w: W - 80, h: H - 80 };
  const railColor = '#6b3a1f';
  const feltColor = '#1f7a3a';

  // Balls
  const R = 12;
  const startPositions = {
    cue:    { x: table.x + table.w * 0.22, y: table.y + table.h * 0.50 },
    red:    { x: table.x + table.w * 0.70, y: table.y + table.h * 0.42 },
    yellow: { x: table.x + table.w * 0.70, y: table.y + table.h * 0.58 },
  };
  const cueBall    = { r: R, vx: 0, vy: 0, kind: 'cue',    pocketed: false, ...startPositions.cue };
  const redBall    = { r: R, vx: 0, vy: 0, kind: 'red',    pocketed: false, ...startPositions.red };
  const yellowBall = { r: R, vx: 0, vy: 0, kind: 'yellow', pocketed: false, ...startPositions.yellow };
  const balls = [cueBall, redBall, yellowBall];
  const friction = 0.992;
  const minSpeed = 0.04;
  const restitution = 0.96;

  // Pockets: 4 corners + 2 sides
  const pocketR = 18;
  const pockets = [
    { x: table.x,              y: table.y              },
    { x: table.x + table.w / 2, y: table.y             },
    { x: table.x + table.w,    y: table.y              },
    { x: table.x,              y: table.y + table.h    },
    { x: table.x + table.w / 2, y: table.y + table.h   },
    { x: table.x + table.w,    y: table.y + table.h    },
  ];

  // Cue (the long line)
  const cue = {
    length: 220,
    thickness: 4,
    color: '#c89a5a',
    tipColor: '#2b1810',
    gap: 6,          // gap between ball and cue tip when aiming
    maxPull: 80,     // max pull-back distance while charging
  };

  const mouse = { x: W / 2, y: H / 2, inside: false };
  let charging = false;
  let chargeStart = 0;
  const maxChargeMs = 900;

  function resetBall() {
    for (const b of balls) {
      const p = startPositions[b.kind];
      b.x = p.x; b.y = p.y;
      b.vx = 0; b.vy = 0;
      b.pocketed = false;
    }
    charging = false;
  }
  resetBtn.addEventListener('click', resetBall);

  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * W,
      y: ((e.clientY - rect.top) / rect.height) * H,
    };
  }

  canvas.addEventListener('pointermove', (e) => {
    const p = pointerPos(e);
    mouse.x = p.x;
    mouse.y = p.y;
    mouse.inside = true;
  });
  canvas.addEventListener('pointerleave', () => { mouse.inside = false; });

  canvas.addEventListener('pointerdown', (e) => {
    if (isMoving()) return;
    canvas.setPointerCapture(e.pointerId);
    charging = true;
    chargeStart = performance.now();
  });
  canvas.addEventListener('pointerup', (e) => {
    if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
    if (!charging) return;
    const t = Math.min(1, (performance.now() - chargeStart) / maxChargeMs);
    charging = false;
    shoot(t);
  });

  function isMoving() {
    for (const b of balls) {
      if (b.pocketed) continue;
      if (Math.hypot(b.vx, b.vy) > minSpeed) return true;
    }
    return false;
  }

  function pocketBall(b) {
    if (b.kind === 'cue') {
      // Scratch: respawn cue ball at its starting spot.
      const p = startPositions.cue;
      b.x = p.x; b.y = p.y;
      b.vx = 0; b.vy = 0;
    } else {
      b.pocketed = true;
      b.vx = 0; b.vy = 0;
    }
  }

  function aimAngle() {
    // Angle from cue ball toward mouse; cue is drawn on opposite side, pointing at cue ball.
    const dx = mouse.x - cueBall.x;
    const dy = mouse.y - cueBall.y;
    if (dx === 0 && dy === 0) return 0;
    return Math.atan2(dy, dx);
  }

  function shoot(power) {
    // power: 0..1
    const angle = aimAngle();
    const maxSpeed = 14;
    const speed = Math.max(2, power * maxSpeed);
    cueBall.vx = Math.cos(angle) * speed;
    cueBall.vy = Math.sin(angle) * speed;
  }

  function resolveBallCollision(a, b) {
    if (a.pocketed || b.pocketed) return;
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const dist = Math.hypot(dx, dy);
    const minDist = a.r + b.r;
    if (dist === 0 || dist >= minDist) return;
    // Separate so they don't overlap
    const nx = dx / dist;
    const ny = dy / dist;
    const overlap = (minDist - dist) / 2;
    a.x -= nx * overlap; a.y -= ny * overlap;
    b.x += nx * overlap; b.y += ny * overlap;
    // Elastic collision (equal mass): swap velocity components along the normal
    const va = a.vx * nx + a.vy * ny;
    const vb = b.vx * nx + b.vy * ny;
    const diff = (vb - va);
    a.vx += diff * nx; a.vy += diff * ny;
    b.vx -= diff * nx; b.vy -= diff * ny;
    // Small energy loss
    a.vx *= 0.995; a.vy *= 0.995;
    b.vx *= 0.995; b.vy *= 0.995;
  }

  function update() {
    for (const b of balls) {
      if (b.pocketed) continue;
      b.x += b.vx;
      b.y += b.vy;

      // Check pockets first — if ball falls in, skip rail collision.
      let inPocket = false;
      for (const p of pockets) {
        if (Math.hypot(b.x - p.x, b.y - p.y) < pocketR) {
          pocketBall(b);
          inPocket = true;
          break;
        }
      }
      if (inPocket) continue;

      const left = table.x + b.r;
      const right = table.x + table.w - b.r;
      const top = table.y + b.r;
      const bottom = table.y + table.h - b.r;
      if (b.x < left)  { b.x = left;   b.vx = -b.vx * restitution; }
      if (b.x > right) { b.x = right;  b.vx = -b.vx * restitution; }
      if (b.y < top)   { b.y = top;    b.vy = -b.vy * restitution; }
      if (b.y > bottom){ b.y = bottom; b.vy = -b.vy * restitution; }

      b.vx *= friction;
      b.vy *= friction;
      if (Math.abs(b.vx) < minSpeed) b.vx = 0;
      if (Math.abs(b.vy) < minSpeed) b.vy = 0;
    }

    // Ball-to-ball collision
    for (let i = 0; i < balls.length; i++) {
      for (let j = i + 1; j < balls.length; j++) {
        resolveBallCollision(balls[i], balls[j]);
      }
    }
  }

  function drawTable() {
    // Outer rail
    ctx.fillStyle = railColor;
    ctx.fillRect(table.x - 18, table.y - 18, table.w + 36, table.h + 36);
    // Felt
    ctx.fillStyle = feltColor;
    ctx.fillRect(table.x, table.y, table.w, table.h);
    // Inner border line
    ctx.strokeStyle = '#0f4a22';
    ctx.lineWidth = 2;
    ctx.strokeRect(table.x + 1, table.y + 1, table.w - 2, table.h - 2);
  }

  function drawPockets() {
    for (const p of pockets) {
      // Subtle rim
      ctx.beginPath();
      ctx.arc(p.x, p.y, pocketR + 2, 0, Math.PI * 2);
      ctx.fillStyle = '#2a1808';
      ctx.fill();
      // Hole
      ctx.beginPath();
      ctx.arc(p.x, p.y, pocketR, 0, Math.PI * 2);
      ctx.fillStyle = '#000000';
      ctx.fill();
    }
  }

  function ballFill(kind) {
    if (kind === 'red') return '#d62828';
    if (kind === 'yellow') return '#e6b900';
    return '#ffffff';
  }

  function drawBall(b) {
    if (b.pocketed) return;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = ballFill(b.kind);
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#333';
    ctx.stroke();
    // Highlight
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.28, 0, Math.PI * 2);
    ctx.fillStyle = b.kind === 'cue' ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.35)';
    ctx.fill();
    // Red spot on the cue ball
    if (b.kind === 'cue') {
      ctx.beginPath();
      ctx.arc(b.x + b.r * 0.15, b.y + b.r * 0.1, b.r * 0.22, 0, Math.PI * 2);
      ctx.fillStyle = '#d62828';
      ctx.fill();
    }
  }

  function drawBalls() {
    for (const b of balls) drawBall(b);
  }

  function drawCue() {
    if (isMoving() || !mouse.inside) return;
    const angle = aimAngle();

    // Pull distance grows while charging
    let pull = cue.gap;
    if (charging) {
      const t = Math.min(1, (performance.now() - chargeStart) / maxChargeMs);
      pull = cue.gap + t * cue.maxPull;
    }

    // The cue sits on the opposite side of the mouse, so it "points at" the cue ball.
    // Tip is near the ball; butt is far away.
    const tipX = cueBall.x - Math.cos(angle) * (cueBall.r + pull);
    const tipY = cueBall.y - Math.sin(angle) * (cueBall.r + pull);
    const buttX = tipX - Math.cos(angle) * cue.length;
    const buttY = tipY - Math.sin(angle) * cue.length;

    // Shaft
    ctx.lineCap = 'round';
    ctx.strokeStyle = cue.color;
    ctx.lineWidth = cue.thickness;
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(buttX, buttY);
    ctx.stroke();

    // Tip
    ctx.beginPath();
    ctx.arc(tipX, tipY, cue.thickness * 0.75, 0, Math.PI * 2);
    ctx.fillStyle = cue.tipColor;
    ctx.fill();

    // Aim guideline while charging
    if (charging) {
      ctx.save();
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = 'rgba(255,255,255,0.75)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cueBall.x, cueBall.y);
      ctx.lineTo(cueBall.x + Math.cos(angle) * 120, cueBall.y + Math.sin(angle) * 120);
      ctx.stroke();
      ctx.restore();

      // Power meter
      const t = Math.min(1, (performance.now() - chargeStart) / maxChargeMs);
      const meterW = 160, meterH = 10;
      const mx = (W - meterW) / 2, my = H - 24;
      ctx.fillStyle = '#ddd';
      ctx.fillRect(mx, my, meterW, meterH);
      ctx.fillStyle = t < 0.66 ? '#2ca84a' : (t < 0.9 ? '#e0a84a' : '#d62828');
      ctx.fillRect(mx, my, meterW * t, meterH);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      ctx.strokeRect(mx + 0.5, my + 0.5, meterW - 1, meterH - 1);
    }
  }

  function frame() {
    update();
    ctx.clearRect(0, 0, W, H);
    drawTable();
    drawPockets();
    drawBalls();
    drawCue();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
