<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Maze</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #ffffff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #222;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 40px;
    text-align: center;
  }
  h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: 0.5px; }
  p.sub { margin: 0 0 18px; color: #666; font-size: 14px; }
  .stage {
    display: inline-block;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 12px;
  }
  canvas { display: block; background: #ffffff; }
  .hud {
    margin-top: 14px;
    font-size: 13px;
    color: #555;
    line-height: 1.5;
  }
  .hud b { color: #222; }
  .controls {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    font: inherit;
    padding: 8px 14px;
    border: 1px solid #ccc;
    background: #fafafa;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: #f0f0f0; }
  .status {
    margin-top: 10px;
    min-height: 1.4em;
    font-size: 14px;
    color: #b8860b;
  }
  .status.win { color: #1f7a3a; font-weight: 600; }
  a.back { color: #888; font-size: 13px; text-decoration: none; }
  a.back:hover { color: #333; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Voice Maze</h1>
  <p class="sub">Walk in, find the exit. Touch the door with your arm to open it.</p>
  <div class="stage">
    <canvas id="game" width="520" height="520"></canvas>
  </div>
  <div class="status" id="status">&nbsp;</div>
  <div class="hud">
    <div><b>Arrows / WASD</b> &mdash; move one cell</div>
    <div><b>Space</b> &mdash; extend arm (touch a door to open it)</div>
  </div>
  <div class="controls">
    <button id="reset">New maze</button>
    <a class="back" href="index.html">&larr; back to games</a>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const resetBtn = document.getElementById('reset');

  const COLS = 13;
  const ROWS = 13;
  const CELL = 40;
  const PAD = 0;
  const W = COLS * CELL;
  const H = ROWS * CELL;
  canvas.width = W;
  canvas.height = H;

  // Maze: each cell stores walls {n,e,s,w}. We carve passages with recursive backtracker.
  let cells, player, facing, entrance, exit, exitOpen, animating, armAnim, won, entering;

  function makeMaze() {
    const grid = [];
    for (let y = 0; y < ROWS; y++) {
      const row = [];
      for (let x = 0; x < COLS; x++) {
        row.push({ n: true, e: true, s: true, w: true, visited: false });
      }
      grid.push(row);
    }
    const stack = [];
    const start = { x: 0, y: Math.floor(ROWS / 2) };
    grid[start.y][start.x].visited = true;
    stack.push(start);

    const dirs = [
      { dx: 0, dy: -1, a: 'n', b: 's' },
      { dx: 1, dy: 0, a: 'e', b: 'w' },
      { dx: 0, dy: 1, a: 's', b: 'n' },
      { dx: -1, dy: 0, a: 'w', b: 'e' },
    ];

    while (stack.length) {
      const cur = stack[stack.length - 1];
      const opts = [];
      for (const d of dirs) {
        const nx = cur.x + d.dx, ny = cur.y + d.dy;
        if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && !grid[ny][nx].visited) {
          opts.push({ d, nx, ny });
        }
      }
      if (!opts.length) { stack.pop(); continue; }
      const choice = opts[Math.floor(Math.random() * opts.length)];
      grid[cur.y][cur.x][choice.d.a] = false;
      grid[choice.ny][choice.nx][choice.d.b] = false;
      grid[choice.ny][choice.nx].visited = true;
      stack.push({ x: choice.nx, y: choice.ny });
    }
    return grid;
  }

  function reset() {
    cells = makeMaze();
    entrance = { x: 0, y: Math.floor(ROWS / 2) };
    exit = { x: COLS - 1, y: Math.floor(ROWS / 2) };
    // Player starts just outside the entrance (offscreen left), then walks in.
    player = { px: -CELL / 2, py: entrance.y * CELL + CELL / 2, gx: -1, gy: entrance.y };
    facing = 'e';
    exitOpen = false;
    animating = false;
    armAnim = 0;
    won = false;
    entering = true;
    setStatus('A door slams shut behind you...');
    // Walk in to entrance cell.
    moveTo(entrance.x, entrance.y, () => {
      entering = false;
      setStatus('Find the exit on the right. Touch the door with SPACE.');
    });
  }

  function setStatus(msg, isWin) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (isWin ? ' win' : '');
  }

  function canMove(gx, gy, dir) {
    if (gx < 0 || gx >= COLS || gy < 0 || gy >= ROWS) return false;
    const c = cells[gy][gx];
    return !c[dir];
  }

  function tryStep(dir) {
    if (animating || won || entering) return;
    facing = dir;
    const map = { n: [0, -1], s: [0, 1], e: [1, 0], w: [-1, 0] };
    const [dx, dy] = map[dir];
    const nx = player.gx + dx, ny = player.gy + dy;

    // Stepping out through the exit (right edge) is allowed only if exit is open.
    if (player.gx === exit.x && player.gy === exit.y && dir === 'e') {
      if (exitOpen) {
        moveTo(COLS, exit.y, () => {
          won = true;
          setStatus('You made it out! Click "New maze" to play again.', true);
        });
      } else {
        flashStatus('The exit door is locked. Touch it with SPACE.');
      }
      return;
    }

    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return;
    if (!canMove(player.gx, player.gy, dir)) {
      flashStatus('A wall blocks you.');
      return;
    }
    moveTo(nx, ny);
  }

  let flashTimer = 0;
  function flashStatus(msg) {
    setStatus(msg);
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => {
      if (!won) setStatus('Find the exit on the right. Touch the door with SPACE.');
    }, 1500);
  }

  function moveTo(gx, gy, done) {
    animating = true;
    const startX = player.px, startY = player.py;
    const targetX = gx * CELL + CELL / 2;
    const targetY = gy * CELL + CELL / 2;
    const t0 = performance.now();
    const dur = 140;
    function tick(t) {
      const k = Math.min(1, (t - t0) / dur);
      const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      player.px = startX + (targetX - startX) * e;
      player.py = startY + (targetY - startY) * e;
      if (k < 1) {
        requestAnimationFrame(tick);
      } else {
        player.gx = gx;
        player.gy = gy;
        animating = false;
        if (done) done();
      }
    }
    requestAnimationFrame(tick);
  }

  function extendArm() {
    if (animating || won || entering) return;
    armAnim = performance.now();
    // Check whether the arm reaches the exit door.
    if (player.gx === exit.x && player.gy === exit.y && facing === 'e' && !exitOpen) {
      exitOpen = true;
      setStatus('Click! The exit door swings open. Walk east to leave.');
      return;
    }
    // Touching any other wall does nothing (yet).
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Floor
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    // Walls
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 3;
    ctx.lineCap = 'square';
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const c = cells[y][x];
        const x0 = x * CELL, y0 = y * CELL;
        if (c.n) line(x0, y0, x0 + CELL, y0);
        if (c.w) line(x0, y0, x0, y0 + CELL);
        // Bottom and right walls drawn by neighbors / outer border below.
      }
    }
    // Outer border (skip entrance and exit doorways).
    // Top and bottom
    line(0, 0, W, 0);
    line(0, H, W, H);
    // Left wall, with a gap at entrance (closed once player enters)
    drawSideWall('w');
    drawSideWall('e');

    // Entrance door (left side at entrance row) — visible after player enters.
    drawDoor(entrance.x, entrance.y, 'w', !entering, false); // closed once we're in
    // Exit door (right side at exit row)
    drawDoor(exit.x, exit.y, 'e', !exitOpen, exitOpen);

    // Player
    drawPlayer();
  }

  function drawSideWall(side) {
    // Draw left/right outer walls in segments, leaving the entrance/exit gap.
    const isW = side === 'w';
    const x = isW ? 0 : W;
    const skipY = (isW ? entrance.y : exit.y);
    const top = skipY * CELL;
    const bot = (skipY + 1) * CELL;
    line(x, 0, x, top);
    line(x, bot, x, H);
  }

  function drawDoor(gx, gy, side, closed, open) {
    const x0 = gx * CELL, y0 = gy * CELL;
    let x1, y1, x2, y2;
    if (side === 'w') { x1 = x0; y1 = y0 + 4; x2 = x0; y2 = y0 + CELL - 4; }
    else if (side === 'e') { x1 = x0 + CELL; y1 = y0 + 4; x2 = x0 + CELL; y2 = y0 + CELL - 4; }

    if (closed) {
      ctx.strokeStyle = open ? '#1f7a3a' : '#b8520a';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      // Knob
      ctx.fillStyle = '#444';
      const kx = side === 'w' ? x1 + 6 : x1 - 6;
      const ky = (y1 + y2) / 2;
      ctx.beginPath();
      ctx.arc(kx, ky, 2.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Open: draw a thin green frame on the side, gap in the wall.
      ctx.strokeStyle = '#1f7a3a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      const ox = side === 'e' ? x1 - 8 : x1 + 8;
      ctx.moveTo(x1, y1);
      ctx.lineTo(ox, y1 - 2);
      ctx.moveTo(x1, y2);
      ctx.lineTo(ox, y2 + 2);
      ctx.stroke();
    }
    // restore
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 3;
  }

  function line(x1, y1, x2, y2) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function drawPlayer() {
    const r = 11;
    ctx.fillStyle = '#1e6fd9';
    ctx.beginPath();
    ctx.arc(player.px, player.py, r, 0, Math.PI * 2);
    ctx.fill();
    // Facing indicator (small triangle)
    const map = { n: [0, -1], s: [0, 1], e: [1, 0], w: [-1, 0] };
    const [fx, fy] = map[facing];
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(player.px + fx * 4, player.py + fy * 4, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Arm animation
    if (armAnim) {
      const t = (performance.now() - armAnim) / 220;
      if (t > 1) {
        armAnim = 0;
      } else {
        const reach = (t < 0.5 ? t * 2 : 1 - (t - 0.5) * 2) * (CELL / 2);
        ctx.strokeStyle = '#1e6fd9';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(player.px, player.py);
        ctx.lineTo(player.px + fx * reach, player.py + fy * reach);
        ctx.stroke();
        ctx.fillStyle = '#1e6fd9';
        ctx.beginPath();
        ctx.arc(player.px + fx * reach, player.py + fy * reach, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function loop() {
    draw();
    requestAnimationFrame(loop);
  }

  // Input
  const keyMap = {
    ArrowUp: 'n', ArrowDown: 's', ArrowLeft: 'w', ArrowRight: 'e',
    w: 'n', s: 's', a: 'w', d: 'e',
    W: 'n', S: 's', A: 'w', D: 'e',
  };
  window.addEventListener('keydown', (e) => {
    if (e.key === ' ') { e.preventDefault(); extendArm(); return; }
    const dir = keyMap[e.key];
    if (dir) { e.preventDefault(); tryStep(dir); }
  });

  resetBtn.addEventListener('click', reset);

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
