<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IsoSquash</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #2a2a2a;
    overflow: hidden;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #111;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    width: 100%;
    max-width: 460px;
    height: 100dvh;
    padding: 6px 8px;
    box-sizing: border-box;
    user-select: none;
  }
  canvas {
    display: block;
    background: #ffffff;
    touch-action: none;
    cursor: none;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #bar {
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 12px;
    color: #111;
    width: 100%;
    justify-content: space-between;
    background: #fff;
    padding: 6px 10px;
    box-sizing: border-box;
    border-radius: 4px;
  }
  #bar .group { display: flex; gap: 8px; align-items: center; }
  button {
    font: inherit;
    padding: 4px 10px;
    border: 1px solid #111;
    background: #fff;
    cursor: pointer;
    color: #111;
  }
  #scoreline { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 15px; letter-spacing: 0.5px; }
  #best { color: #555; font-size: 11px; }
  a.back { color: #fff; font-size: 11px; text-align: center; text-decoration: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <div class="group">
      <span id="scoreline">rally 0</span>
      <span id="best">best 0</span>
    </div>
    <div class="group"><button id="serve">serve</button></div>
  </div>
  <canvas id="c" width="440" height="660"></canvas>
  <a class="back" href="index.html">&larr; back</a>
</div>
<script>
(() => {
  const canvas   = document.getElementById('c');
  const ctx      = canvas.getContext('2d');
  const scoreEl  = document.getElementById('scoreline');
  const bestEl   = document.getElementById('best');
  const serveBtn = document.getElementById('serve');

  // World units. Court is a closed glass box.
  // x: -CW..CW (left/right walls), y: -CD..CD (front/back walls), z: 0..CH (floor/ceiling).
  const CW = 50;   // half width
  const CD = 70;   // half depth
  const CH = 60;   // ceiling height

  // Iso projection (true 2:1). Origin & SCALE chosen at fit time.
  let ORIGX = 0, ORIGY = 0, SCALE = 1;
  let W = canvas.width, H = canvas.height;

  function iso(x, y, z = 0) {
    return {
      x: ORIGX + (x - y) * SCALE,
      y: ORIGY + (x + y) * 0.5 * SCALE - z * SCALE
    };
  }
  function unproject(px, py) {
    // Inverse for z=0: px = ORIGX + (x-y)S, py = ORIGY + (x+y)/2 S
    const a = (px - ORIGX) / SCALE;
    const b = (py - ORIGY) * 2 / SCALE;
    return { x: (a + b) / 2, y: (b - a) / 2 };
  }

  function fitCanvas() {
    const rect = canvas.getBoundingClientRect();
    const w = Math.min(560, Math.max(320, Math.round(rect.width)));
    const h = Math.min(960, Math.max(480, Math.round(rect.height)));
    canvas.width = w; canvas.height = h;
    W = w; H = h;
    // iso extents of the box (all 8 corners considered):
    //   width on screen  = 2 * (CW + CD) * SCALE
    //   height on screen = (CW + CD) * SCALE + CH * SCALE
    const PADDING = 18;
    const wExtent = 2 * (CW + CD);
    const hExtent = (CW + CD) + CH;
    SCALE = Math.min((w - PADDING * 2) / wExtent, (h - PADDING * 2) / hExtent);
    // Centre the box.
    // x extent is symmetric about iso(0,0,0).x, so ORIGX = W/2.
    ORIGX = W / 2;
    // y midpoint of iso bounds = ORIGY + (top + bot)/2
    //   top = -(CW + CD)/2 * SCALE - CH * SCALE
    //   bot = +(CW + CD)/2 * SCALE
    //   mid = ORIGY - CH/2 * SCALE
    // Want mid = H/2  =>  ORIGY = H/2 + CH/2 * SCALE
    ORIGY = H / 2 + (CH / 2) * SCALE;
  }

  // --- State ---
  const RACKET_RX = 13, RACKET_RY = 8, RACKET_Z = 9;
  const BALL_R = 2.6;
  const ball = {
    x: 0, y: CD * 0.5, z: RACKET_Z,
    vx: 0, vy: 0, vz: 0,
    live: false,
    floorBounces: 0,
    lastTouch: 'none',
  };
  const player = { x: 0, y: CD * 0.5, tx: null, ty: null };
  const pointer = { active: false, x: 0, y: 0 };

  let rally = 0;
  let best = parseInt(localStorage.getItem('isosquash_best') || '0', 10);
  let message = '';
  let messageT = 0;
  let dead = false;

  const setMessage = (s, t = 90) => { message = s; messageT = t; };
  function refreshHUD() {
    scoreEl.textContent = `rally ${rally}`;
    bestEl.textContent  = `best ${best}`;
    serveBtn.textContent = dead ? 'play' : 'serve';
  }

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  function resetServe() {
    ball.live = false;
    ball.vx = ball.vy = ball.vz = 0;
    ball.floorBounces = 0;
    ball.lastTouch = 'none';
    ball.x = player.x;
    ball.y = player.y;
    ball.z = RACKET_Z;
    dead = false;
    refreshHUD();
  }

  function serve() {
    if (ball.live) return;
    // Aim toward a random spot on the front wall (y = -CD).
    const tx = (Math.random() - 0.5) * (CW * 1.2);
    const ty = -CD;
    const dx = tx - ball.x, dy = ty - ball.y;
    const d  = Math.hypot(dx, dy);
    const speed = 1.7;
    ball.vx = (dx / d) * speed;
    ball.vy = (dy / d) * speed;
    ball.vz = 0.55;
    ball.live = true;
    ball.floorBounces = 0;
    ball.lastTouch = 'racket';
    setMessage('go!', 30);
  }

  serveBtn.addEventListener('click', () => {
    if (dead) { rally = 0; refreshHUD(); resetServe(); }
    serve();
  });

  // --- Pointer ---
  function canvasCoords(e) {
    const r = canvas.getBoundingClientRect();
    const sx = canvas.width / r.width;
    const sy = canvas.height / r.height;
    return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
  }
  function setTargetFromPointer(p) {
    const w = unproject(p.x, p.y);
    player.tx = clamp(w.x, -CW + 4, CW - 4);
    player.ty = clamp(w.y, -CD + 4, CD - 4);
  }
  canvas.addEventListener('pointerdown', e => {
    const p = canvasCoords(e);
    pointer.active = true; pointer.x = p.x; pointer.y = p.y;
    setTargetFromPointer(p);
    if (dead) { rally = 0; refreshHUD(); resetServe(); serve(); return; }
    if (!ball.live) serve();
  });
  canvas.addEventListener('pointermove', e => {
    e.preventDefault();
    const p = canvasCoords(e);
    pointer.x = p.x; pointer.y = p.y; pointer.active = true;
    setTargetFromPointer(p);
  });
  const endPointer = () => { pointer.active = false; };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', endPointer);

  // --- Update ---
  let tPrev = performance.now();
  const TIME_SCALE = 0.5;
  const GRAV = 0.012;

  function updatePlayer(dt) {
    const sp = 1.7;
    const tx = player.tx != null ? player.tx : player.x;
    const ty = player.ty != null ? player.ty : player.y;
    const dx = tx - player.x, dy = ty - player.y;
    const d  = Math.hypot(dx, dy);
    if (d > 0.01) {
      const step = Math.min(sp * dt, d);
      player.x += (dx / d) * step;
      player.y += (dy / d) * step;
    }
    player.x = clamp(player.x, -CW + 4, CW - 4);
    player.y = clamp(player.y, -CD + 4, CD - 4);
  }

  function tryHit(prevPos) {
    if (ball.z > RACKET_Z + 12 || ball.z < 0.5) return false;
    if (Math.abs(ball.x - player.x) > RACKET_RX) return false;
    const yMin = Math.min(prevPos.y, ball.y) - RACKET_RY;
    const yMax = Math.max(prevPos.y, ball.y) + RACKET_RY;
    if (player.y < yMin || player.y > yMax) return false;

    // Compute target — favour the wall furthest from current ball direction.
    // Simple: aim at the wall opposite to ball.vy direction (so we send it back across).
    let tx = (Math.random() - 0.5) * (CW * 1.2);
    let ty = ball.vy < 0 ? CD - 8 : -CD + 8;          // send to opposite y wall
    if (Math.abs(ball.vy) < 0.05) ty = -CD + 8;        // edge case

    const dx = tx - ball.x, dy = ty - ball.y;
    const d  = Math.hypot(dx, dy);
    const speed = 1.7;
    ball.vx = (dx / d) * speed;
    ball.vy = (dy / d) * speed;
    ball.vz = 0.55;
    ball.floorBounces = 0;
    ball.lastTouch = 'racket';
    rally += 1;
    if (rally > best) { best = rally; localStorage.setItem('isosquash_best', String(best)); }
    refreshHUD();
    setMessage('thwack', 14);
    return true;
  }

  function endRally(reason) {
    if (!ball.live) return;
    ball.live = false;
    dead = true;
    setMessage(reason, 0);
    refreshHUD();
  }

  function step(now) {
    const dtMs = Math.min(50, now - tPrev);
    tPrev = now;
    const dt = (dtMs / 16.67) * TIME_SCALE;

    updatePlayer(dt);

    if (ball.live) {
      const prev = { x: ball.x, y: ball.y, z: ball.z };

      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      ball.z += ball.vz * dt;
      ball.vz -= GRAV * dt;

      // Wall reflections — closed glass box.
      const D = 0.97;  // wall damping
      if (ball.x < -CW + BALL_R) { ball.x = -CW + BALL_R; ball.vx =  Math.abs(ball.vx) * D; ball.lastTouch = 'wall'; }
      if (ball.x >  CW - BALL_R) { ball.x =  CW - BALL_R; ball.vx = -Math.abs(ball.vx) * D; ball.lastTouch = 'wall'; }
      if (ball.y < -CD + BALL_R) { ball.y = -CD + BALL_R; ball.vy =  Math.abs(ball.vy) * D; ball.lastTouch = 'wall'; }
      if (ball.y >  CD - BALL_R) { ball.y =  CD - BALL_R; ball.vy = -Math.abs(ball.vy) * D; ball.lastTouch = 'wall'; }

      // Ceiling
      if (ball.z > CH - BALL_R) { ball.z = CH - BALL_R; ball.vz = -Math.abs(ball.vz) * D; ball.lastTouch = 'wall'; }

      // Floor
      if (ball.z <= 0 && ball.vz < 0) {
        ball.z = 0;
        ball.floorBounces += 1;
        if (ball.floorBounces >= 2) {
          endRally('two bounces!');
        } else {
          ball.vz = Math.max(0.42, Math.abs(ball.vz) * 0.8);
          ball.vx *= 0.95;
          ball.vy *= 0.95;
          ball.lastTouch = 'floor';
        }
      }

      // Try player contact
      if (ball.live) tryHit(prev);
    } else {
      // Park ball at player while not live (between rallies / on serve)
      ball.x = player.x;
      ball.y = player.y;
      ball.z = RACKET_Z;
    }

    if (messageT > 0) messageT--;
    draw();
    requestAnimationFrame(step);
  }

  // --- Drawing ---
  function strokeLine(a, b, w = 1, c = '#111') {
    ctx.strokeStyle = c; ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(a.x + 0.5, a.y + 0.5);
    ctx.lineTo(b.x + 0.5, b.y + 0.5);
    ctx.stroke();
  }
  function strokePoly(pts, w = 1, c = '#111') {
    ctx.strokeStyle = c; ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(pts[0].x + 0.5, pts[0].y + 0.5);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x + 0.5, pts[i].y + 0.5);
    ctx.closePath();
    ctx.stroke();
  }
  function fillPoly(pts, c) {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    ctx.fill();
  }

  function drawCourt() {
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);

    // 8 corners of the box
    const A0 = iso(-CW, -CD, 0),   B0 = iso( CW, -CD, 0),
          C0 = iso( CW,  CD, 0),   D0 = iso(-CW,  CD, 0);
    const A1 = iso(-CW, -CD, CH),  B1 = iso( CW, -CD, CH),
          C1 = iso( CW,  CD, CH),  D1 = iso(-CW,  CD, CH);

    // Faint glass tint on the back-most wall faces (the ones we'd be looking through).
    const GL = 'rgba(60,90,130,0.06)';
    fillPoly([A0, B0, B1, A1], GL);   // front wall (y = -CD)
    fillPoly([A0, D0, D1, A1], GL);   // left wall  (x = -CW)

    // Floor outline (bold).
    strokePoly([A0, B0, C0, D0], 2);

    // Service line + half-court line (back half).
    strokeLine(iso(-CW, CD * 0.2), iso(CW, CD * 0.2), 1);
    strokeLine(iso(0, CD * 0.2), iso(0, CD), 1);

    // Ceiling outline (light).
    strokePoly([A1, B1, C1, D1], 1, '#9aa');

    // 4 vertical edges (the corner posts of the glass box).
    strokeLine(A0, A1, 1.4);
    strokeLine(B0, B1, 1.4);
    strokeLine(C0, C1, 1.4);
    strokeLine(D0, D1, 1.4);

    // Glass mullions (one horizontal line halfway up each wall, faint).
    const M = '#bbb';
    const midZ = CH * 0.55;
    strokeLine(iso(-CW, -CD, midZ), iso( CW, -CD, midZ), 1, M);   // front
    strokeLine(iso(-CW,  CD, midZ), iso( CW,  CD, midZ), 1, M);   // back
    strokeLine(iso(-CW, -CD, midZ), iso(-CW,  CD, midZ), 1, M);   // left
    strokeLine(iso( CW, -CD, midZ), iso( CW,  CD, midZ), 1, M);   // right
  }

  function drawShadow(x, y) {
    const s = iso(x, y, 0);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(s.x, s.y, 5 * SCALE * 0.5, 2.5 * SCALE * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawRacket(p) {
    drawShadow(p.x, p.y);
    const head = iso(p.x, p.y, RACKET_Z);
    const grip = iso(p.x, p.y, 0);
    ctx.strokeStyle = '#111';
    ctx.fillStyle = '#fff';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(head.x, head.y, RACKET_RX * SCALE, RACKET_RY * SCALE, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(head.x - RACKET_RX * SCALE + 2, head.y);
    ctx.lineTo(head.x + RACKET_RX * SCALE - 2, head.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(head.x, head.y);
    ctx.lineTo(grip.x, grip.y);
    ctx.stroke();
  }

  function drawBall() {
    drawShadow(ball.x, ball.y);
    const b = iso(ball.x, ball.y, ball.z);
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(b.x, b.y, Math.max(2.5, BALL_R * SCALE), 0, Math.PI * 2);
    ctx.fill();
  }

  function drawHUD() {
    if (message) {
      ctx.fillStyle = '#111';
      ctx.font = '11px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(message, W / 2, 14);
    }
    if (dead) {
      ctx.fillStyle = '#111';
      ctx.font = '13px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('tap to play', W / 2, H - 14);
    }
  }

  function draw() {
    drawCourt();
    drawRacket(player);
    drawBall();
    drawHUD();
  }

  // init
  window.addEventListener('resize', () => { fitCanvas(); resetServe(); });
  fitCanvas();
  refreshHUD();
  resetServe();
  setTimeout(() => { if (!ball.live && !dead) serve(); }, 900);
  requestAnimationFrame(t => { tPrev = t; step(t); });
})();
</script>
</body>
</html>
