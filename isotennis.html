<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IsoTennis</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #2a2a2a;
    overflow: hidden;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #111;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    width: 100%;
    max-width: 440px;
    height: 100dvh;
    padding: 6px 8px;
    box-sizing: border-box;
    user-select: none;
  }
  canvas {
    display: block;
    background: #ffffff;
    touch-action: none;
    cursor: none;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #bar {
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 12px;
    color: #111;
    width: 100%;
    justify-content: space-between;
    background: #fff;
    padding: 6px 10px;
    box-sizing: border-box;
    border-radius: 4px;
  }
  #bar .group { display: flex; gap: 8px; align-items: center; }
  button {
    font: inherit;
    padding: 4px 10px;
    border: 1px solid #111;
    background: #fff;
    cursor: pointer;
    color: #111;
  }
  #scoreline {
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.5px;
  }
  a.back { color: #fff; font-size: 11px; text-align: center; text-decoration: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <div class="group"><span id="scoreline">0 &middot; 0</span></div>
    <div class="group"><button id="serve">serve</button></div>
  </div>
  <canvas id="c" width="440" height="660"></canvas>
  <a class="back" href="index.html">&larr; back</a>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('scoreline');
  const serveBtn = document.getElementById('serve');

  // Iso projection. World units: x: -CW..CW (width), y: -CH..CH (depth), z: height.
  // Screen: sx = ORIGX + (x - y), sy = ORIGY + (x + y) * 0.5 - z
  let W = canvas.width, H = canvas.height;
  const CW = 60, CH = 100, NET_H = 9;
  let ORIGX = 0, ORIGY = 0, SCALE = 1;

  function iso(x, y, z = 0) {
    return {
      x: ORIGX + (x - y) * SCALE,
      y: ORIGY + (x + y) * 0.5 * SCALE - z * SCALE
    };
  }
  // Inverse iso at z=0, for pointer mapping.
  function unproject(px, py) {
    const a = (px - ORIGX) / SCALE;
    const b = (py - ORIGY) * 2 / SCALE;
    return { x: (a + b) / 2, y: (b - a) / 2 };
  }

  function fitCanvas() {
    const rect = canvas.getBoundingClientRect();
    const w = Math.min(480, Math.max(320, Math.round(rect.width)));
    const h = Math.min(900, Math.max(480, Math.round(rect.height)));
    canvas.width = w; canvas.height = h;
    W = w; H = h;
    // Pick scale so the court fits the canvas with a margin.
    const sx = (W - 40) / (2 * CW + 2 * CH);            // horizontal extent = (CW - (-CW)) but iso x-y -> (CW)-(-CH) = CW+CH
    const sy = (H - 80) / ((CW + CH));                  // vertical extent = (CW + CH) at most (top corner y=-CH, bottom corner y=CH)
    SCALE = Math.min(sx, sy);
    ORIGX = W / 2;
    // Vertical centring: court vertical extent goes from iso(-CW,-CH).y to iso(CW,CH).y
    const top = (-CW + -CH) * 0.5 * SCALE;
    const bot = (CW + CH) * 0.5 * SCALE;
    ORIGY = (H - (bot - top)) / 2 - top + 8;
  }

  // --- State ---
  const RACKET_RX = 12;      // half racket width  (world units)
  const RACKET_RY = 7;       // half racket depth
  const RACKET_Z  = 8;       // racket head sits at this height
  const ball = {
    x: 0, y: CH - 30, z: RACKET_Z,
    vx: 0, vy: 0, vz: 0,
    live: false,
    owner: 'player',
    bounced: false,
  };
  const player = { x: 0, y: CH - 20, vx: 0, vy: 0 };
  const cpu    = { x: 0, y: -CH + 20, vx: 0, vy: 0 };
  const pointer = { active: false, x: 0, y: 0, lastT: 0, vx: 0, vy: 0, vxPeak: 0, vyPeak: 0 };

  const score = {
    p: 0, c: 0,
    server: 'player',
    matchOver: null,
    message: 'tap to serve',
  };

  function pointLabel(mine, theirs) {
    const L = ['0', '15', '30', '40'];
    if (mine >= 3 && theirs >= 3) {
      if (mine === theirs) return '40';
      if (mine === theirs + 1) return 'Ad';
      return '40';
    }
    return L[Math.min(mine, 3)];
  }
  function updateScore() {
    if (score.matchOver) {
      scoreEl.textContent = score.matchOver === 'player' ? 'game: you' : 'game: cpu';
    } else if (score.p >= 3 && score.c >= 3 && score.p === score.c) {
      scoreEl.textContent = 'deuce';
    } else if (score.p >= 3 && score.c >= 3 && Math.abs(score.p - score.c) === 1) {
      scoreEl.textContent = score.p > score.c ? 'ad in' : 'ad out';
    } else {
      scoreEl.textContent = `${pointLabel(score.p, score.c)} · ${pointLabel(score.c, score.p)}`;
    }
    serveBtn.textContent = score.matchOver ? 'new game' : 'serve';
  }
  function awardPoint(who, msg) {
    if (score.matchOver) return;
    if (who === 'p') score.p += 1; else score.c += 1;
    const a = who === 'p' ? score.p : score.c;
    const b = who === 'p' ? score.c : score.p;
    if (a >= 4 && a - b >= 2) {
      score.matchOver = who === 'p' ? 'player' : 'cpu';
      score.message = score.matchOver === 'player' ? 'game: you' : 'game: cpu';
    } else {
      score.message = msg || (who === 'p' ? 'point: you' : 'point: cpu');
      score.server = who === 'p' ? 'cpu' : 'player';
    }
    updateScore();
  }
  function newMatch() {
    score.p = 0; score.c = 0;
    score.server = 'player';
    score.matchOver = null;
    score.message = 'new game';
    updateScore();
    resetServe();
  }

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  function resetServe() {
    ball.live = false;
    ball.vx = ball.vy = ball.vz = 0;
    ball.bounced = false;
    if (score.server === 'player') {
      ball.owner = 'player';
      ball.x = player.x;
      ball.y = player.y - 4;
      ball.z = RACKET_Z;
    } else {
      ball.owner = 'cpu';
      ball.x = cpu.x;
      ball.y = cpu.y + 4;
      ball.z = RACKET_Z;
    }
  }
  function serve() {
    if (ball.live || score.matchOver) return;
    if (score.server === 'player') {
      const tx = (Math.random() - 0.5) * (CW * 0.5);
      const ty = -CH + 30;
      const dist = Math.hypot(tx - ball.x, ty - ball.y);
      ball.vx = (tx - ball.x) / dist * SERVE_VY;
      ball.vy = (ty - ball.y) / dist * SERVE_VY;
      ball.vz = SERVE_VZ;
      ball.owner = 'player';
    } else {
      const tx = (Math.random() - 0.5) * (CW * 0.5);
      const ty = CH - 30;
      const dist = Math.hypot(tx - ball.x, ty - ball.y);
      ball.vx = (tx - ball.x) / dist * SERVE_VY;
      ball.vy = (ty - ball.y) / dist * SERVE_VY;
      ball.vz = SERVE_VZ;
      ball.owner = 'cpu';
    }
    ball.live = true;
    ball.bounced = false;
    score.message = '';
  }
  serveBtn.addEventListener('click', () => {
    if (score.matchOver) { newMatch(); return; }
    serve();
  });

  // Convert a screen-space velocity into a world-space velocity at z=0.
  // Inverse of: (sx,sy) = (x - y, (x + y) * 0.5).
  function unprojectVec(vsx, vsy) {
    const a = vsx / SCALE;
    const b = vsy * 2 / SCALE;
    return { x: (a + b) / 2, y: (b - a) / 2 };
  }

  // --- Pointer ---
  function canvasCoords(e) {
    const r = canvas.getBoundingClientRect();
    const sx = canvas.width / r.width;
    const sy = canvas.height / r.height;
    return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
  }
  canvas.addEventListener('pointerdown', e => {
    const p = canvasCoords(e);
    pointer.x = p.x; pointer.y = p.y;
    pointer.lastT = performance.now();
    pointer.vx = pointer.vy = 0;
    pointer.active = true;
    if (score.matchOver) { newMatch(); return; }
    if (!ball.live && score.server === 'player') serve();
  });
  canvas.addEventListener('pointermove', e => {
    e.preventDefault();
    const p = canvasCoords(e);
    const now = performance.now();
    const dt = Math.max(1, now - pointer.lastT);
    pointer.vx = (p.x - pointer.x) / dt * 22;
    pointer.vy = (p.y - pointer.y) / dt * 22;
    if (Math.abs(pointer.vx) > Math.abs(pointer.vxPeak)) pointer.vxPeak = pointer.vx;
    if (Math.abs(pointer.vy) > Math.abs(pointer.vyPeak)) pointer.vyPeak = pointer.vy;
    pointer.x = p.x; pointer.y = p.y; pointer.lastT = now;
    pointer.active = true;
    // Map pointer to player target in world space (only on player's half).
    const w = unproject(p.x, p.y);
    player.tx = clamp(w.x, -CW + 4, CW - 4);
    player.ty = clamp(w.y, 4, CH - 4);
  });
  function endPointer() {
    pointer.active = false;
    pointer.vx *= 0.5; pointer.vy *= 0.5;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', endPointer);

  // --- Update ---
  let tPrev = performance.now();
  // Slow-mo: physics tick scaled to about half normal speed.
  const TIME_SCALE = 0.55;
  const GRAV = 0.012;          // gentle gravity so ball traces a real arc
  // With these values: straight shot covers ~ 2*vy*vz/GRAV ≈ 130 world units,
  // flight time ≈ 2.8 s. Peak height ≈ 23 world units — a clear iso arc.
  const HIT_VY = 1.4;
  const HIT_VZ = 0.56;
  const SERVE_VY = 1.5;
  const SERVE_VZ = 0.55;

  function updatePlayer(dt) {
    const sp = 1.6;
    const tx = player.tx != null ? player.tx : player.x;
    const ty = player.ty != null ? player.ty : player.y;
    const dx = tx - player.x, dy = ty - player.y;
    const d = Math.hypot(dx, dy);
    if (d > 0.01) {
      const step = Math.min(sp * dt, d);
      player.vx = (dx / d) * step / Math.max(dt, 0.001);
      player.vy = (dy / d) * step / Math.max(dt, 0.001);
      player.x += (dx / d) * step;
      player.y += (dy / d) * step;
    } else {
      player.vx = player.vy = 0;
    }
    player.x = clamp(player.x, -CW + 4, CW - 4);
    player.y = clamp(player.y, 4, CH - 4);
  }
  function updateCPU(dt) {
    let tx = cpu.x;
    if (ball.live && ball.vy < 0) {
      const t = (cpu.y - ball.y) / ball.vy;
      if (t > 0) tx = ball.x + ball.vx * t;
    }
    tx = clamp(tx, -CW + 4, CW - 4);
    const sp = 1.2;
    const dx = tx - cpu.x;
    const step = clamp(dx, -sp * dt, sp * dt);
    cpu.vx = step / Math.max(dt, 0.001);
    cpu.x += step;
  }

  function tryHit(side, prevPos) {
    // Hit if ball is near racket (in x,y) and at racket height (in z).
    const r = (side === 'p') ? player : cpu;
    if (ball.z > RACKET_Z + 8 || ball.z < 0.5) return false;
    if (Math.abs(ball.x - r.x) > RACKET_RX) return false;
    // Swept y check using prev position.
    const yMin = Math.min(prevPos.y, ball.y);
    const yMax = Math.max(prevPos.y, ball.y);
    const rMin = r.y - RACKET_RY;
    const rMax = r.y + RACKET_RY;
    if (yMax < rMin || yMin > rMax) return false;
    // Side check
    if (side === 'p' && ball.y < 0) return false;
    if (side === 'c' && ball.y > 0) return false;
    if (side === 'p') {
      const aimX = clamp(r.x * 0.3 + (Math.random() - 0.5) * 12, -CW + 10, CW - 10);
      const tx = aimX, ty = -CH + 25;
      const dist = Math.hypot(tx - ball.x, ty - ball.y);
      ball.vx = (tx - ball.x) / dist * HIT_VY;
      ball.vy = (ty - ball.y) / dist * HIT_VY;
      ball.vz = HIT_VZ;
      ball.owner = 'player';
    } else {
      const aimX = clamp(player.x + (Math.random() - 0.5) * 24, -CW + 10, CW - 10);
      const tx = aimX, ty = CH - 25;
      const dist = Math.hypot(tx - ball.x, ty - ball.y);
      ball.vx = (tx - ball.x) / dist * HIT_VY;
      ball.vy = (ty - ball.y) / dist * HIT_VY;
      ball.vz = HIT_VZ;
      ball.owner = 'cpu';
    }
    ball.bounced = false;
    return true;
  }

  function step(now) {
    let dtMs = Math.min(50, now - tPrev);
    tPrev = now;
    const dt = (dtMs / 16.67) * TIME_SCALE;

    // Pointer flick decay
    const decay = Math.pow(0.94, dt);
    pointer.vxPeak *= decay;
    pointer.vyPeak *= decay;

    updatePlayer(dt);
    updateCPU(dt);

    if (ball.live) {
      const prev = { x: ball.x, y: ball.y, z: ball.z };

      // Net plane crossing: y=0
      const willCross = (prev.y > 0 && (ball.y + ball.vy * dt) < 0) ||
                        (prev.y < 0 && (ball.y + ball.vy * dt) > 0);

      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      ball.z += ball.vz * dt;
      ball.vz -= GRAV * dt;

      if (willCross) {
        // Estimate z when y crosses 0
        const f = Math.abs(prev.y) / (Math.abs(prev.y) + Math.abs(ball.y) + 1e-9);
        const zAtNet = prev.z + (ball.z - prev.z) * f;
        if (zAtNet < NET_H) {
          // Net out
          const who = (ball.owner === 'player') ? 'c' : 'p';
          awardPoint(who, who === 'p' ? 'net: you score' : 'net: cpu scores');
          ball.live = false;
          afterPoint();
          requestAnimationFrame(step); return;
        }
      }

      // Bounce
      if (ball.z <= 0 && ball.vz < 0) {
        ball.z = 0;
        // Out of bounds?
        if (Math.abs(ball.x) > CW || Math.abs(ball.y) > CH) {
          const who = (ball.owner === 'player') ? 'p' : 'c';
          awardPoint(who, who === 'p' ? 'out: you score' : 'out: cpu scores');
          ball.live = false;
          afterPoint();
          requestAnimationFrame(step); return;
        }
        if (!ball.bounced) {
          // Must bounce on opposite side from owner.
          if (ball.owner === 'player' && ball.y > 0) {
            awardPoint('c', 'wrong side: cpu scores');
            ball.live = false; afterPoint();
            requestAnimationFrame(step); return;
          }
          if (ball.owner === 'cpu' && ball.y < 0) {
            awardPoint('p', 'wrong side: you score');
            ball.live = false; afterPoint();
            requestAnimationFrame(step); return;
          }
          ball.bounced = true;
          ball.vz = 0.30;
          ball.vx *= 0.92;
          ball.vy *= 0.92;
        } else {
          // Second bounce on receiver's side: receiver missed.
          const who = (ball.owner === 'player') ? 'p' : 'c';
          awardPoint(who, who === 'p' ? 'point: you' : 'point: cpu');
          ball.live = false; afterPoint();
          requestAnimationFrame(step); return;
        }
      }

      // After bounce, attempt hit on the receiving side.
      if (ball.bounced) {
        if (ball.y > 0) tryHit('p', prev);
        else            tryHit('c', prev);
      }
    } else {
      // Park ball at server's racket
      if (score.server === 'player') { ball.x = player.x; ball.y = player.y - 4; ball.z = RACKET_Z; }
      else                            { ball.x = cpu.x;    ball.y = cpu.y + 4;    ball.z = RACKET_Z; }
    }

    draw();
    requestAnimationFrame(step);
  }

  let autoServeT = null;
  function afterPoint() {
    clearTimeout(autoServeT);
    setTimeout(() => {
      resetServe();
      if (!score.matchOver) {
        autoServeT = setTimeout(() => { if (!ball.live && !score.matchOver) serve(); }, 1100);
      }
    }, 700);
  }

  // --- Drawing (B&W) ---
  function strokeLine(a, b) {
    ctx.beginPath();
    ctx.moveTo(a.x + 0.5, a.y + 0.5);
    ctx.lineTo(b.x + 0.5, b.y + 0.5);
    ctx.stroke();
  }
  function strokePoly(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x + 0.5, pts[0].y + 0.5);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x + 0.5, pts[i].y + 0.5);
    ctx.closePath();
    ctx.stroke();
  }

  function drawCourt() {
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = '#111';

    // Court perimeter
    ctx.lineWidth = 2;
    strokePoly([iso(-CW, -CH), iso(CW, -CH), iso(CW, CH), iso(-CW, CH)]);

    // Service-box hairlines
    ctx.lineWidth = 1;
    strokeLine(iso(-CW, -CH * 0.5), iso(CW, -CH * 0.5));
    strokeLine(iso(-CW,  CH * 0.5), iso(CW,  CH * 0.5));
    strokeLine(iso(0, -CH * 0.5),   iso(0,  CH * 0.5));

    // Net: dashed top band + thin posts + sparse vertical hatch.
    ctx.save();
    // posts
    strokeLine(iso(-CW - 3, 0, 0), iso(-CW - 3, 0, NET_H + 2));
    strokeLine(iso( CW + 3, 0, 0), iso( CW + 3, 0, NET_H + 2));
    // dashed top band
    ctx.setLineDash([4, 4]);
    strokeLine(iso(-CW - 3, 0, NET_H), iso(CW + 3, 0, NET_H));
    ctx.setLineDash([]);
    // light hatch
    ctx.strokeStyle = '#888';
    const N = 16;
    for (let i = 1; i < N; i++) {
      const wx = -CW + (2 * CW) * (i / N);
      strokeLine(iso(wx, 0, 0), iso(wx, 0, NET_H));
    }
    ctx.restore();
  }

  function drawShadow(x, y, z) {
    const s = iso(x, y, 0);
    const k = clamp(1 - z * 0.012, 0.4, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(s.x, s.y, 5 * k * SCALE * 0.5, 2.5 * k * SCALE * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawRacket(p) {
    drawShadow(p.x, p.y, 0);
    const head = iso(p.x, p.y, RACKET_Z);
    const grip = iso(p.x, p.y, 0);
    ctx.strokeStyle = '#111';
    ctx.fillStyle = '#fff';
    ctx.lineWidth = 1.2;
    // Head: oval in iso (not perfectly circular due to projection)
    ctx.beginPath();
    ctx.ellipse(head.x, head.y, RACKET_RX * SCALE, RACKET_RY * SCALE, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // single string line
    ctx.beginPath();
    ctx.moveTo(head.x - RACKET_RX * SCALE + 2, head.y);
    ctx.lineTo(head.x + RACKET_RX * SCALE - 2, head.y);
    ctx.stroke();
    // handle: from head down to ground
    ctx.beginPath();
    ctx.moveTo(head.x + 0.5, head.y + RACKET_RY * SCALE * 0.5);
    ctx.lineTo(grip.x + 0.5, grip.y + 0.5);
    ctx.stroke();
  }

  function drawBall() {
    drawShadow(ball.x, ball.y, ball.z);
    const b = iso(ball.x, ball.y, ball.z);
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(b.x, b.y, Math.max(2.5, 3 * SCALE * 0.5), 0, Math.PI * 2);
    ctx.fill();
  }

  function drawHUD() {
    ctx.fillStyle = '#111';
    ctx.font = '11px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    if (score.message) ctx.fillText(score.message, W / 2, 18);

    if (score.matchOver) {
      const cy = H / 2;
      ctx.globalAlpha = 0.92;
      ctx.fillStyle = '#fff';
      ctx.fillRect(W / 2 - 90, cy - 26, 180, 52);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#111';
      ctx.strokeRect(W / 2 - 89.5, cy - 25.5, 179, 51);
      ctx.fillStyle = '#111';
      ctx.font = '14px ui-monospace, Menlo, monospace';
      ctx.fillText(score.matchOver === 'player' ? 'GAME · YOU' : 'GAME · CPU', W / 2, cy - 4);
      ctx.font = '11px ui-monospace, Menlo, monospace';
      ctx.fillText('tap to play again', W / 2, cy + 14);
    }
  }

  function draw() {
    drawCourt();
    // z-sort the three things by world y so far-side renders behind.
    const items = [
      { y: cpu.y,    f: () => drawRacket(cpu) },
      { y: ball.y,   f: () => drawBall() },
      { y: player.y, f: () => drawRacket(player) },
    ];
    items.sort((a, b) => a.y - b.y);
    items.forEach(it => it.f());
    drawHUD();
  }

  // init
  window.addEventListener('resize', () => { fitCanvas(); resetServe(); });
  fitCanvas();
  updateScore();
  resetServe();
  // Auto-start: CPU serves first so the rally takes off without any input.
  score.server = 'cpu';
  resetServe();
  setTimeout(() => { if (!ball.live && !score.matchOver) serve(); }, 1200);
  requestAnimationFrame(t => { tPrev = t; step(t); });
})();
</script>
</body>
</html>
