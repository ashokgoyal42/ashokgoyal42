<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IsoSquash</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #2a2a2a;
    overflow: hidden;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #111;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    width: 100%;
    max-width: 440px;
    height: 100dvh;
    padding: 6px 8px;
    box-sizing: border-box;
    user-select: none;
  }
  canvas {
    display: block;
    background: #ffffff;
    touch-action: none;
    cursor: none;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #bar {
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 12px;
    color: #111;
    width: 100%;
    justify-content: space-between;
    background: #fff;
    padding: 6px 10px;
    box-sizing: border-box;
    border-radius: 4px;
  }
  #bar .group { display: flex; gap: 8px; align-items: center; }
  button {
    font: inherit;
    padding: 4px 10px;
    border: 1px solid #111;
    background: #fff;
    cursor: pointer;
    color: #111;
  }
  #scoreline {
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.5px;
  }
  #best { color: #555; font-size: 11px; }
  a.back { color: #fff; font-size: 11px; text-align: center; text-decoration: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <div class="group">
      <span id="scoreline">rally 0</span>
      <span id="best">best 0</span>
    </div>
    <div class="group"><button id="serve">serve</button></div>
  </div>
  <canvas id="c" width="440" height="660"></canvas>
  <a class="back" href="index.html">&larr; back</a>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('scoreline');
  const bestEl  = document.getElementById('best');
  const serveBtn = document.getElementById('serve');

  // Iso projection. World units: x: -CW..CW (court width),
  //                              y: 0..CH  (front wall at y=0, back wall = front opening at y=CH),
  //                              z: height (floor at z=0, ceiling unbounded).
  // Front wall sits at y = 0. Player and ball live at y > 0.
  let W = canvas.width, H = canvas.height;
  const CW = 60;       // half court width
  const CH = 160;      // court depth (player can roam from y=8 to y=CH-4)
  const WALL_H = 50;   // height of the front wall (visual + collision cap)
  const TIN_H = 8;     // bottom of valid wall: ball must hit wall ABOVE this height.
  let ORIGX = 0, ORIGY = 0, SCALE = 1;

  function iso(x, y, z = 0) {
    return {
      x: ORIGX + (x - y) * SCALE,
      y: ORIGY + (x + y) * 0.5 * SCALE - z * SCALE
    };
  }
  function unproject(px, py) {
    const a = (px - ORIGX) / SCALE;
    const b = (py - ORIGY) * 2 / SCALE;
    return { x: (a + b) / 2, y: (b - a) / 2 };
  }

  function fitCanvas() {
    const rect = canvas.getBoundingClientRect();
    const w = Math.min(480, Math.max(320, Math.round(rect.width)));
    const h = Math.min(900, Math.max(480, Math.round(rect.height)));
    canvas.width = w; canvas.height = h;
    W = w; H = h;
    // Horizontal extent of the floor (corners): from (-CW,CH) to (CW,0)
    //   x range = (CW - 0) - (-CW - CH) = 2*CW + CH
    const horizExtent = 2 * CW + CH;
    // Vertical extent: from iso(-CW,0,WALL_H).y (top-left of wall) to iso(CW,CH).y (front-right floor)
    //   top = (-CW + 0)*0.5 - WALL_H
    //   bot = (CW + CH)*0.5
    const top = -CW * 0.5 - WALL_H;
    const bot = (CW + CH) * 0.5;
    const vertExtent = bot - top;
    const sx = (W - 24) / horizExtent;
    const sy = (H - 24) / vertExtent;
    SCALE = Math.min(sx, sy);
    ORIGX = W / 2 - ((-CW + CH) * 0.5) * SCALE; // centre the floor horizontally
    ORIGY = 12 - top * SCALE;                   // pin top to the canvas top
  }

  // --- State ---
  const RACKET_RX = 12;     // half racket width  (world units)
  const RACKET_RY = 7;      // half racket depth
  const RACKET_Z  = 8;
  const ball = {
    x: 0, y: CH * 0.6, z: RACKET_Z,
    vx: 0, vy: 0, vz: 0,
    live: false,
    bounces: 0,           // floor bounces since last wall hit
    lastTouch: 'none',    // 'wall' | 'racket' | 'none'
  };
  const player = { x: 0, y: CH * 0.6, vx: 0, vy: 0, tx: null, ty: null };
  const pointer = { active: false, x: 0, y: 0 };

  let rally = 0;
  let best = parseInt(localStorage.getItem('isosquash_best') || '0', 10);
  let message = 'auto-serving…';
  let messageT = 60;
  let dead = false;

  function setMessage(s, frames = 90) { message = s; messageT = frames; }
  function refreshHUD() {
    scoreEl.textContent = `rally ${rally}`;
    bestEl.textContent  = `best ${best}`;
  }

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  function resetServe() {
    ball.live = false;
    ball.vx = ball.vy = ball.vz = 0;
    ball.bounces = 0;
    ball.lastTouch = 'none';
    ball.x = player.x;
    ball.y = player.y - 4;
    ball.z = RACKET_Z;
    dead = false;
  }
  function serve() {
    if (ball.live) return;
    // Send the ball toward the front wall (y=0), with a slight angle and arc.
    const targetX = (Math.random() - 0.5) * (CW * 0.7);
    const targetY = 0;
    const dx = targetX - ball.x;
    const dy = targetY - ball.y;
    const dist = Math.hypot(dx, dy);
    const speed = 1.7;
    ball.vx = (dx / dist) * speed;
    ball.vy = (dy / dist) * speed;       // negative (toward wall)
    ball.vz = 0.55;
    ball.live = true;
    ball.bounces = 0;
    ball.lastTouch = 'racket';           // count the serve as the first racket touch
    setMessage('go!', 30);
  }
  serveBtn.addEventListener('click', () => {
    if (dead) { rally = 0; refreshHUD(); resetServe(); }
    serve();
  });

  // --- Pointer ---
  function canvasCoords(e) {
    const r = canvas.getBoundingClientRect();
    const sx = canvas.width / r.width;
    const sy = canvas.height / r.height;
    return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
  }
  function setTargetFromPointer(p) {
    const w = unproject(p.x, p.y);
    player.tx = clamp(w.x, -CW + 4, CW - 4);
    player.ty = clamp(w.y, 8, CH - 4);
  }
  canvas.addEventListener('pointerdown', e => {
    const p = canvasCoords(e);
    pointer.x = p.x; pointer.y = p.y;
    pointer.active = true;
    setTargetFromPointer(p);
    if (dead) { rally = 0; refreshHUD(); resetServe(); serve(); return; }
    if (!ball.live) serve();
  });
  canvas.addEventListener('pointermove', e => {
    e.preventDefault();
    const p = canvasCoords(e);
    pointer.x = p.x; pointer.y = p.y;
    pointer.active = true;
    setTargetFromPointer(p);
  });
  function endPointer() { pointer.active = false; }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', endPointer);

  // --- Update ---
  let tPrev = performance.now();
  const TIME_SCALE = 0.55;
  const GRAV = 0.012;

  function updatePlayer(dt) {
    const sp = 1.6;
    const tx = player.tx != null ? player.tx : player.x;
    const ty = player.ty != null ? player.ty : player.y;
    const dx = tx - player.x, dy = ty - player.y;
    const d = Math.hypot(dx, dy);
    if (d > 0.01) {
      const step = Math.min(sp * dt, d);
      player.vx = (dx / d) * step / Math.max(dt, 0.001);
      player.vy = (dy / d) * step / Math.max(dt, 0.001);
      player.x += (dx / d) * step;
      player.y += (dy / d) * step;
    } else {
      player.vx = player.vy = 0;
    }
    player.x = clamp(player.x, -CW + 4, CW - 4);
    player.y = clamp(player.y, 8, CH - 4);
  }

  function tryHit(prevPos) {
    if (ball.z > RACKET_Z + 10 || ball.z < 0.5) return false;
    if (Math.abs(ball.x - player.x) > RACKET_RX) return false;
    const yMin = Math.min(prevPos.y, ball.y);
    const yMax = Math.max(prevPos.y, ball.y);
    const rMin = player.y - RACKET_RY;
    const rMax = player.y + RACKET_RY;
    if (yMax < rMin || yMin > rMax) return false;
    // Only hit balls that are heading TOWARD the player (i.e. away from wall: vy > 0).
    if (ball.vy <= 0) return false;
    // Send ball back to wall. Aim slightly off-centre based on racket position.
    const aimX = clamp(player.x * -0.3 + (Math.random() - 0.5) * 12, -CW + 8, CW - 8);
    const aimY = 0;
    const dx = aimX - ball.x, dy = aimY - ball.y;
    const dist = Math.hypot(dx, dy);
    const speed = 1.7;
    ball.vx = (dx / dist) * speed;
    ball.vy = (dy / dist) * speed;
    ball.vz = 0.55;
    ball.bounces = 0;
    ball.lastTouch = 'racket';
    rally += 1;
    if (rally > best) { best = rally; localStorage.setItem('isosquash_best', String(best)); }
    refreshHUD();
    setMessage('thwack', 16);
    return true;
  }

  function endRally(reason) {
    if (!ball.live) return;
    ball.live = false;
    dead = true;
    setMessage(reason + ' — tap to play', 0);
    serveBtn.textContent = 'play';
  }

  function step(now) {
    let dtMs = Math.min(50, now - tPrev);
    tPrev = now;
    const dt = (dtMs / 16.67) * TIME_SCALE;

    updatePlayer(dt);

    if (ball.live) {
      const prev = { x: ball.x, y: ball.y, z: ball.z };

      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      ball.z += ball.vz * dt;
      ball.vz -= GRAV * dt;

      // Side-wall reflections (left/right walls of the squash court).
      if (ball.x < -CW) {
        ball.x = -CW + (-CW - ball.x);
        ball.vx = Math.abs(ball.vx) * 0.95;
      } else if (ball.x > CW) {
        ball.x = CW - (ball.x - CW);
        ball.vx = -Math.abs(ball.vx) * 0.95;
      }

      // Front wall: y <= 0. Ball must clear the tin (z > TIN_H) to continue.
      if (ball.y <= 0 && ball.vy < 0) {
        // Find z at impact
        const f = prev.y / (prev.y - ball.y + 1e-9);     // 0..1
        const zAtWall = prev.z + (ball.z - prev.z) * f;
        if (zAtWall < TIN_H) {
          endRally('tin!');
        } else {
          ball.y = 0 + (-ball.y) * 0.0;   // park on wall plane (will get pushed back below)
          ball.y = -ball.y;                // reflect any overshoot
          ball.vy = -ball.vy * 0.95;
          ball.vx *= 0.98;
          ball.lastTouch = 'wall';
          ball.bounces = 0;                // wall hit clears bounces
          if (ball.y < 0.5) ball.y = 0.5;  // nudge off the wall
        }
      }

      if (ball.live) {
        // Floor bounce
        if (ball.z <= 0 && ball.vz < 0) {
          ball.z = 0;
          ball.bounces += 1;
          if (ball.bounces >= 2) {
            endRally('two bounces!');
          } else {
            // Between racket touches with no wall hit = also a fault.
            if (ball.lastTouch === 'racket' && ball.vy > 0) {
              // Player hit but ball never reached the wall — fault.
              // (Player aimed back-court without hitting wall.)
              endRally('missed wall!');
            } else {
              ball.vz = 0.42;
              ball.vx *= 0.93;
              ball.vy *= 0.93;
            }
          }
        }
      }

      if (ball.live) {
        // Out the back of the court — also dead.
        if (ball.y > CH + 4) {
          endRally('back wall out!');
        }
      }

      if (ball.live) {
        // Try racket contact only if ball is heading away from wall (toward player).
        if (ball.vy > 0) tryHit(prev);
      }
    } else {
      // Park ball at racket
      ball.x = player.x;
      ball.y = player.y - 4;
      ball.z = RACKET_Z;
    }

    if (messageT > 0) messageT--;

    draw();
    requestAnimationFrame(step);
  }

  // --- Drawing (B&W) ---
  function strokeLine(a, b) {
    ctx.beginPath();
    ctx.moveTo(a.x + 0.5, a.y + 0.5);
    ctx.lineTo(b.x + 0.5, b.y + 0.5);
    ctx.stroke();
  }
  function strokePoly(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x + 0.5, pts[0].y + 0.5);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x + 0.5, pts[i].y + 0.5);
    ctx.closePath();
    ctx.stroke();
  }
  function fillPoly(pts, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    ctx.fill();
  }

  function drawCourt() {
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);

    // FRONT WALL (filled light, then outlined). It's the rectangle at y=0, going up to WALL_H.
    const wBL = iso(-CW, 0, 0);
    const wBR = iso( CW, 0, 0);
    const wTR = iso( CW, 0, WALL_H);
    const wTL = iso(-CW, 0, WALL_H);
    fillPoly([wBL, wBR, wTR, wTL], '#f4f4f4');
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 2;
    strokePoly([wBL, wBR, wTR, wTL]);

    // Tin line on the front wall (target line: hits BELOW this lose).
    ctx.lineWidth = 1.5;
    strokeLine(iso(-CW, 0, TIN_H), iso(CW, 0, TIN_H));

    // Service line on the wall (decorative, classic squash midline).
    ctx.lineWidth = 1;
    ctx.save();
    ctx.setLineDash([4, 3]);
    strokeLine(iso(-CW, 0, WALL_H * 0.55), iso(CW, 0, WALL_H * 0.55));
    ctx.restore();

    // FLOOR perimeter
    ctx.lineWidth = 2;
    strokePoly([iso(-CW, 0), iso(CW, 0), iso(CW, CH), iso(-CW, CH)]);

    // Short line (across) and half-court line (down the middle of the back half).
    ctx.lineWidth = 1;
    strokeLine(iso(-CW, CH * 0.55), iso(CW, CH * 0.55));
    strokeLine(iso(0, CH * 0.55), iso(0, CH));

    // Service boxes on the back half — small 20x20 squares either side of the half line.
    const sboxY1 = CH * 0.55;
    const sboxY2 = CH * 0.55 + 30;
    const sboxX  = 30;
    strokePoly([iso(-sboxX, sboxY1), iso(0, sboxY1), iso(0, sboxY2), iso(-sboxX, sboxY2)]);
    strokePoly([iso(sboxX, sboxY1),  iso(0, sboxY1), iso(0, sboxY2), iso(sboxX,  sboxY2)]);
  }

  function drawShadow(x, y, z) {
    const s = iso(x, y, 0);
    const k = clamp(1 - z * 0.012, 0.4, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(s.x, s.y, 5 * k * SCALE * 0.5, 2.5 * k * SCALE * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawRacket(p) {
    drawShadow(p.x, p.y, 0);
    const head = iso(p.x, p.y, RACKET_Z);
    const grip = iso(p.x, p.y, 0);
    ctx.strokeStyle = '#111';
    ctx.fillStyle = '#fff';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(head.x, head.y, RACKET_RX * SCALE, RACKET_RY * SCALE, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(head.x - RACKET_RX * SCALE + 2, head.y);
    ctx.lineTo(head.x + RACKET_RX * SCALE - 2, head.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(head.x + 0.5, head.y + RACKET_RY * SCALE * 0.5);
    ctx.lineTo(grip.x + 0.5, grip.y + 0.5);
    ctx.stroke();
  }

  function drawBall() {
    drawShadow(ball.x, ball.y, ball.z);
    const b = iso(ball.x, ball.y, ball.z);
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(b.x, b.y, Math.max(2.5, 3 * SCALE * 0.5), 0, Math.PI * 2);
    ctx.fill();
  }

  function drawHUD() {
    if (message && messageT >= 0) {
      ctx.fillStyle = '#111';
      ctx.font = '11px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(message, W / 2, 16);
    }
  }

  function draw() {
    drawCourt();
    drawRacket(player);
    drawBall();
    drawHUD();
  }

  // init
  window.addEventListener('resize', () => { fitCanvas(); resetServe(); });
  fitCanvas();
  refreshHUD();
  resetServe();
  setTimeout(() => { if (!ball.live && !dead) serve(); }, 900);
  requestAnimationFrame(t => { tPrev = t; step(t); });
})();
</script>
</body>
</html>
